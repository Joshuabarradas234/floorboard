<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Floorboard</title>
<!-- The floating button that stands in for the sidebar while it's closed: click it to open the sidebar, drag it anywhere. -->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { display: grid; place-items: center; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  button {
    position: relative; width: 56px; height: 56px; border-radius: 17px; padding: 0; cursor: pointer; outline: none;
    border: 1px solid rgba(255, 244, 232, .34);
    background:
      linear-gradient(155deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .06) 46%, rgba(255, 255, 255, 0) 60%),
      linear-gradient(160deg, rgba(92, 70, 52, .92), rgba(38, 28, 21, .94));
    box-shadow: 0 10px 24px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -2px 6px rgba(0, 0, 0, .25);
    display: grid; place-items: center; transition: transform .18s ease, box-shadow .18s ease;
  }
  button::after { content: ""; position: absolute; inset: 2px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, .08); pointer-events: none; }
  button:hover { transform: translateY(-1px) scale(1.05); box-shadow: 0 14px 28px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .4), inset 0 -2px 6px rgba(0, 0, 0, .25); }
  button:active { transform: scale(.95); }
  button:focus-visible { box-shadow: 0 0 0 3px rgba(255, 181, 71, .7); }
  .dragging button { cursor: grabbing; transform: scale(1.06); }
  svg { width: 40px; height: 40px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .35)); }
  .badge {
    position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px;
    background: #6b5444; color: #fff4e8; font: 700 11px/20px "Segoe UI", sans-serif; text-align: center; border: 2px solid #261c15;
  }
  .badge.urgent { background: #ff6b57; }
  .badge[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<button id="b" type="button" aria-label="Open the Floorboard sidebar" title="Floorboard: click to open the sidebar, drag to move">
  <svg viewBox="0 0 512 512" aria-hidden="true"><rect x="122.88" y="133.12" width="266.24" height="51.2" rx="25.6" fill="#ff6b57"/><rect x="122.88" y="215.04" width="194.56" height="51.2" rx="25.6" fill="#ffb547"/><rect x="122.88" y="296.96" width="112.64" height="51.2" rx="25.6" fill="#4fd688"/></svg>
  <span class="badge" id="n" hidden></span>
</button>
<script>
  const b = document.getElementById('b'), n = document.getElementById('n'), api = window.floorboardBubble;
  // a press that moves more than a few pixels is a drag; otherwise it's a click
  let start = null, dragging = false;
  b.addEventListener('pointerdown', (e) => { if (e.button !== 0) return; start = { x: e.screenX, y: e.screenY }; dragging = false; b.setPointerCapture(e.pointerId); });
  b.addEventListener('pointermove', (e) => {
    if (start === null) return;
    const dx = e.screenX - start.x, dy = e.screenY - start.y;
    if (!dragging && Math.hypot(dx, dy) > 4) { dragging = true; document.body.classList.add('dragging'); }
    if (dragging) api.drag(dx, dy);
  });
  b.addEventListener('pointerup', () => { if (start === null) return; start = null; document.body.classList.remove('dragging'); if (dragging) api.drop(); else api.toggle(); });
  b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); api.toggle(); } });
  api.onState(({ count, urgent }) => {
    n.hidden = !count; n.textContent = count > 99 ? '99+' : String(count); n.classList.toggle('urgent', !!urgent);
    b.setAttribute('aria-label', 'Open the Floorboard sidebar' + (count ? ', ' + count + (count === 1 ? ' thing needs' : ' things need') + ' you' : ''));
  });
</script>
</body>
</html>
