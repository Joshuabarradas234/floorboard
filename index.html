  </div>`;
}

/* ---------------- composer ---------------- */
function Composer({ preset, onClose }) {
  const { db, user, update, toast, go } = useApp();
  const [type, setType] = useState(preset.type || 'task');
  const [to, setTo] = useState(preset.to || []);
  const [q, setQ] = useState(''); const [open, setOpen] = useState(false); const [hi, setHi] = useState(0);
  const [about, setAbout] = useState(preset.about || '');
  const [level, setLevel] = useState(preset.level || 'amber');
  const [title, setTitle] = useState(preset.title || ''); const [body, setBody] = useState(preset.body || ''); const [due, setDue] = useState(preset.due || '');
  const [files, setFiles] = useState([]);
  const [ap, setAp] = useState({ kind: 'Invoice', party: '', amount: '', ref: '', rule: 'any' });
  const setA = (k, v) => { setAp((o) => ({ ...o, [k]: v })); setErr(''); };
  const amount = Number(String(ap.amount).replace(/[\sR]/g, '').replace(',', '.')) || 0;
  const [opts, setOpts] = useState(['', '']); const [multi, setMulti] = useState(false); const [closes, setCloses] = useState(keyPlus(3));
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);
  const qq = q.replace(/^@/, '').trim().toLowerCase();
  const sugs = useMemo(() => {
    const has = (k, id) => to.some((x) => x.k === k && x.id === id);
    const teams = [...(db.groups || []).filter((g) => !g.archived), PSEUDO.all, PSEUDO.managers, ...db.depts].filter((d) => !has('d', d.id) && (!qq || d.name.toLowerCase().includes(qq)))
      .map((d) => ({ k: 'd', id: d.id, label: d.name, sub: (isGroupId(d.id) ? GROUP_KINDS[d.kind] || 'Group' : 'Team') + ' · ' + deptMembers(db, d.id).filter((i) => i !== user.id).length + ' people', color: d.color }));
    const people = db.users.filter((u) => u.active !== false && u.id !== user.id && !has('u', u.id) && (!qq || u.name.toLowerCase().includes(qq) || u.title.toLowerCase().includes(qq)))
      .map((u) => ({ k: 'u', id: u.id, label: u.name, sub: u.title + ' · ' + u.depts.map((d) => deptById(db, d).name).join(', '), u }));
    return [...teams, ...people].slice(0, 10);
  }, [qq, to, db]);
  const add = (s) => { setTo((prev) => [...prev, { k: s.k, id: s.id }]); setQ(''); setHi(0); setOpen(false); if (!about && s.k === 'd' && !PSEUDO[s.id] && !isGroupId(s.id)) setAbout(s.id); if (!about && s.k === 'u') setAbout(type === 'approval' ? user.depts[0] : userById(db, s.id).depts[0]); setErr(''); inputRef.current && inputRef.current.focus(); };
  const toUsers = to.filter((x) => x.k === 'u').map((x) => x.id); const toDepts = to.filter((x) => x.k === 'd').map((x) => x.id);
  const reach = expand(db, toUsers, toDepts, user.id);
  const onKey = (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setHi((h) => Math.min(h + 1, sugs.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
    else if (e.key === 'Enter' || e.key === 'Tab') { if (open && q && sugs[hi]) { e.preventDefault(); add(sugs[hi]); } else if (e.key === 'Enter') e.preventDefault(); }
    else if (e.key === 'Backspace' && !q && to.length) setTo((prev) => prev.slice(0, -1));
    else if (e.key === 'Escape' && open) { e.stopPropagation(); setOpen(false); }
  };
  async function submit() {
    if (!reach.length) return setErr('Tag at least one person or team with @.');
    if (type === 'approval' && ap.kind !== 'Other' && !(amount > 0)) return setErr('Put in the amount, so the approver knows what they’re OK-ing.');
    if (type === 'approval' && !ap.party.trim() && !title.trim()) return setErr('Say who gets paid, like the supplier’s name.');
    if (!title.trim() && type !== 'approval') return setErr('Give it a short title so people know what it’s about.');
    const options = opts.map((o) => o.trim()).filter(Boolean);
    if (type === 'vote' && options.length < 2) return setErr('A vote needs at least two options.');
    setBusy(true);
    const atts = await storeFiles(files);
    const no = db.counter + 1;
    update((d) => {
      d.counter = Math.max(d.counter + 1, no);
      const recips = {}; expand(d, toUsers, toDepts, user.id).forEach((id) => { recips[id] = { status: 'todo', pct: 0, seen: null, updatedAt: null }; });
      const pid = uid('p'), now = Date.now();
      const chats = toDepts.map((td) => d.chats.find((c) => c.dept === td)).filter(Boolean);
      chats.forEach((c) => d.messages.push({ id: uid('m'), chat: c.id, user: user.id, at: now, text: '', attachments: [], mentions: [], replyTo: null, postId: pid, kind: 'msg' }));
      d.posts.unshift({ id: pid, chat: chats[0] ? chats[0].id : null, no: d.counter, type, title: type === 'approval' && !title.trim() ? apTitle(ap.kind, ap.party.trim(), amount) : title.trim(), body: body.trim(), author: user.id, createdAt: now, toUsers, toDepts,
        about: about || user.depts[0], level, due: (type === 'task' || type === 'approval') && due ? due : null, attachments: atts, recips, activity: [],
        poll: type === 'vote' ? { multi, closes, options: options.map((t, i) => ({ id: 'o' + (i + 1), text: t })), votes: {} } : null, closed: false,
        ...(type === 'approval' ? { approval: { kind: ap.kind, party: ap.party.trim(), amount, ref: ap.ref.trim(), rule: Object.keys(recips).length > 1 ? ap.rule : 'any', approvers: Object.keys(recips), paidAt: null, paidBy: null, payNote: '' } } : {}) });
    });
    toast('#' + no + ' sent to ' + reach.length + (reach.length === 1 ? ' person' : ' people'));
    onClose(); go(type === 'approval' ? 'approvals' : 'sent');
  }
  const footer = html`<span className="reach">${reach.length ? 'Reaches ' + reach.length + (reach.length === 1 ? ' person' : ' people') : 'Tag someone to send'}</span>
    <button className="btn" onClick=${onClose}>Cancel</button>
    <button className="btn primary" onClick=${submit} disabled=${busy}><${Icon} n="send" s=${16}/>${busy ? 'Sending…' : 'Send'}</button>`;
  return html`<${Modal} title="New post" onClose=${onClose} wide footer=${footer}>
    <div className="field"><span>What is it?</span>
      <div className="typepick">${shownTypes(db).map((t) => html`<button type="button" key=${t} className=${type === t ? 'on' : ''} onClick=${() => setType(t)} aria-pressed=${type === t}><b><${Icon} n=${TYPES[t].icon} s=${16}/>${TYPES[t].label}</b><small>${TYPES[t].hint}</small></button>`)}</div>
    </div>
    <div className="field tofield"><span>${type === 'approval' ? 'Who approves it' : 'Tag people or teams'}</span>
      <div className="tobox" onClick=${() => inputRef.current && inputRef.current.focus()}>
        ${to.map((x) => { const isD = x.k === 'd'; const d = isD ? deptById(db, x.id) : null; return html`<span key=${x.k + x.id} className=${'tag' + (isD ? ' team' : '')} style=${isD ? { '--c': d.color } : null}>@${isD ? d.name : userById(db, x.id).name}<button type="button" aria-label="Remove" onClick=${(e) => { e.stopPropagation(); setTo((prev) => prev.filter((y) => !(y.k === x.k && y.id === x.id))); }}><${Icon} n="close" s=${12}/></button></span>`; })}
        <input id="to-input" ref=${inputRef} value=${q} onChange=${(e) => { setQ(e.target.value); setOpen(true); setHi(0); }} onFocus=${() => setOpen(!to.length)} onBlur=${() => setTimeout(() => setOpen(false), 150)} onKeyDown=${onKey} placeholder=${to.length ? 'Add more…' : 'Type @ and a name or team, e.g. @Bakery'} aria-label="Tag people or teams" autoComplete="off"/>
      </div>
      ${open && sugs.length > 0 && html`<div className="sugs" role="listbox">${sugs.map((s, i) => html`<button type="button" key=${s.k + s.id} className=${'sug' + (i === hi ? ' hi' : '')} onMouseDown=${(e) => { e.preventDefault(); add(s); }} onMouseEnter=${() => setHi(i)}>
        ${s.k === 'd' ? html`<span className="sq" style=${{ '--c': s.color }}>@</span>` : html`<${Avatar} u=${s.u} s=${28}/>`}
        <span><b>${s.label}</b><div className="sug-sub">${s.sub}</div></span></button>`)}</div>`}
      ${reach.length > 0 && html`<small className="reach-line">Goes to ${reach.slice(0, 6).map((id) => firstName(userById(db, id))).join(', ')}${reach.length > 6 ? ' and ' + (reach.length - 6) + ' more' : ''}. It shows on their board until they act on it.</small>`}
    </div>
    ${type === 'approval' && html`<div className="field"><span>What needs approving</span><div className="seg" role="group">${AP_KINDS.map((k) => html`<button type="button" key=${k} className=${ap.kind === k ? 'on' : ''} onClick=${() => setA('kind', k)} aria-pressed=${ap.kind === k}>${k}</button>`)}</div></div>
      <div className="row2">
        <label className="field"><span>Supplier or payee</span><input id="c-party" className="input" value=${ap.party} onChange=${(e) => setA('party', e.target.value)} placeholder="e.g. SunPack Produce" maxLength="80"/></label>
        <label className="field"><span>Amount</span><input id="c-amount" className="input mono" inputMode="decimal" value=${ap.amount} onChange=${(e) => setA('amount', e.target.value)} placeholder="R 0.00" maxLength="16"/>${amount > 0 && html`<small>${rand(amount)}</small>`}</label>
      </div>
      <div className="row2">
        <label className="field"><span>Invoice or reference number (optional)</span><input id="c-ref" className="input mono" value=${ap.ref} onChange=${(e) => setA('ref', e.target.value)} placeholder="e.g. INV-20931" maxLength="40"/></label>
        ${reach.length > 1 ? html`<div className="field"><span>Who has to approve</span><div className="seg" role="group"><button type="button" className=${ap.rule === 'any' ? 'on' : ''} onClick=${() => setA('rule', 'any')}>Any one of them</button><button type="button" className=${ap.rule === 'all' ? 'on' : ''} onClick=${() => setA('rule', 'all')}>All of them</button></div></div>` : html`<div></div>`}
      </div>`}
    <div className="row2">
      <label className="field"><span>Related to</span><select id="c-about" className="select" value=${about} onChange=${(e) => setAbout(e.target.value)}><option value="">Choose a department</option>${db.depts.map((d) => html`<option key=${d.id} value=${d.id}>${d.name}</option>`)}</select></label>
      ${type === 'task' || type === 'approval' ? html`<label className="field"><span>${type === 'approval' ? 'Pay by (optional)' : 'Due date (optional)'}</span><input id="c-due" className="input" type="date" min=${dkey()} value=${due} onChange=${(e) => setDue(e.target.value)}/></label>`
        : type === 'vote' ? html`<label className="field"><span>Voting closes</span><input id="c-closes" className="input" type="date" min=${dkey()} value=${closes} onChange=${(e) => setCloses(e.target.value)}/></label>` : html`<div></div>`}
    </div>
    <div className="field"><span>Attention level</span>
      <div className="lvlpick">${LEVEL_KEYS.map((l) => html`<button type="button" key=${l} className=${l + (level === l ? ' on' : '')} onClick=${() => setLevel(l)} aria-pressed=${level === l}><b><span className=${'ldot ' + l} style=${{ width: 10, height: 10, borderRadius: '50%', display: 'inline-block' }}></span>${{ red: 'Red', amber: 'Amber', green: 'Green' }[l]} · ${LEVELS[l].label}</b><small>${{ red: 'Needs attention now', amber: 'Important, not urgent', green: 'General, when you can' }[l]}</small></button>`)}</div>
    </div>

    ${type === 'vote' && html`<div className="field"><span>Options</span><div className="poll-edit">

      <label className="sm" style=${{ display: 'flex', gap: 6, alignItems: 'center' }}><input type="checkbox" checked=${multi} onChange=${(e) => setMulti(e.target.checked)}/>People can pick more than one</label></div>

/* ---------------- team progress ---------------- */
function TeamView() {
  const { db, user, openPost, update, toast } = useApp();
  const options = user.role === 'admin' ? [{ id: 'all', name: 'Whole store', color: '#5E6B65' }, ...db.depts] : db.depts.filter((d) => user.manages.includes(d.id));
  const [sel, setSel] = useState(options[0] ? options[0].id : null);
  const [openRow, setOpenRow] = useState(null);
  if (!sel) return html`<${Page} title="Team progress"><div className="empty"><h3>You don’t manage a team yet</h3><p>An admin can make you the manager of a department.</p></div><//>`;
  const memberIds = (sel === 'all' ? db.users.filter((u) => u.active !== false).map((u) => u.id) : deptMembers(db, sel)).filter((id) => id !== user.id);
  const tasks = db.posts.filter((p) => p.type === 'task' && !p.closed);
  const rows = memberIds.map((id) => {
    const mine = tasks.filter((p) => p.recips[id]);
    const open = mine.filter((p) => p.recips[id].status !== 'done');
    const avg = open.length ? Math.round(open.reduce((a, p) => a + (p.recips[id].pct || 0), 0) / open.length) : null;
    return { u: userById(db, id), open, overdue: open.filter((p) => isOverdue(p, id)), stale: open.filter((p) => isStale(p, id)),
      doneWeek: mine.filter((p) => p.recips[id].status === 'done' && (p.recips[id].updatedAt || 0) > Date.now() - 7 * DAY), avg,
      waiting: db.posts.filter((p) => p.type !== 'task' && needsMe(p, id)).length };
  }).sort((a, b) => b.overdue.length - a.overdue.length || b.stale.length - a.stale.length || b.open.length - a.open.length);
  const sum = (k) => rows.reduce((a, r) => a + r[k].length, 0);
  const nudge = (p, id) => { update((d) => { const q = d.posts.find((x) => x.id === p.id); q.recips[id].nudgedAt = Date.now(); q.recips[id].seen = null; q.activity.push({ id: uid('e'), kind: 'system', user: user.id, at: Date.now(), text: 'nudged ' + userById(d, id).name + ' for a progress update' }); }); toast('Nudged ' + firstName(userById(db, id))); };
  return html`<${Page} title="Team progress" sub="How far along each person is with the tasks they’ve been given, whoever gave them. People who haven’t posted an update in 2 days are flagged.">
    ${options.length > 1 && html`<div className="filters"><div className="seg" role="group" aria-label="Team">${options.map((o) => html`<button key=${o.id} className=${sel === o.id ? 'on' : ''} onClick=${() => { setSel(o.id); setOpenRow(null); }}>${o.name}</button>`)}</div></div>`}
    <div className="stats">
      <div className="stat"><b>${sum('open')}</b><span>Open tasks</span></div>
      <div className=${'stat' + (sum('overdue') ? ' bad' : '')}><b>${sum('overdue')}</b><span>Overdue</span></div>
      <div className=${'stat' + (sum('stale') ? ' warn' : '')}><b>${sum('stale')}</b><span>No update in 2+ days</span></div>
      <div className="stat ok"><b>${sum('doneWeek')}</b><span>Done in the last 7 days</span></div>
    </div>
    <div style=${{ display: 'grid', gap: 8 }}>
      <div className="mhead"><span>Person</span><span>Open</span><span>Avg progress</span><span>Overdue</span><span>No update</span><span></span></div>
      ${rows.length === 0 && html`<div className="empty"><p>No one else is in this team yet.</p></div>`}
      ${rows.map((r) => { const isOpen = openRow === r.u.id; return html`<div className="mrow" key=${r.u.id}>
        <button className="mrow-h" onClick=${() => setOpenRow(isOpen ? null : r.u.id)} aria-expanded=${isOpen}>
          <span className="who"><${Avatar} u=${r.u} s=${32}/><span style=${{ minWidth: 0 }}><b style=${{ display: 'block' }}>${r.u.name}</b><span className="muted sm">${r.u.title}${r.waiting ? ' · ' + r.waiting + ' other item' + (r.waiting === 1 ? '' : 's') + ' waiting' : ''}</span></span></span>
          <span className="num"><span className="lab">Open </span>${r.open.length}</span>
          <span style=${{ display: 'flex', alignItems: 'center', gap: 8 }}><span className="lab">Avg </span>${r.avg == null ? html`<span className="muted sm">–</span>` : html`<span className="bar"><i style=${{ width: r.avg + '%' }}></i></span><span className="mono sm">${r.avg}%</span>`}</span>
          <span className=${'num' + (r.overdue.length ? ' st bad' : '')}><span className="lab">Overdue </span>${r.overdue.length}</span>
          <span className=${'num' + (r.stale.length ? ' st warn' : '')}><span className="lab">No update </span>${r.stale.length}</span>
          <span className="chev"><${Icon} n=${isOpen ? 'chevdown' : 'chev'} s=${16}/></span>
        </button>
        ${isOpen && html`<div className="mtasks">${r.open.length === 0 ? html`<p className="muted sm" style=${{ padding: '8px 0' }}>No open tasks. ${r.doneWeek.length} finished this week.</p>` : r.open.map((p) => { const rr = p.recips[r.u.id]; return html`<div className="mtask" key=${p.id}>
          <${LevelTag} l=${p.level}/><button className="t" onClick=${() => openPost(p.id)}>${p.title}</button>
          ${p.due && html`<${DueTag} p=${p} uid=${r.u.id}/>`}
          <span className="pl-bar"><span className="bar"><i style=${{ width: (rr.pct || 0) + '%' }}></i></span><span className="mono sm">${rr.pct || 0}%</span></span>
          <span className=${isStale(p, r.u.id) ? 'st warn' : 'muted sm'}>${rr.updatedAt ? 'Updated ' + ago(rr.updatedAt) : 'No update yet'}</span>
          ${rr.nudgedAt ? html`<span className="st muted">Nudged ${ago(rr.nudgedAt)}</span>` : html`<button className="btn sm" onClick=${() => nudge(p, r.u.id)}><${Icon} n="bell" s=${14}/>Nudge</button>`}
        </div>`; })}</div>`}
      </div>`; })}
    </div>
  <//>`;
}

function DeptView({ id }) {

          ${!crumbs.length && drive.desc && html`<p className="muted sm">${drive.desc}</p>`}

          ${(() => { const fl = db.folders.filter((x) => x.drive === driveId && x.parent === folderId); const fs = db.files.filter((x) => x.drive === driveId && x.folder === folderId).sort((a, b) => (b.docDate || '').localeCompare(a.docDate || ''));
            return html`${fl.length > 0 && html`<div className="folders">${fl.map((x) => html`<button key=${x.id} className="folder" onClick=${() => setFolderId(x.id)}><${Icon} n="folder" s=${20}/><span>${x.name}<small>${countIn(x.id)} documents</small></span></button>`)}</div>`}
              ${fs.length > 0 ? html`<${FileTable} files=${fs} onOpen=${(id) => setModal({ id })}/>` : !fl.length && html`<div className="empty"><p>This folder is empty.</p><button className="btn primary" onClick=${() => setModal({ add: true })}>Add the first document</button></div>`}`; })()}
        </div>`}

    ${modal && html`<${DocModal} fileId=${modal.id || null} driveId=${driveId} folderId=${folderId} onClose=${() => setModal(null)}/>`}
  <//>`;
}

/* ---------------- pins ---------------- */
function PinsView() {
  const { db, user, update, toast, ask } = useApp();
  const pins = db.pins[user.id] || { posts: [], notes: [] };
  const posts = pins.posts.map((id) => db.posts.find((p) => p.id === id)).filter((p) => p && canSee(db, p, user));
  const [form, setForm] = useState(null);
  const [shown, setShown] = useState({});
  const save = (e) => {
    e.preventDefault(); if (!form.title.trim()) return;
    update((d) => { d.pins[user.id] = d.pins[user.id] || { posts: [], notes: [] }; const L = d.pins[user.id].notes; if (form.id) Object.assign(L.find((n) => n.id === form.id), { ...form, title: form.title.trim() }); else L.unshift({ ...form, id: uid('n'), title: form.title.trim(), at: Date.now() }); });
    setForm(null); toast('Saved to your pins');
  };
  const copy = (text) => { try { navigator.clipboard.writeText(text).then(() => toast('Copied'), () => toast('Couldn’t copy here. Select the text instead.', 'warn')); } catch (e) { toast('Couldn’t copy here. Select the text instead.', 'warn'); } };
  return html`<${Page} title="My pins" sub="Your own archive: posts you pinned and notes you don’t want to forget. Only you can see them." actions=${!form && html`<button className="btn primary" onClick=${() => setForm({ icon: '📝', title: '', body: '', sensitive: false })}><${Icon} n="plus" s=${16}/>New note</button>`}>
    <div className="privacy"><${Icon} n="lock" s=${16}/><span>Notes marked <b>sensitive</b> stay hidden until you tap Show. This demo keeps them in your browser only, so don’t store real passwords or codes here. A live version would encrypt them.</span></div>
    ${form && html`<form className="note" onSubmit=${save} style=${{ gap: 12 }}>
      <div className="field"><span>Icon</span><div className="iconpick">${TILE_ICONS.slice(0, 24).map((ic) => html`<button type="button" key=${ic} className=${form.icon === ic ? 'on' : ''} onClick=${() => setForm({ ...form, icon: ic })}>${ic}</button>`)}</div></div>
      <label className="field"><span>Title</span><input id="note-title" className="input" autoFocus value=${form.title} onChange=${(e) => setForm({ ...form, title: e.target.value })} placeholder="e.g. Supplier rep numbers"/></label>
      <label className="field"><span>Note</span><textarea id="note-body" rows="3" value=${form.body} onChange=${(e) => setForm({ ...form, body: e.target.value })}></textarea></label>
      <label className="sm" style=${{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked=${form.sensitive} onChange=${(e) => setForm({ ...form, sensitive: e.target.checked })}/>Sensitive: hide it until I tap Show</label>
      <div className="note-a"><button className="btn primary">Save note</button><button type="button" className="btn ghost" onClick=${() => setForm(null)}>Cancel</button></div>
    </form>`}
    <section className="group"><h2 className="group-h">Notes <span className="n">${pins.notes.length}</span></h2>
      ${pins.notes.length ? html`<div className="notes">${pins.notes.map((n) => { const hidden = n.sensitive && !shown[n.id]; return html`<div className="note" key=${n.id}>
        <div className="note-h"><span className="note-ic">${n.icon}</span><span className="note-t">${n.title}</span>${n.sensitive && html`<span className="chip"><${Icon} n="lock" s=${12}/>Sensitive</span>`}</div>
        <div className=${'note-b' + (hidden ? ' masked' : '')}>${hidden ? '••••••••' : n.body}</div>
        <div className="note-a">
          ${n.sensitive && html`<button className="btn sm" onClick=${() => setShown((s) => ({ ...s, [n.id]: !s[n.id] }))}><${Icon} n=${hidden ? 'eye' : 'eyeoff'} s=${14}/>${hidden ? 'Show' : 'Hide'}</button>`}
          ${!hidden && html`<button className="btn sm ghost" onClick=${() => copy(n.body)}><${Icon} n="copy" s=${14}/>Copy</button>`}
          <button className="btn sm ghost" onClick=${() => setForm({ ...n })}><${Icon} n="edit" s=${14}/>Edit</button>
          <button className="btn sm ghost" onClick=${() => ask({ title: 'Delete “' + n.title + '”?', body: 'This note is removed from your pins.', confirm: 'Delete note', danger: true, onConfirm: () => update((d) => { d.pins[user.id].notes = d.pins[user.id].notes.filter((x) => x.id !== n.id); }) })}><${Icon} n="trash" s=${14}/>Delete</button>
        </div></div>`; })}</div>` : html`<div className="empty"><p>No notes yet. Add things you look up often, like supplier numbers or opening steps.</p></div>`}
    </section>

      ${posts.length ? html`<div className="cards">${posts.map((p) => html`<${PostCard} key=${p.id} p=${p}/>`)}</div>` : html`<div className="empty"><p>Open any post and tap Pin to keep it here.</p></div>`}
    </section>
  <//>`;
}

/* ---------------- search ---------------- */
function SearchView() {
  const { db, user, searchQ, setSearchQ, compose, openChat } = useApp();
  const [scope, setScope] = useState('posts'); const [status, setStatus] = useState('all');
  const [fileOpen, setFileOpen] = useState(null);
  const raw = searchQ.trim().toLowerCase();
  const tokens = raw.split(/\s+/).filter(Boolean);
  const mentions = tokens.filter((t) => t.startsWith('@') && t.length > 1).map((t) => t.slice(1));
  const nums = tokens.filter((t) => /^#\d+$/.test(t)).map((t) => +t.slice(1));
  const words = tokens.filter((t) => !t.startsWith('@') && !/^#\d+$/.test(t));
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const involves = (p, m) => [...Object.keys(p.recips), p.author].some((id) => norm((userById(db, id) || { name: '' }).name).includes(norm(m))) || [...p.toDepts, p.about].some((d) => norm(deptById(db, d).name).includes(norm(m)));
  const text = (p) => [p.title, p.body, ...p.activity.map((a) => a.text || ''), ...p.attachments.map((a) => a.name), (userById(db, p.author) || {}).name, deptById(db, p.about).name, TYPES[p.type].label, LEVELS[p.level].label].join(' ').toLowerCase();
  const posts = !raw ? [] : db.posts.filter((p) => canSee(db, p, user) && (!nums.length || nums.includes(p.no)) && mentions.every((m) => involves(p, m)) && words.every((w) => text(p).includes(w)))
    .filter((p) => status === 'all' || (status === 'open') === !(p.closed || Object.values(p.recips).every((r) => r.status === 'done'))).sort((a, b) => b.createdAt - a.createdAt);
  const okDrives = db.drives.filter((d) => driveOn(db, d) && canDrive(user, d)).map((d) => d.id);
  const chatIds = new Set(myChats(db, user.id).map((c) => c.id));
  const msgs = !raw || nums.length ? [] : db.messages.filter((m) => m.kind === 'msg' && m.text && chatIds.has(m.chat)
    && words.every((w) => m.text.toLowerCase().includes(w))
    && mentions.every((mm) => norm((userById(db, m.user) || { name: '' }).name).includes(norm(mm)) || (m.mentions || []).some((x) => norm(x.label).includes(norm(mm)))))
    .sort((a, b) => b.at - a.at).slice(0, 60);
  const files = !raw || nums.length ? [] : db.files.filter((f) => okDrives.includes(f.drive) && fileMatches(db, f, [...words, ...mentions].join(' ')));
  const people = !raw || nums.length ? [] : db.users.filter((u) => u.active !== false && [...words, ...mentions].every((w) => (u.name + ' ' + u.title + ' ' + u.depts.map((d) => deptById(db, d).name).join(' ')).toLowerCase().includes(w)));
  const examples = ['@bakery', '#1047', 'invoice highveld', '@fatima', 'cabinet 2', 'load-shedding'];
  return html`<${Page} title="Search" sub="Find any post, document or person without scrolling through chats. Use @ for a person or team and # for a post number.">
    <label className="bigsearch"><${Icon} n="search" s=${20}/><input id="big-search" autoFocus value=${searchQ} onChange=${(e) => setSearchQ(e.target.value)} placeholder="Try @bakery, #1046, invoice, Highveld…" aria-label="Search"/>${searchQ && html`<button className="icon-btn sm" onClick=${() => setSearchQ('')} aria-label="Clear search"><${Icon} n="close" s=${15}/></button>`}</label>
    ${!raw ? html`<div className="tips">Examples: ${examples.map((x) => html`<button key=${x} onClick=${() => setSearchQ(x)}>${x}</button>`)}</div>` : html`
      <div className="tabs" role="tablist">
        <button className=${scope === 'posts' ? 'on' : ''} onClick=${() => setScope('posts')}>Posts <b>${posts.length}</b></button>
        <button className=${scope === 'messages' ? 'on' : ''} onClick=${() => setScope('messages')}>Messages <b>${msgs.length}</b></button>
        <button className=${scope === 'files' ? 'on' : ''} onClick=${() => setScope('files')}>Documents <b>${files.length}</b></button>
        <button className=${scope === 'people' ? 'on' : ''} onClick=${() => setScope('people')}>People <b>${people.length}</b></button>
      </div>
      ${scope === 'posts' && html`<div className="filters"><div className="seg" role="group" aria-label="Status">${[['all', 'All'], ['open', 'Still open'], ['done', 'Finished']].map(([k, l]) => html`<button key=${k} className=${status === k ? 'on' : ''} onClick=${() => setStatus(k)}>${l}</button>`)}</div></div>
        ${posts.length ? html`<div className="cards">${posts.map((p) => html`<${PostCard} key=${p.id} p=${p}/>`)}</div>` : html`<div className="empty"><p>No posts match “${searchQ}”.</p></div>`}`}
      ${scope === 'messages' && (msgs.length ? html`<div className="cards">${msgs.map((m) => { const c = db.chats.find((x) => x.id === m.chat); return html`<button key=${m.id} className="msg-hit" onClick=${() => openChat(c.id)}><${ChatAvatar} c=${c} s=${40}/><span className="pm"><span className="mh-top"><b>${chatName(db, c, user.id)}</b><span className="muted sm">${ago(m.at)}</span></span><span className="sm"><b>${m.user === user.id ? 'You' : firstName(userById(db, m.user))}:</b> <${MsgText} text=${m.text} mentions=${m.mentions}/></span></span></button>`; })}</div>` : html`<div className="empty"><p>No chat messages match “${searchQ}”.</p></div>`)}
      ${scope === 'files' && (files.length ? html`<${FileTable} files=${files} onOpen=${setFileOpen} showPath/>` : html`<div className="empty"><p>No documents you can open match “${searchQ}”.</p></div>`)}
      ${scope === 'people' && (people.length ? html`<div className="people">${people.map((u) => html`<div className="person" key=${u.id}><${Avatar} u=${u} s=${36}/><div className="pm"><b>${u.name}</b><span className="muted sm">${u.title} · ${u.depts.map((d) => deptById(db, d).name).join(', ')}</span></div>${u.id !== user.id && html`<button className="btn sm" onClick=${() => compose({ to: [{ k: 'u', id: u.id }], about: u.depts[0] })}><${Icon} n="at" s=${14}/>Tag</button>`}</div>`)}</div>` : html`<div className="empty"><p>No one matches “${searchQ}”.</p></div>`)}
    `}
    ${fileOpen && html`<${DocModal} fileId=${fileOpen} onClose=${() => setFileOpen(null)}/>`}
  <//>`;
}

/* ---------------- admin ---------------- */
function PersonModal({ personId, onClose, onAdded }) {
  const { db, update, toast, user } = useApp();
  const p = userById(db, personId);
  const [v, setV] = useState(() => (p ? { ...p } : { name: '', title: '', role: 'staff', depts: [], manages: [], pin: '', active: true }));
  const [err, setErr] = useState('');
  const set = (k, x) => setV((o) => ({ ...o, [k]: x }));
  const flip = (k, id) => setV((o) => ({ ...o, [k]: o[k].includes(id) ? o[k].filter((x) => x !== id) : [...o[k], id] }));
  const save = () => {
    if (!v.name.trim()) return setErr('Enter a name.');
    if (!v.depts.length) return setErr('Put them in at least one department.');
    if (!CLOUD && !/^\d{4}$/.test(v.pin || '')) return setErr('The PIN must be 4 digits.');
    if (p && p.id === user.id && v.role !== 'admin') return setErr('You can’t remove your own admin access.');
    const clean = { ...v, name: v.name.trim(), title: v.title.trim() || 'Staff', manages: v.role === 'staff' ? [] : v.manages };
    const id = p ? p.id : uid('u');
    update((d) => { if (p) Object.assign(d.users.find((u) => u.id === p.id), clean); else d.users.push({ ...clean, id }); });
    onClose();
    if (!p && CLOUD && onAdded) onAdded({ ...clean, id }); else toast(p ? 'Saved ' + clean.name : clean.name + ' can now log in');
  };
  return html`<${Modal} title=${p ? 'Edit ' + p.name : 'Add a person'} onClose=${onClose} wide footer=${html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>${p ? 'Save' : 'Add person'}</button>`}>
    <div className="row2">
      <label className="field"><span>Full name</span><input id="pm-name" className="input" value=${v.name} onChange=${(e) => set('name', e.target.value)}/></label>
      <label className="field"><span>Job title</span><input id="pm-title" className="input" value=${v.title} onChange=${(e) => set('title', e.target.value)} placeholder="e.g. Baker"/></label>
      <label className="field"><span>Access level</span><select id="pm-role" className="select" value=${v.role} onChange=${(e) => set('role', e.target.value)}><option value="staff">Staff: sees their own posts and team tools</option><option value="manager">Manager: also sees their team’s progress</option><option value="admin">Admin: sees everything, manages people</option></select></label>
      ${CLOUD ? html`<div className="field"><span>Login</span><small>After you add them, you get a setup code to give them. They choose their own PIN with it.</small></div>`
        : html`<label className="field"><span>Login PIN (4 digits)</span><input id="pm-pin" className="input mono" inputMode="numeric" maxLength="4" value=${v.pin} onChange=${(e) => set('pin', e.target.value.replace(/\D/g, ''))}/></label>`}
    </div>
    <div className="field"><span>Departments they belong to</span><div className="checks">${db.depts.map((d) => html`<label key=${d.id}><input type="checkbox" checked=${v.depts.includes(d.id)} onChange=${() => flip('depts', d.id)}/>${d.name}</label>`)}</div><small>Tagging one of these teams reaches this person.</small></div>
    <div className="field"><span>Departments they manage</span><div className="checks">${db.depts.map((d) => html`<label key=${d.id} className=${v.role === 'staff' ? 'dis' : ''}><input type="checkbox" disabled=${v.role === 'staff'} checked=${v.manages.includes(d.id)} onChange=${() => flip('manages', d.id)}/>${d.name}</label>`)}</div><small>Managers see the progress of everyone in these teams and can edit the team’s tools.</small></div>
    ${p && p.id !== user.id && html`<label className="sm" style=${{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked=${v.active === false} onChange=${(e) => set('active', !e.target.checked)}/>Deactivated: can’t log in and won’t be tagged</label>`}
    ${err && html`<p className="err">${err}</p>`}
  <//>`;
}

    if (!CLOUD) return;
    const { data } = await CLOUD.rpc('login_status');

  const appLink = location.origin + location.pathname;

        <td><div className="fname" style=${{ alignItems: 'center' }}><${Avatar} u=${u} s=${28}/><span>${u.name}<span className="muted sm" style=${{ display: 'block', fontWeight: 400 }}>${u.title}${u.active === false ? ' · deactivated' : ''}</span></span></div></td>
        <td><span className=${'rolebadge ' + u.role}>${u.role}</span></td>
        <td>${u.depts.map((d) => deptById(db, d).name).join(', ')}</td>

              <button className="btn sm" onClick=${() => getCode(u)}>${logins[u.id] && logins[u.id].claimed ? 'Reset PIN' : logins[u.id] && logins[u.id].code_waiting ? 'New code' : 'Get setup code'}</button>`}</div></td>`

  db.files.forEach((f) => put('files', f.id, f));

  (by.pins || []).forEach((r) => { db.pins[r.id] = r.data; });

  const c = useCounts();
  const st = shiftOf(db, user.id);
  const mine = [...c.mine].sort(sortNeeds(user.id));
  const asap = mine.filter((p) => p.level === 'red').length;
  const chats = myChats(db, user.id).map((ch) => ({ ch, n: unreadIn(db, ch, user.id), at: mentionsIn(db, ch, user.id) })).filter((x) => x.n > 0).sort((a, b) => b.at - a.at || b.n - a.n);
  const msgs = chats.reduce((a, x) => a + x.n, 0);
  const waiting = c.vis.filter((p) => p.author === user.id && !p.closed && Object.values(p.recips).some((r) => r.status !== 'done')).length;
  const esc = db.posts.filter((p) => p.escalatedAt && Date.now() - p.escalatedAt < DAY && !p.closed && (p.author === user.id || (p.escalatedTo || []).includes(user.id)));
  const teamLate = user.role !== 'staff' ? c.vis.filter((p) => p.author !== user.id && !p.recips[user.id] && isOverdue(p)).length : 0;
  const pm = reminderMap(db), today = dkey();
  const meMine = canSeeME(db, user) ? (db.deadlines || []).filter((dl) => dl.owners.includes(user.id)).map((dl) => ({ dl, k: occKey(dl, today) }))
    .filter(({ dl, k }) => k !== 'any' && k <= today && !meState(dl, k, pm.get(reminderId(dl, k))).done).sort((a, b) => a.k.localeCompare(b.k)) : [];
  const push = pushAvailability();
  const openNeeds = () => { onClose(); setFilters(NO_FILTERS); jump('view:needs'); };
  const row = (p, extra) => html`<li key=${p.id}><button onClick=${() => { onClose(); openPost(p.id); }}><${LevelTag} l=${p.level}/><span className="t">${p.title}</span>${extra}</button></li>`;
  return html`<${Modal} title=${greeting() + ', ' + firstName(user)} onClose=${onClose} footer=${html`<button className="btn primary" onClick=${onClose}>Start my shift</button>`}>
    <p className="muted" style=${{ margin: '0 0 12px' }}>${fmtDay(Date.now(), { weekday: 'long', day: 'numeric', month: 'long' })}${st && st.mode === 'auto' ? ' · your shift is ' + st.start + ' to ' + st.end : ''}</p>
    <div className="stats sum-stats">
      <button className=${'stat' + (asap ? ' bad' : '')} onClick=${openNeeds}><b>${mine.length}</b><span>${mine.length === 1 ? 'thing needs' : 'things need'} you${asap ? ' · ' + asap + ' ASAP' : ''}</span></button>
      <div className=${'stat' + (c.overdue ? ' warn' : '')}><b>${c.overdue}</b><span>overdue</span></div>
      <div className="stat"><b>${msgs}</b><span>unread ${msgs === 1 ? 'message' : 'messages'}</span></div>
      <div className="stat"><b>${waiting}</b><span>sent by you, still open</span></div>
      ${user.role !== 'staff' && html`<div className=${'stat' + (teamLate ? ' warn' : '')}><b>${teamLate}</b><span>overdue in your teams</span></div>`}
    </div>
    ${mine.length > 0 && html`<div className="sum-h">Start with these</div><ul className="sum-list">${mine.slice(0, 5).map((p) => row(p, isOverdue(p, user.id) && html`<span className="st bad">Overdue</span>`))}</ul>`}
    ${esc.length > 0 && html`<div className="sum-h">Escalated in the last day</div><ul className="sum-list">${esc.slice(0, 4).map((p) => row(p, html`<span className="st bad">Escalated</span>`))}</ul>`}
    ${chats.length > 0 && html`<div className="sum-h">Chats</div><ul className="sum-list">${chats.slice(0, 4).map(({ ch, n, at }) => html`<li key=${ch.id}><button onClick=${() => { onClose(); jump('chat:' + ch.id); }}><${ChatAvatar} c=${ch} s=${26}/><span className="t">${chatName(db, ch, user.id)}</span>${at && html`<span className="ci-at" title="You were tagged">@</span>`}<span className="ci-n">${n}</span></button></li>`)}</ul>`}
    ${meMine.length > 0 && html`<div className="sum-h">Month end</div><ul className="sum-list">${meMine.slice(0, 4).map(({ dl, k }) => html`<li key=${dl.id}><button onClick=${() => { onClose(); jump('view:monthend'); }}><span className=${'st ' + (k < today ? 'bad' : 'warn')}>${k < today ? 'Overdue' : 'Today'}</span><span className="t">${dl.title}</span></button></li>`)}</ul>`}
    ${!mine.length && !msgs && !meMine.length && html`<p className="sum-empty">Nothing is waiting on you. Have a good shift.</p>`}
    ${push === 'ready' && pushState !== 'on' && html`<div className="push-card"><${Icon} n="bell"/><span>Get alerts on this device even when Floorboard is closed.</span><button className="btn sm primary" onClick=${enablePush}>Turn on</button></div>`}
    ${push === 'ios-install' && html`<div className="push-card"><${Icon} n="bell"/><span>To get alerts on iPhone when Floorboard is closed: open it in Safari, tap Share, then “Add to Home Screen”, and open it from there.</span></div>`}
  <//>`;
}

function CloudLogin() {
  const { cloudSignedIn, openPhone } = useApp();
  // a QR code from "Get it on your phone" carries the store code, so it's already filled in
  const [code, setCode] = useState(() => storeFromLink() || lsGet(STORE_CODE_KEY) || '');
  const [dir, setDir] = useState(null);
  const [sel, setSel] = useState(null);
  const [q, setQ] = useState('');
  const [pin, setPin] = useState(''); const [pin2, setPin2] = useState(''); const [setup, setSetup] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const loadDir = async (c) => {
    setBusy(true); setErr('');
    const { data, error } = await CLOUD.rpc('staff_directory', { p_code: c.trim() });
    setBusy(false);
    if (error) { setDir(null); setErr(/store code/i.test(error.message) ? 'That store code isn’t right. Ask your manager for it.' : 'Can’t reach the store’s server. Check your internet connection.'); return; }
    lsSet(STORE_CODE_KEY, c.trim().toUpperCase()); setDir(data || []);
  };
  useEffect(() => { if (code) loadDir(code); }, []);
  // The list may be minutes old: check again whether this person has already set up their login somewhere.
  const pickUser = async (u) => {
    setSel(u); setErr(''); setPin(''); setPin2(''); setSetup('');
    const { data } = await CLOUD.rpc('staff_directory', { p_code: lsGet(STORE_CODE_KEY) || code });
    if (data) { setDir(data); const fresh = data.find((x) => x.id === u.id); if (fresh) setSel((cur) => (cur && cur.id === fresh.id ? fresh : cur)); }
  };
  const digits = (v) => v.replace(/\D/g, '').slice(0, 6);
  async function submit(e) {
    e.preventDefault(); setErr('');
    const email = sel.handle + STAFF_DOMAIN;
    if (sel.claimed) {
      if (pin.length !== 6) return setErr('Your PIN is 6 digits.');
      setBusy(true);
      const { data, error } = await CLOUD.auth.signInWithPassword({ email, password: pinPassword(pin) });
      setBusy(false);
      if (error) { setPin(''); return setErr('That PIN doesn’t match. If you’ve forgotten it, ask your manager for a new setup code.'); }
      return cloudSignedIn(data.session);
    }
    if (setup.length !== 6) return setErr('The setup code from your manager is 6 digits.');
    if (pin.length !== 6) return setErr('Choose a 6-digit PIN you’ll remember.');
    if (pin !== pin2) return setErr('The two PINs don’t match. Type the same PIN twice.');
    setBusy(true);
    let { data, error } = await CLOUD.auth.signUp({ email, password: pinPassword(pin) });
    if (error && /registered/i.test(error.message)) ({ data, error } = await CLOUD.auth.signInWithPassword({ email, password: pinPassword(pin) }));
    if (error || !data.session) { setBusy(false); return setErr(error ? 'Couldn’t set up your login: ' + error.message : 'The server still asks for email confirmation. Your admin needs to switch “Confirm email” off in Supabase.'); }
    // already set up on another phone or computer: the PIN worked, so just go in
    const { data: mem } = await CLOUD.from('members').select('staff_id').maybeSingle();
    if (mem && mem.staff_id === sel.id) { setBusy(false); return cloudSignedIn(data.session); }
    const { data: ok } = await CLOUD.rpc('claim_login', { p_staff: sel.id, p_code: setup });
    if (!ok) { await CLOUD.auth.signOut(); setBusy(false); return setErr('That setup code isn’t right or has expired. Ask your manager for a new one.'); }
    setBusy(false); cloudSignedIn(data.session);
  }
  const groups = {};
  (dir || []).filter((u) => !q || u.name.toLowerCase().includes(q.toLowerCase())).forEach((u) => { const k = u.dept_name || 'Other'; (groups[k] = groups[k] || []).push(u); });
  const Ava = ({ u, s }) => html`<span className="av" style=${{ width: s, height: s, fontSize: Math.round(s * 0.38), background: '#5E6B65' }}>${u.name.split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase()}</span>`;
  return html`<div className="login">
    <div className="login-l glass">
      <div className="brand"><span className="brand-mark"><${Icon} n="logo" s=${20}/></span><div><div className="brand-name">Floorboard</div><div className="brand-store">Your store, live</div></div></div>
      <h1>Only what involves you. Nothing else.</h1>
      <p>Tasks, feedback requests, heads-ups and votes, tagged to you or your team, sorted by how urgent they are. No scrolling through twenty WhatsApp groups to find your name.</p>
      <button type="button" className="btn ghost phone-link" onClick=${openPhone}><${Icon} n="phone" s=${16}/>Get Floorboard on your phone</button>
    </div>
    <div className="login-r glass"><div className="login-card">
      ${!dir ? html`<form className="pinbox" onSubmit=${(e) => { e.preventDefault(); if (code.trim()) loadDir(code); }}>
          <div><h2>Enter your store code</h2><p className="muted" style=${{ marginTop: 4 }}>Your manager gives you this once. This phone or computer remembers it.</p></div>
          <label className="field"><span>Store code</span><input id="store-code" className="input pin-in" style=${{ letterSpacing: '.3em' }} autoFocus autoComplete="off" value=${code} onChange=${(e) => setCode(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8))}/></label>
          ${err && html`<p className="err" role="alert">${err}</p>`}
          <button className="btn primary" style=${{ padding: 12 }} disabled=${busy || !code.trim()}>${busy ? 'Checking…' : 'Continue'}</button>
        </form>`
      : !sel ? html`
        <div><h2>Who’s logging in?</h2><p className="muted" style=${{ marginTop: 4 }}>Pick your name.</p></div>
        <label className="bigsearch" style=${{ height: 44, fontSize: 15 }}><${Icon} n="search" s=${17}/><input id="login-q" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Find your name" aria-label="Find your name"/></label>
        ${dir.length === 0 && html`<p className="muted">No one has been added yet.</p>`}
        <div className="ugrid">${Object.entries(groups).map(([g, list]) => html`<div key=${g}><div className="ug-h"><i style=${{ background: '#5E6B65' }}></i>${g}</div><div className="ulist">${list.map((u) => html`<button key=${u.id} className="ubtn" onClick=${() => pickUser(u)}><${Ava} u=${u} s=${34}/><span><b>${u.name}</b><small>${u.title}${u.claimed ? '' : ' · first time'}</small></span></button>`)}</div></div>`)}</div>
        <button type="button" className="linkish" onClick=${() => { setDir(null); setCode(''); lsSet(STORE_CODE_KEY, ''); }}>Use a different store code</button>`
      : html`<form className="pinbox" onSubmit=${submit}>
          <div style=${{ display: 'flex', gap: 12, alignItems: 'center' }}><${Ava} u=${sel} s=${48}/><div><h2>${sel.name}</h2><span className="muted">${sel.title}</span></div></div>
          ${!sel.claimed && html`<p className="hint">First time here? Type the 6-digit setup code your manager gave you, then choose your own 6-digit PIN. You’ll use that PIN from now on.</p>
            <label className="field"><span>Setup code from your manager</span><input id="setup-code" className="input pin-in" inputMode="numeric" autoComplete="off" autoFocus value=${setup} onChange=${(e) => setSetup(digits(e.target.value))}/></label>`}
          <label className="field"><span>${sel.claimed ? 'Your PIN' : 'Choose a 6-digit PIN'}</span><input id="login-pin" className="input pin-in" type="password" inputMode="numeric" autoComplete="off" autoFocus=${sel.claimed} value=${pin} onChange=${(e) => { setPin(digits(e.target.value)); setErr(''); }}/></label>
          ${!sel.claimed && html`<label className="field"><span>Type the PIN again</span><input id="login-pin2" className="input pin-in" type="password" inputMode="numeric" autoComplete="off" value=${pin2} onChange=${(e) => setPin2(digits(e.target.value))}/></label>`}
          ${err && html`<p className="err" role="alert">${err}</p>`}
          <button className="btn primary" style=${{ padding: 12 }} disabled=${busy}>${busy ? 'One moment…' : sel.claimed ? 'Log in' : 'Set up my login'}</button>
          <button type="button" className="linkish" onClick=${() => setSel(null)}>Not ${sel.name.split(' ')[0]}? Pick someone else</button>
        </form>`}
    </div></div>
  </div>`;
}
function CloudLoading({ text }) {

/* ---------------- projects & issues: named @groups of people ---------------- */
// Admins and managers make one for a project or a problem and pick who's in it.
// Tagging @Packhouse project anywhere sends the post to those people only.
const GROUP_KINDS = { project: 'Project', issue: 'Issue', other: 'Group' };
const canMakeGroups = (u) => u.role !== 'staff';
const canEditGroup = (u, g) => u.role === 'admin' || g.createdBy === u.id;
const groupLabel = (db, g) => (GROUP_KINDS[g.kind] || 'Group') + ' · ' + deptMembers(db, g.id).length + ' people';
const postOpen = (p) => !p.closed && Object.values(p.recips).some((r) => r.status !== 'done');
function groupPosts(db, g, u) { return db.posts.filter((p) => p.toDepts.includes(g.id) && canSee(db, p, u)).sort((a, b) => b.createdAt - a.createdAt); }
function myGroups(db, u) { return (db.groups || []).filter((g) => u.role === 'admin' || g.members.includes(u.id) || g.createdBy === u.id); }

function GroupModal({ groupId, onClose }) {
  const { db, user, update, toast, go } = useApp();
  const g = (db.groups || []).find((x) => x.id === groupId);
  const [v, setV] = useState(() => (g ? { ...g } : { name: '', kind: 'project', icon: '📦', color: TILE_COLORS[7], desc: '', members: [user.id] }));
  const [q, setQ] = useState(''); const [err, setErr] = useState('');
  const set = (k, x) => { setV((o) => ({ ...o, [k]: x })); setErr(''); };
  const flip = (id) => set('members', v.members.includes(id) ? v.members.filter((x) => x !== id) : [...v.members, id]);
  const addTeam = (deptId) => set('members', [...new Set([...v.members, ...deptMembers(db, deptId)])]);
  const people = db.users.filter((u) => u.active !== false && (!q || (u.name + ' ' + u.title).toLowerCase().includes(q.toLowerCase())));
  const save = () => {
    const name = v.name.trim();
    if (!name) return setErr('Give it a name, like Packhouse project or Finance issue.');
    if (v.members.filter((id) => id !== user.id).length < 1) return setErr('Add at least one other person.');
    const taken = [...db.depts, ...(db.groups || []).filter((x) => x.id !== groupId), PSEUDO.all, PSEUDO.managers].some((x) => x.name.toLowerCase() === name.toLowerCase());
    if (taken) return setErr('There’s already a team or group called “' + name + '”. Pick another name.');
    const id = g ? g.id : 'g-' + uid('');
    const data = { name, kind: v.kind, icon: v.icon, color: v.color, desc: (v.desc || '').trim(), members: v.members };
    update((d) => {
      d.groups = d.groups || [];
      if (g) Object.assign(d.groups.find((x) => x.id === g.id), data);
      else d.groups.push({ id, createdBy: user.id, createdAt: Date.now(), archived: false, ...data });
    });
    onClose();
    toast(g ? 'Saved' : 'Made @' + name + '. Tag it in any post or chat.');
    if (!g) go('group:' + id);
  };
  const others = v.members.filter((id) => id !== user.id).length;
  return html`<${Modal} title=${g ? 'Edit ' + g.name : 'New project or issue'} onClose=${onClose} wide footer=${html`<span className="reach">${v.members.length} ${v.members.length === 1 ? 'person' : 'people'}</span><button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>${g ? 'Save' : 'Create'}</button>`}>
    <div className="field"><span>What is it?</span><div className="seg" role="group">${Object.entries(GROUP_KINDS).map(([k, l]) => html`<button type="button" key=${k} className=${v.kind === k ? 'on' : ''} onClick=${() => set('kind', k)}>${l}</button>`)}</div></div>
    <div className="row2">
      <label className="field"><span>Name people will tag</span><input id="g-name2" className="input" value=${v.name} onChange=${(e) => set('name', e.target.value)} placeholder=${v.kind === 'issue' ? 'e.g. Finance issue' : 'e.g. Packhouse project'} maxLength="40"/><small>${v.name.trim() ? 'People type @' + v.name.trim() : 'Short and clear works best.'}</small></label>
      <div className="field"><span>Colour</span><div className="swatches">${TILE_COLORS.map((col) => html`<button type="button" key=${col} className=${v.color === col ? 'on' : ''} style=${{ '--c': col }} onClick=${() => set('color', col)} aria-label=${'Colour ' + col}></button>`)}</div></div>
    </div>
    <div className="field"><span>Icon</span><div className="iconpick">${TILE_ICONS.map((ic) => html`<button type="button" key=${ic} className=${v.icon === ic ? 'on' : ''} onClick=${() => set('icon', ic)} aria-label=${'Icon ' + ic}>${ic}</button>`)}</div></div>
    <label className="field"><span>What it’s about (optional)</span><textarea id="g-desc" rows="2" value=${v.desc} onChange=${(e) => set('desc', e.target.value)} placeholder="e.g. Moving fruit & veg packing into the old storeroom by December."></textarea></label>
    <div className="field"><span>Who’s in it · ${others} ${others === 1 ? 'other person' : 'other people'}</span>
      <div className="toggles">${db.depts.map((d) => html`<button type="button" key=${d.id} className="toggle" style=${{ '--c': d.color }} onClick=${() => addTeam(d.id)}><i></i>+ ${d.name}</button>`)}</div>
      <small>Adding a team adds the people in it now. Later joiners aren’t added automatically.</small>
    </div>
    <label className="bigsearch" style=${{ height: 44, fontSize: 15 }}><${Icon} n="search" s=${17}/><input id="g-q" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Search people" aria-label="Search people"/></label>
    <div className="people">${people.map((u) => { const on = v.members.includes(u.id); return html`<button key=${u.id} className=${'person pick' + (on ? ' on' : '')} onClick=${() => flip(u.id)} aria-pressed=${on}><${Avatar} u=${u} s=${34}/><span className="pm"><b>${u.name}${u.id === user.id ? ' (you)' : ''}</b><span className="muted sm">${u.title}</span></span><span className=${'tick-box' + (on ? ' on' : '')}>${on && html`<${Icon} n="check" s=${14}/>`}</span></button>`; })}</div>
    ${err && html`<p className="err" role="alert">${err}</p>`}
  <//>`;
}

function GroupView({ id }) {
  const { db, user, compose, update, toast } = useApp();

  const open = posts.filter(postOpen), overdue = posts.filter((p) => isOverdue(p)).length;
  const tasks = posts.filter((p) => p.type === 'task' && !p.closed);
  const pct = tasks.length ? Math.round(tasks.reduce((a, p) => a + progressOf(p).pct, 0) / tasks.length) : null;
  const editable = canEditGroup(user, g);
  const closeWord = g.kind === 'issue' ? 'Mark resolved' : 'Close';

    actions=${html`${editable && html`<button className="btn" onClick=${() => setEdit(true)}><${Icon} n="edit" s=${15}/>Edit</button>`}${editable && html`<button className="btn" onClick=${toggle}>${g.archived ? 'Reopen' : closeWord}</button>`}${!g.archived && html`<button className="btn primary" onClick=${() => compose({ to: [{ k: 'd', id: g.id }] })}><${Icon} n="at" s=${16}/>Post to @${g.name}</button>`}`}>
    ${g.archived && html`<div className="notice"><${Icon} n="archive" s=${16}/>${g.kind === 'issue' ? 'Resolved' : 'Closed'}. It no longer shows up when people type @.</div>`}
    <div className="stats">

/* ---------------- approvals: invoices, payments and expense claims that need an OK ---------------- */
// An approval is a post (type 'approval') sent to its approvers, with p.approval = { kind, party, amount, ref, rule: 'any' | 'all',
// approvers, paidAt, paidBy, payNote }. Each approver's decision sits on their own recipient record, so two people deciding at
// once can't overwrite each other; the state is worked out from those. A question puts the requester on the post until they answer,
// and so does "paid", so they hear about it.
const AP_KINDS = ['Invoice', 'Payment', 'Expense claim', 'Other'];
const AP_STATES = { waiting: ['Waiting for approval', 'todo'], query: ['Question asked', 'warn'], approved: ['Approved, to pay', 'ok'], paid: ['Paid', 'ok'], rejected: ['Rejected', 'bad'] };
const approvalsOn = (db) => db.depts.some((d) => featureOn(d, 'approvals'));
// Finance, and the admins, see every approval and mark them paid
function canPay(db, u) {
  const ds = db.depts.filter((d) => featureOn(d, 'approvals'));
  return ds.length > 0 && (u.role === 'admin' || ds.some((d) => u.depts.includes(d.id) || u.manages.includes(d.id)));
}
const canSeeAP = (db, u) => approvalsOn(db) && (canPay(db, u) || u.role !== 'staff' || db.posts.some((p) => p.type === 'approval' && (p.author === u.id || p.recips[u.id])));
const shownTypes = (db) => (approvalsOn(db) ? [...TYPE_KEYS, 'approval'] : TYPE_KEYS);
const apTitle = (kind, party, amount) => kind + ': ' + (party || 'no name') + (amount ? ' · ' + rand(amount) : '');
function apState(p) {
  const a = p.approval;
  if (!a) return 'waiting';
  const rs = a.approvers.map((id) => p.recips[id]).filter(Boolean);
  if (rs.some((r) => r.decision === 'reject')) return 'rejected';
  const yes = rs.filter((r) => r.decision === 'approve').length;
  if (a.rule === 'all' ? rs.length > 0 && yes === rs.length : yes > 0) return a.paidAt ? 'paid' : 'approved';
  const req = p.recips[p.author];
  return req && req.answer && req.status !== 'done' ? 'query' : 'waiting';
}
const apOpen = (p) => { const s = apState(p); return s === 'waiting' || s === 'query'; };
const apWho = (db, p, d) => p.approval.approvers.filter((id) => (p.recips[id] || {}).decision === d).map((id) => firstName(userById(db, id))).join(', ');
const whenAt = (t) => fmtDay(t, { day: 'numeric', month: 'short' }) + ', ' + hm(t);
// approve, reject or ask the requester a question
function apDecide(d, pid, who, decision, note, atts) {
  const q = d.posts.find((x) => x.id === pid), r = q && q.recips[who];
  if (!r || !q.approval) return;
  const now = Date.now();
  r.seen = r.seen || now; r.updatedAt = now; r.nudgedAt = null;
  if (decision !== 'query') { r.status = 'done'; r.decision = decision; r.pct = 100; }
  q.activity.push({ id: uid('e'), kind: decision, user: who, at: now, text: (note || '').trim(), attachments: atts || [] });
  if (decision === 'reject' && q.author !== who) {
    const a = q.recips[q.author];
    q.recips[q.author] = { pct: 0, ...(a || {}), status: 'todo', rejected: true, seen: null, updatedAt: null, nudgedAt: a ? now : null };
  }
  if (decision === 'query' && q.author !== who) {
    const a = q.recips[q.author];
    q.recips[q.author] = { pct: 0, ...(a || {}), status: 'todo', answer: true, paid: false, seen: null, updatedAt: null, nudgedAt: a ? now : null };
  }
}
// the requester answers: the approvers still deciding get a reminder
function apAnswer(d, pid, who, note, atts) {
  const q = d.posts.find((x) => x.id === pid), r = q && q.recips[who];
  if (!r) return;
  const now = Date.now();
  r.status = 'done'; r.updatedAt = now; r.seen = r.seen || now; r.nudgedAt = null;
  q.activity.push({ id: uid('e'), kind: 'answer', user: who, at: now, text: (note || '').trim(), attachments: atts || [] });
  q.approval.approvers.forEach((id) => { const x = q.recips[id]; if (x && !x.decision) { x.nudgedAt = now; x.seen = null; } });
}
function apPaid(d, pid, by, note, undo) {
  const q = d.posts.find((x) => x.id === pid);
  if (!q || !q.approval) return;
  const now = Date.now();
  if (undo) {
    q.approval.paidAt = null; q.approval.paidBy = null; q.approval.payNote = '';
    const a = q.recips[q.author]; if (a && a.paid && a.status !== 'done') delete q.recips[q.author];
    q.activity.push({ id: uid('e'), kind: 'system', user: by, at: now, text: 'took off the paid mark' });
    return;
  }
  q.approval.paidAt = now; q.approval.paidBy = by; q.approval.payNote = (note || '').trim();
  q.activity.push({ id: uid('e'), kind: 'paid', user: by, at: now, text: q.approval.payNote, attachments: [] });
  if (q.author !== by) { const a = q.recips[q.author]; q.recips[q.author] = { pct: 0, ...(a || {}), status: 'todo', paid: true, answer: !!(a && a.answer), seen: null, updatedAt: null, nudgedAt: a ? now : null }; }
}
function ApPill({ p }) {
  const s = apState(p), [l, c] = AP_STATES[s];
  return html`<span className=${'st ' + c}>${(s === 'approved' || s === 'paid') && html`<${Icon} n="check" s=${14}/>`}${l}</span>`;
}
// what the person looking at it has to do: decide, answer a question, or see that it's paid

/* ---------------- month end: Finance's deadline sheet, with reminders ---------------- */
// One item per line of the sheet: { id, list, title, owners, due, repeat: '' | 'daily' | 'weekly', day, when, remind, star, dept, createdBy, createdAt }.
// Ticks live in done as 'date|person', or 'date|*' when a manager closes the whole item; items with no fixed day use the date 'any'.
// A reminder is an ordinary task sent remind days before, so it shows in Needs you and reaches phones. Ticking either one ticks both.
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
const REMIND_OPTS = [[-1, 'No reminder'], [0, 'On the day'], [1, 'The day before'], [2, '2 days before'], [3, '3 days before'], [7, 'A week before']];
const REMIND_HOUR = 7; // the live store sends the day's reminders from 07:00
const meDepts = (db) => db.depts.filter((d) => featureOn(d, 'monthend'));
const canEditME = (db, u) => meDepts(db).length > 0 && (u.role === 'admin' || meDepts(db).some((d) => u.manages.includes(d.id)));
function canSeeME(db, u) {
  const ds = meDepts(db);
  return ds.length > 0 && (u.role === 'admin' || ds.some((d) => u.depts.includes(d.id) || u.manages.includes(d.id)) || (db.deadlines || []).some((x) => x.owners.includes(u.id)));

const addDays = (k, n) => dkey(keyToDate(k).getTime() + n * DAY + 12 * HOUR);
const dowOf = (k) => keyToDate(k).getDay();
// the day that counts now: its date; today for weekday jobs (Monday at the weekend); this week's day for weekly ones
function occKey(dl, today = dkey()) {
  if (dl.repeat === 'daily') { let k = today; while (dowOf(k) === 0 || dowOf(k) === 6) k = addDays(k, 1); return k; }
  if (dl.repeat === 'weekly') return addDays(today, (dl.day - dowOf(today) + 7) % 7);

}
const reminderId = (dl, k) => 'p-dl-' + dl.id + '-' + k;
const reminderMap = (db) => { const m = new Map(); db.posts.forEach((p) => { if (p.deadline) m.set(p.id, p); }); return m; };
// someone's part is done on their reminder task when they have one, otherwise by the tick on the page
function personDone(dl, k, who, p) {
  const r = p && p.recips[who];
  if (r) return r.status === 'done' ? { by: who, at: r.updatedAt } : null;
  return (dl.done || {})[k + '|' + who] || null;
}
function meState(dl, k, p) {
  const all = (dl.done || {})[k + '|*'] || null;
  const parts = dl.owners.map((id) => ({ id, d: all || personDone(dl, k, id, p) }));
  const n = parts.filter((x) => x.d).length;
  return { parts, n, all, done: !!all || (parts.length > 0 && n === parts.length) };
}
function meTick(d, id, k, who, on, by) {
  const dl = (d.deadlines || []).find((x) => x.id === id);
  if (!dl) return;
  dl.done = dl.done || {};
  const now = Date.now(), p = d.posts.find((x) => x.id === reminderId(dl, k)), r = who !== '*' && p && p.recips[who];
  if (r) {
    r.status = on ? 'done' : 'todo'; r.pct = on ? 100 : 0; r.updatedAt = now; r.seen = r.seen || now;
    p.activity.push({ id: uid('e'), kind: 'update', user: by, at: now, pct: r.pct, text: on ? 'Ticked off on the Month end page' : 'Unticked on the Month end page' });
    return;
  }
  if (on) dl.done[k + '|' + who] = { by, at: now }; else delete dl.done[k + '|' + who];
  if (who === '*' && p) { p.closed = on; p.activity.push({ id: uid('e'), kind: 'system', user: by, at: now, text: on ? 'marked it done on the Month end page' : 'opened it again on the Month end page' }); }
}
function meBody(dl) {

  return 'Month end · ' + dl.list + '. ' + often + (dl.when ? dl.when + '. ' : '') + 'Mark it done here when it’s finished and it ticks off on the Month end page too.';
}
// Any open app sends the day's reminders and tells the manager about misses. Fixed ids, so two devices doing it at once leave one.
function meReminders(d, now, dry) {
  if (!(d.deadlines || []).length || (CLOUD && new Date(now).getHours() < REMIND_HOUR)) return 0;
  const today = dkey(now), pm = reminderMap(d);
  let n = 0;
  d.deadlines.forEach((dl) => {
    const owners = dl.owners.filter((id) => { const u = userById(d, id); return u && u.active !== false; });
    const k = occKey(dl, today);
    if (!owners.length || k === 'any') return;
    const p = pm.get(reminderId(dl, k)), st = meState(dl, k, p);
    if (!p) {
      if (dl.remind == null || dl.remind < 0 || k < today || addDays(k, -dl.remind) > today || st.done) return;
      n++; if (dry) return;
      const author = userById(d, dl.createdBy) ? dl.createdBy : owners[0], recips = {};
      owners.forEach((id) => { const t = (dl.done || {})[k + '|' + id]; recips[id] = t ? { status: 'done', pct: 100, seen: t.at, updatedAt: t.at } : { status: 'todo', pct: 0, seen: null, updatedAt: null }; });
      d.counter += 1;
      d.posts.unshift({ id: reminderId(dl, k), chat: null, no: d.counter, type: 'task', title: dl.title, body: meBody(dl), author, createdAt: now, toUsers: owners, toDepts: [],
        about: dl.dept || userById(d, author).depts[0], level: dl.repeat ? 'green' : 'amber', due: k, attachments: [], recips, activity: [], poll: null, closed: false, deadline: { id: dl.id, date: k } });
    } else if (k < today && !p.lateAt && !p.closed && !st.done) {

      p.lateAt = now;
      if (tell && !p.recips[boss.id]) p.recips[boss.id] = { status: 'todo', pct: 0, seen: null, updatedAt: null, late: now };
      p.activity.push({ id: 'e-late-' + p.id, kind: 'system', esc: true, user: p.author, at: now, text: 'it missed its month-end date' + (tell ? ', so ' + firstName(boss) + ' was told' : '') });
    } else if (p.lateAt && st.done && Object.values(p.recips).some((r) => r.late && r.status !== 'done')) {
      n++; if (dry) return;
      Object.values(p.recips).forEach((r) => { if (r.late) { r.status = 'done'; r.pct = 100; r.updatedAt = now; } });
    }

}

/* pasting the sheet from Excel: dates in the first column, the job in the next, a name on its own line starts a new list */
function parseSheetDate(s) {
  const mk = (y, m, d) => { if (y < 100) y += 2000; const t = new Date(y, m, d); return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d ? dkey(t.getTime()) : null; };
  const mon = (w) => MONTHS.findIndex((x) => x.slice(0, 3) === w.slice(0, 3).toLowerCase());
  let m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-./]+([A-Za-z]{3,9})\.?,?[\s\-./]+(\d{4}|\d{2})\b/);
  if (m && mon(m[2]) >= 0) return mk(+m[3], mon(m[2]), +m[1]);
  m = s.match(/\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/);
  if (m && mon(m[1]) >= 0) return mk(+m[3], mon(m[1]), +m[2]);
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return mk(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{4}|\d{2})$/); // day first, the way South Africa writes it
  if (m) return mk(+m[3], +m[2] - 1, +m[1]);
  return null;
}
const isWhenWord = (c) => /^(every|daily|on avail|tbc|tba|start\b|as needed|when\b|ongoing|weekly)/i.test(c) || WEEKDAYS.some((w) => c.toLowerCase().startsWith(w.toLowerCase()));
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function guessOwners(db, name) {
  const parts = name.split(/\s*(?:&|,|\+|\/|\band\b)\s*/i).map((x) => x.trim().toLowerCase()).filter(Boolean);
  const act = db.users.filter((u) => u.active !== false);
  return [...new Set(parts.flatMap((p) => act.filter((u) => u.name.toLowerCase() === p || u.name.split(' ')[0].toLowerCase() === p).map((u) => u.id)))];
}
// on a shared list, a job that names one of the people (“… - Lerato”) goes to just that person
function ownersFor(db, owners, title) {
  if (owners.length < 2) return owners;
  const named = owners.filter((id) => { const u = userById(db, id); return u && new RegExp('\\b' + reEsc(u.name.split(' ')[0]) + '\\b', 'i').test(title); });
  return named.length ? named : owners;
}
function parseSheet(text, db) {
  const lists = [];
  let cur = null;
  const start = (name) => { cur = { name, owners: guessOwners(db, name), items: [] }; lists.push(cur); };
  text.replace(/\r/g, '').split('\n').forEach((line) => {
    const cells = line.split('\t').map((c) => c.replace(/\s+/g, ' ').trim()).filter(Boolean);
    if (!cells.length) return;
    if (cells.length === 1) {
      const c = cells[0];
      if (/^week\s*\d+\s*:?$/i.test(c) || parseSheetDate(c) || isWhenWord(c)) return; // a week heading, or a day with nothing on it
      if (/deadlines?\s*$/i.test(c) && !lists.length) return; // the sheet's own title
      if (c.length <= 40 && !/[.!?]$/.test(c)) { start(c); return; } // a heading: the next person or team
    }
    const first = cells.length > 1 ? cells[0] : '', title = (cells.length > 1 ? cells.slice(1) : cells).join(' · ');
    if (!cur) start('Month end');
    const it = { title, due: null, repeat: '', day: 0, when: '' };
    const dt = first && parseSheetDate(first);
    if (dt) it.due = dt;
    else if (/every\s*day|daily/i.test(first)) it.repeat = 'daily';
    else {
      const days = WEEKDAYS.map((w, i) => [i, first.toLowerCase().lastIndexOf(w.toLowerCase())]).filter(([, at]) => at >= 0).sort((a, b) => b[1] - a[1]);
      if (days.length) { it.repeat = 'weekly'; it.day = days[0][0]; if (!/^every\s/i.test(first)) it.when = first; } else it.when = first;
    }
    cur.items.push(it);
  });

}

  if (it.due) return fmtKey(it.due);
  if (it.repeat === 'daily') return 'Every weekday';
  if (it.repeat === 'weekly') return 'Every ' + WEEKDAYS[it.day];
  return it.when || 'Any time';
}

// Phone photos are often 4000px wide: keep wallpapers small enough to load fast everywhere.
async function shrinkImage(file, max, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}

  useEffect(() => {
    const h = (e) => { if (e.key !== 'Escape' || document.querySelector('.modal-wrap,.lightbox')) return; if (openId) setOpenId(null); else if (drawer) setDrawer(false); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [openId, drawer]);
  const ctx = {
    db, update, user, view, go, openId, toast, toasts, filters, setFilters, searchQ, setSearchQ, saved, drawer, setDrawer, lightbox, setLightbox, composer,
    confirmState, ask: setConfirmState, mode, openChatId, look, setLook, openLook: () => { setLookOpen(true); setDrawer(false); },
    jump: (t) => {
      if (mode === 'widget') { const desk = window.floorboardDesktop; if (desk && desk.openFull) desk.openFull(t); else location.hash = 'go-' + t; return; }
      setOpenId(null); setDrawer(false);
      if (t.startsWith('chat:')) { setOpenChatId(t.slice(5)); setView('chats'); } else if (t.startsWith('view:')) setView(t.slice(5)); else if (t.startsWith('post:')) setOpenId(t.slice(5));
    },
    openChat: (id) => { setOpenChatId(id); setView('chats'); setOpenId(null); setDrawer(false); },
    closeChat: () => setOpenChatId(null),
    alerts, dismissAlert, openAlert, soundOn, pushState,
    enablePush: async () => {
      const r = await pushOn(true);
      setPushState(r === 'on' ? 'on' : r === 'setup' ? 'setup' : 'off');
      toast({ on: 'Alerts are on. This device gets them even when Floorboard is closed.', blocked: 'Alerts are blocked for Floorboard in this browser’s settings.', setup: 'Alerts aren’t switched on for the store yet. Ask your admin to finish the alerts setup (step 1).' }[r] || 'Couldn’t turn alerts on here. Try again in a moment.', r === 'on' ? undefined : 'warn');
    },
    disablePush: async () => { await pushOff(false); setPushState('off'); toast('This device won’t get alerts while Floorboard is closed'); },
    // checks the whole chain: this device's sign-up, the server function, its key, and the phone showing it
    testPush: async () => {
      const { data, error } = await CLOUD.functions.invoke('notify', { body: { items: [{ test: true }] } });
      let why = '';
      if (error && error.context && error.context.json) { try { why = ((await error.context.json()) || {}).error || ''; } catch (e) { /* no details */ } }
      if (error) toast(/VAPID/.test(why) ? 'The alerts key isn’t saved on the server yet (step 3 of the alerts setup).'
        : error.name === 'FunctionsHttpError' ? 'The server refused the test (' + (why || error.context.status) + '). Check step 2 of the alerts setup.'
        : 'Can’t reach the alerts function. Check it’s deployed and named notify (step 2 of the alerts setup).', 'warn');
      else if (!data || !data.sent) toast('No device has alerts on for you yet. Tap “Get alerts when Floorboard is closed” first.', 'warn');
      else toast('Test alert sent to ' + data.sent + (data.sent === 1 ? ' device' : ' devices') + '. It should pop up in a few seconds.');
    },
    openShift: () => { setShiftOpen(true); setDrawer(false); },
    openSummary: () => { setSummary(true); setDrawer(false); },
    openPhone: () => { setPhoneOpen(true); setDrawer(false); },
    season, setSeason: (k) => { setSeasonState(k); lsSet(SEASON_KEY, k); },
    setSoundOn: (v) => { setSoundOnState(v); lsSet('floorboard.sound.v1', v ? 'on' : 'off'); if (v) chime(false); },
    enablePopups: () => {
      try { Notification.requestPermission().then((p) => toast(p === 'granted' ? 'Pop-up alerts are on for this device' : 'Pop-ups were blocked. Alerts still show inside the app.', p === 'granted' ? undefined : 'warn')); }
      catch (e) { toast('Pop-ups aren’t available here. Alerts still show inside the app.', 'warn'); }
    },
    // Demo only: a colleague sends you something a few seconds from now, so you can see how it arrives.
    sendTestTask: () => {
      if (!user) return;
      const others = db.users.filter((u) => u.id !== user.id && u.active !== false);
      const from = others.find((u) => u.role !== 'staff' && u.depts.some((d) => user.depts.includes(d))) || others.find((u) => u.role === 'admin') || others[0];
      const t = TEST_TASKS[testIdx++ % TEST_TASKS.length];
      toast('Demo: ' + firstName(from) + ' sends you a ' + TYPES[t.type].label.toLowerCase() + ' in 3 seconds');
      setTimeout(() => update((d) => {
        const now = Date.now();
        let ch = d.chats.find((c) => c.kind === 'dm' && c.members.includes(from.id) && c.members.includes(user.id));
        if (!ch) { ch = { id: uid('c'), kind: 'dm', name: '', icon: '', color: '', dept: null, members: [from.id, user.id], createdBy: from.id, createdAt: now, read: {} }; d.chats.push(ch); }
        d.counter += 1;
        const pid = uid('p');
        d.posts.unshift({ id: pid, chat: ch.id, no: d.counter, type: t.type, title: t.title, body: '', author: from.id, createdAt: now, toUsers: [user.id], toDepts: [], about: user.depts[0],
          level: t.level, due: t.type === 'task' ? dkey() : null, attachments: [], recips: { [user.id]: { status: 'todo', pct: 0, seen: null, updatedAt: null } }, activity: [], poll: null, closed: false });
        d.messages.push({ id: uid('m'), chat: ch.id, user: from.id, at: now, text: '', attachments: [], mentions: [], replyTo: null, postId: pid, kind: 'msg' });
      }), 3000);
    },
    openPost: (id) => { setOpenId(id); setDrawer(false); }, closePost: () => setOpenId(null),
    compose: (preset) => setComposer(preset || {}), closeComposer: () => setComposer(null),
    login: (id) => { lsSet(SESSION_KEY, id); setMe(id); setView('chats'); setOpenChatId(null); setOpenId(null); setFilters(NO_FILTERS); },
    logout: () => {
      setOpenId(null); setDrawer(false); setComposer(null); setOpenChatId(null);
      if (!CLOUD) { lsSet(SESSION_KEY, ''); setMe(null); return; }
      // shared devices: don't leave the store's data behind
      lsSet(CACHE_KEY, ''); lsSet('floorboard.cloud.me', ''); Sync.stop(); Presence.stop(); setDb(emptyDb()); setMe(null); setCloud('signedout');
      // this person's alerts stop on this device before signing out (the next person to log in here gets theirs)
      (lsGet(PUSH_KEY) ? pushOff(true) : Promise.resolve()).finally(() => CLOUD.auth.signOut());
    },
    cloud, syncStatus, cloudSignedIn: (session) => { setView('chats'); setOpenChatId(null); startCloud(session); },
    resetDemo: async () => { await Blobs.clear(); setDb(seed()); setOpenId(null); setOpenChatId(null); setView('chats'); setFilters(NO_FILTERS); toast('Demo store reset'); },
  };
  return html`<${Ctx.Provider} value=${ctx}>
    <${Scene} look=${look}/>
    ${cloud === 'checking' || cloud === 'loading' ? html`<${CloudLoading} text=${cloud === 'loading' ? 'Loading your store…' : 'Connecting…'}/>`
      : !user ? (CLOUD ? html`<${CloudLogin}/>` : html`<${Login}/>`) : mode === 'widget' ? html`<${Widget}/>` : html`<${Shell}/>`}
    <${AlertStack}/>
    ${lookOpen && html`<${LookModal} onClose=${() => setLookOpen(false)}/>`}
    ${phoneOpen && html`<${PhoneModal} onClose=${() => setPhoneOpen(false)}/>`}
    ${user && shiftOpen && html`<${ShiftModal} onClose=${() => setShiftOpen(false)}/>`}
    ${user && summary && !shiftOpen && html`<${ShiftSummary} onClose=${() => setSummary(false)}/>`}
    <${Toasts}/>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
