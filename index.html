      <div style=${{ display: 'grid', gap: 14, minWidth: 0 }}>
        <div className="dtool">
          <label className="tsearch"><${Icon} n="search" s=${16}/><input id="drive-q" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Search all your drives: HP-55821, Highveld, cabinet 2…" aria-label="Search documents"/></label>
          <select id="drive-type" className="select sm" value=${typeF} onChange=${(e) => setTypeF(e.target.value)} aria-label="Document type"><option value="any">All types</option>${DOC_TYPES.map((x) => html`<option key=${x}>${x}</option>`)}</select>
          ${!searching && drive && drive.ok && html`<button className="btn" onClick=${() => setNf('')}><${Icon} n="folder" s=${16}/>New folder</button><button className="btn primary" onClick=${() => setModal({ add: true })}><${Icon} n="plus" s=${16}/>Add document</button>`}
        </div>
        ${searching ? html`<div style=${{ display: 'grid', gap: 10 }}><p className="muted sm">${results.length} ${results.length === 1 ? 'document' : 'documents'} found across ${okIds.length} drives you can open</p>${results.length ? html`<${FileTable} files=${results} onOpen=${(id) => setModal({ id })} showPath/>` : html`<div className="empty"><p>No documents match. Try a supplier name, a reference number or a cabinet.</p></div>`}</div>`
        : !drive ? html`<div className="empty"><p>No drives yet.</p></div>`
        : !drive.ok ? html`<div className="locked-box"><${Icon} n="lock" s=${24}/><h2>You can’t open ${drive.name}</h2><p className="muted">Access comes from your login. ${drive.name} is open to: ${drive.access.map((x) => deptById(db, x).name).join(', ')}. Ask an admin if you need access.</p></div>`
        : html`<div style=${{ display: 'grid', gap: 12 }}>
          <div className="crumbs"><${Icon} n="folder" s=${16}/>${crumbs.length ? html`<button onClick=${() => setFolderId(null)}>${drive.name}</button>` : html`<span className="cur">${drive.name}</span>`}${crumbs.map((cf, i) => html`<${React.Fragment} key=${cf.id}><span className="muted">›</span>${i === crumbs.length - 1 ? html`<span className="cur">${cf.name}</span>` : html`<button onClick=${() => setFolderId(cf.id)}>${cf.name}</button>`}<//>`)}</div>
          ${!crumbs.length && drive.desc && html`<p className="muted sm">${drive.desc}</p>`}
          ${nf !== null && html`<form className="dtool" onSubmit=${addFolder}><input id="nf-name" className="input" style=${{ maxWidth: 320 }} autoFocus value=${nf} onChange=${(e) => setNf(e.target.value)} placeholder="Folder name, e.g. 12 December"/><button className="btn primary">Create</button><button type="button" className="btn ghost" onClick=${() => setNf(null)}>Cancel</button></form>`}
          ${(() => { const fl = db.folders.filter((x) => x.drive === driveId && x.parent === folderId); const fs = db.files.filter((x) => x.drive === driveId && x.folder === folderId).sort((a, b) => (b.docDate || '').localeCompare(a.docDate || ''));
            return html`${fl.length > 0 && html`<div className="folders">${fl.map((x) => html`<button key=${x.id} className="folder" onClick=${() => setFolderId(x.id)}><${Icon} n="folder" s=${20}/><span>${x.name}<small>${countIn(x.id)} documents</small></span></button>`)}</div>`}
              ${fs.length > 0 ? html`<${FileTable} files=${fs} onOpen=${(id) => setModal({ id })}/>` : !fl.length && html`<div className="empty"><p>This folder is empty.</p><button className="btn primary" onClick=${() => setModal({ add: true })}>Add the first document</button></div>`}`; })()}
        </div>`}
      </div>
    </div>
    ${modal && html`<${DocModal} fileId=${modal.id || null} driveId=${driveId} folderId=${folderId} onClose=${() => setModal(null)}/>`}
  <//>`;
}

/* ---------------- pins ---------------- */
function PinsView() {
  const { db, user, update, toast, ask } = useApp();
  const pins = db.pins[user.id] || { posts: [], notes: [] };
  const posts = pins.posts.map((id) => db.posts.find((p) => p.id === id)).filter((p) => p && canSee(db, p, user));
  const [form, setForm] = useState(null);
  const [shown, setShown] = useState({});
  const save = (e) => {
    e.preventDefault(); if (!form.title.trim()) return;
    update((d) => { d.pins[user.id] = d.pins[user.id] || { posts: [], notes: [] }; const L = d.pins[user.id].notes; if (form.id) Object.assign(L.find((n) => n.id === form.id), { ...form, title: form.title.trim() }); else L.unshift({ ...form, id: uid('n'), title: form.title.trim(), at: Date.now() }); });
    setForm(null); toast('Saved to your pins');
  };
  const copy = (text) => { try { navigator.clipboard.writeText(text).then(() => toast('Copied'), () => toast('Couldn’t copy here. Select the text instead.', 'warn')); } catch (e) { toast('Couldn’t copy here. Select the text instead.', 'warn'); } };
  return html`<${Page} title="My pins" sub="Your own archive: posts you pinned and notes you don’t want to forget. Only you can see them." actions=${!form && html`<button className="btn primary" onClick=${() => setForm({ icon: '📝', title: '', body: '', sensitive: false })}><${Icon} n="plus" s=${16}/>New note</button>`}>
    <div className="privacy"><${Icon} n="lock" s=${16}/><span>Notes marked <b>sensitive</b> stay hidden until you tap Show. This demo keeps them in your browser only, so don’t store real passwords or codes here. A live version would encrypt them.</span></div>
    ${form && html`<form className="note" onSubmit=${save} style=${{ gap: 12 }}>
      <div className="field"><span>Icon</span><div className="iconpick">${TILE_ICONS.slice(0, 24).map((ic) => html`<button type="button" key=${ic} className=${form.icon === ic ? 'on' : ''} onClick=${() => setForm({ ...form, icon: ic })}>${ic}</button>`)}</div></div>
      <label className="field"><span>Title</span><input id="note-title" className="input" autoFocus value=${form.title} onChange=${(e) => setForm({ ...form, title: e.target.value })} placeholder="e.g. Supplier rep numbers"/></label>
      <label className="field"><span>Note</span><textarea id="note-body" rows="3" value=${form.body} onChange=${(e) => setForm({ ...form, body: e.target.value })}></textarea></label>
      <label className="sm" style=${{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked=${form.sensitive} onChange=${(e) => setForm({ ...form, sensitive: e.target.checked })}/>Sensitive: hide it until I tap Show</label>
      <div className="note-a"><button className="btn primary">Save note</button><button type="button" className="btn ghost" onClick=${() => setForm(null)}>Cancel</button></div>
    </form>`}
    <section className="group"><h2 className="group-h">Notes <span className="n">${pins.notes.length}</span></h2>
      ${pins.notes.length ? html`<div className="notes">${pins.notes.map((n) => { const hidden = n.sensitive && !shown[n.id]; return html`<div className="note" key=${n.id}>
        <div className="note-h"><span className="note-ic">${n.icon}</span><span className="note-t">${n.title}</span>${n.sensitive && html`<span className="chip"><${Icon} n="lock" s=${12}/>Sensitive</span>`}</div>
        <div className=${'note-b' + (hidden ? ' masked' : '')}>${hidden ? '••••••••' : n.body}</div>
        <div className="note-a">
          ${n.sensitive && html`<button className="btn sm" onClick=${() => setShown((s) => ({ ...s, [n.id]: !s[n.id] }))}><${Icon} n=${hidden ? 'eye' : 'eyeoff'} s=${14}/>${hidden ? 'Show' : 'Hide'}</button>`}
          ${!hidden && html`<button className="btn sm ghost" onClick=${() => copy(n.body)}><${Icon} n="copy" s=${14}/>Copy</button>`}
          <button className="btn sm ghost" onClick=${() => setForm({ ...n })}><${Icon} n="edit" s=${14}/>Edit</button>
          <button className="btn sm ghost" onClick=${() => ask({ title: 'Delete “' + n.title + '”?', body: 'This note is removed from your pins.', confirm: 'Delete note', danger: true, onConfirm: () => update((d) => { d.pins[user.id].notes = d.pins[user.id].notes.filter((x) => x.id !== n.id); }) })}><${Icon} n="trash" s=${14}/>Delete</button>
        </div></div>`; })}</div>` : html`<div className="empty"><p>No notes yet. Add things you look up often, like supplier numbers or opening steps.</p></div>`}
    </section>
    <section className="group"><h2 className="group-h">Pinned posts <span className="n">${posts.length}</span></h2>
      ${posts.length ? html`<div className="cards">${posts.map((p) => html`<${PostCard} key=${p.id} p=${p}/>`)}</div>` : html`<div className="empty"><p>Open any post and tap Pin to keep it here.</p></div>`}
    </section>
  <//>`;
}

/* ---------------- search ---------------- */
function SearchView() {
  const { db, user, searchQ, setSearchQ, compose, openChat } = useApp();
  const [scope, setScope] = useState('posts'); const [status, setStatus] = useState('all');
  const [fileOpen, setFileOpen] = useState(null);
  const raw = searchQ.trim().toLowerCase();
  const tokens = raw.split(/\s+/).filter(Boolean);
  const mentions = tokens.filter((t) => t.startsWith('@') && t.length > 1).map((t) => t.slice(1));
  const nums = tokens.filter((t) => /^#\d+$/.test(t)).map((t) => +t.slice(1));
  const words = tokens.filter((t) => !t.startsWith('@') && !/^#\d+$/.test(t));
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const involves = (p, m) => [...Object.keys(p.recips), p.author].some((id) => norm((userById(db, id) || { name: '' }).name).includes(norm(m))) || [...p.toDepts, p.about].some((d) => norm(deptById(db, d).name).includes(norm(m)));
  const text = (p) => [p.title, p.body, ...p.activity.map((a) => a.text || ''), ...p.attachments.map((a) => a.name), (userById(db, p.author) || {}).name, deptById(db, p.about).name, TYPES[p.type].label, LEVELS[p.level].label].join(' ').toLowerCase();
  const posts = !raw ? [] : db.posts.filter((p) => canSee(db, p, user) && (!nums.length || nums.includes(p.no)) && mentions.every((m) => involves(p, m)) && words.every((w) => text(p).includes(w)))
    .filter((p) => status === 'all' || (status === 'open') === !(p.closed || Object.values(p.recips).every((r) => r.status === 'done'))).sort((a, b) => b.createdAt - a.createdAt);
  const okDrives = db.drives.filter((d) => driveOn(db, d) && canDrive(user, d)).map((d) => d.id);
  const chatIds = new Set(myChats(db, user.id).map((c) => c.id));
  const msgs = !raw || nums.length ? [] : db.messages.filter((m) => m.kind === 'msg' && m.text && chatIds.has(m.chat)
    && words.every((w) => m.text.toLowerCase().includes(w))
    && mentions.every((mm) => norm((userById(db, m.user) || { name: '' }).name).includes(norm(mm)) || (m.mentions || []).some((x) => norm(x.label).includes(norm(mm)))))
    .sort((a, b) => b.at - a.at).slice(0, 60);
  const files = !raw || nums.length ? [] : db.files.filter((f) => okDrives.includes(f.drive) && fileMatches(db, f, [...words, ...mentions].join(' ')));
  const people = !raw || nums.length ? [] : db.users.filter((u) => u.active !== false && [...words, ...mentions].every((w) => (u.name + ' ' + u.title + ' ' + u.depts.map((d) => deptById(db, d).name).join(' ')).toLowerCase().includes(w)));
  const examples = ['@bakery', '#1047', 'invoice highveld', '@fatima', 'cabinet 2', 'load-shedding'];
  return html`<${Page} title="Search" sub="Find any post, document or person without scrolling through chats. Use @ for a person or team and # for a post number.">
    <label className="bigsearch"><${Icon} n="search" s=${20}/><input id="big-search" autoFocus value=${searchQ} onChange=${(e) => setSearchQ(e.target.value)} placeholder="Try @bakery, #1046, invoice, Highveld…" aria-label="Search"/>${searchQ && html`<button className="icon-btn sm" onClick=${() => setSearchQ('')} aria-label="Clear search"><${Icon} n="close" s=${15}/></button>`}</label>
    ${!raw ? html`<div className="tips">Examples: ${examples.map((x) => html`<button key=${x} onClick=${() => setSearchQ(x)}>${x}</button>`)}</div>` : html`
      <div className="tabs" role="tablist">
        <button className=${scope === 'posts' ? 'on' : ''} onClick=${() => setScope('posts')}>Posts <b>${posts.length}</b></button>
        <button className=${scope === 'messages' ? 'on' : ''} onClick=${() => setScope('messages')}>Messages <b>${msgs.length}</b></button>
        <button className=${scope === 'files' ? 'on' : ''} onClick=${() => setScope('files')}>Documents <b>${files.length}</b></button>
        <button className=${scope === 'people' ? 'on' : ''} onClick=${() => setScope('people')}>People <b>${people.length}</b></button>
      </div>
      ${scope === 'posts' && html`<div className="filters"><div className="seg" role="group" aria-label="Status">${[['all', 'All'], ['open', 'Still open'], ['done', 'Finished']].map(([k, l]) => html`<button key=${k} className=${status === k ? 'on' : ''} onClick=${() => setStatus(k)}>${l}</button>`)}</div></div>
        ${posts.length ? html`<div className="cards">${posts.map((p) => html`<${PostCard} key=${p.id} p=${p}/>`)}</div>` : html`<div className="empty"><p>No posts match “${searchQ}”.</p></div>`}`}
      ${scope === 'messages' && (msgs.length ? html`<div className="cards">${msgs.map((m) => { const c = db.chats.find((x) => x.id === m.chat); return html`<button key=${m.id} className="msg-hit" onClick=${() => openChat(c.id)}><${ChatAvatar} c=${c} s=${40}/><span className="pm"><span className="mh-top"><b>${chatName(db, c, user.id)}</b><span className="muted sm">${ago(m.at)}</span></span><span className="sm"><b>${m.user === user.id ? 'You' : firstName(userById(db, m.user))}:</b> <${MsgText} text=${m.text} mentions=${m.mentions}/></span></span></button>`; })}</div>` : html`<div className="empty"><p>No chat messages match “${searchQ}”.</p></div>`)}
      ${scope === 'files' && (files.length ? html`<${FileTable} files=${files} onOpen=${setFileOpen} showPath/>` : html`<div className="empty"><p>No documents you can open match “${searchQ}”.</p></div>`)}
      ${scope === 'people' && (people.length ? html`<div className="people">${people.map((u) => html`<div className="person" key=${u.id}><${Avatar} u=${u} s=${36}/><div className="pm"><b>${u.name}</b><span className="muted sm">${u.title} · ${u.depts.map((d) => deptById(db, d).name).join(', ')}</span></div>${u.id !== user.id && html`<button className="btn sm" onClick=${() => compose({ to: [{ k: 'u', id: u.id }], about: u.depts[0] })}><${Icon} n="at" s=${14}/>Tag</button>`}</div>`)}</div>` : html`<div className="empty"><p>No one matches “${searchQ}”.</p></div>`)}
    `}
    ${fileOpen && html`<${DocModal} fileId=${fileOpen} onClose=${() => setFileOpen(null)}/>`}
  <//>`;
}

/* ---------------- admin ---------------- */
function PersonModal({ personId, onClose }) {
  const { db, update, toast, user } = useApp();
  const p = userById(db, personId);
  const [v, setV] = useState(() => (p ? { ...p } : { name: '', title: '', role: 'staff', depts: [], manages: [], pin: '', active: true }));
  const [err, setErr] = useState('');
  const set = (k, x) => setV((o) => ({ ...o, [k]: x }));
  const flip = (k, id) => setV((o) => ({ ...o, [k]: o[k].includes(id) ? o[k].filter((x) => x !== id) : [...o[k], id] }));
  const save = () => {
    if (!v.name.trim()) return setErr('Enter a name.');
    if (!v.depts.length) return setErr('Put them in at least one department.');
    if (!/^\d{4}$/.test(v.pin || '')) return setErr('The PIN must be 4 digits.');
    if (p && p.id === user.id && v.role !== 'admin') return setErr('You can’t remove your own admin access.');
    const clean = { ...v, name: v.name.trim(), title: v.title.trim() || 'Staff', manages: v.role === 'staff' ? [] : v.manages };
    update((d) => { if (p) Object.assign(d.users.find((u) => u.id === p.id), clean); else d.users.push({ ...clean, id: uid('u') }); });
    toast(p ? 'Saved ' + clean.name : clean.name + ' can now log in'); onClose();
  };
  return html`<${Modal} title=${p ? 'Edit ' + p.name : 'Add a person'} onClose=${onClose} wide footer=${html`<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>${p ? 'Save' : 'Add person'}</button>`}>
    <div className="row2">
      <label className="field"><span>Full name</span><input id="pm-name" className="input" value=${v.name} onChange=${(e) => set('name', e.target.value)}/></label>
      <label className="field"><span>Job title</span><input id="pm-title" className="input" value=${v.title} onChange=${(e) => set('title', e.target.value)} placeholder="e.g. Baker"/></label>
      <label className="field"><span>Access level</span><select id="pm-role" className="select" value=${v.role} onChange=${(e) => set('role', e.target.value)}><option value="staff">Staff: sees their own posts and team tools</option><option value="manager">Manager: also sees their team’s progress</option><option value="admin">Admin: sees everything, manages people</option></select></label>
      <label className="field"><span>Login PIN (4 digits)</span><input id="pm-pin" className="input mono" inputMode="numeric" maxLength="4" value=${v.pin} onChange=${(e) => set('pin', e.target.value.replace(/\D/g, ''))}/></label>
    </div>
    <div className="field"><span>Departments they belong to</span><div className="checks">${db.depts.map((d) => html`<label key=${d.id}><input type="checkbox" checked=${v.depts.includes(d.id)} onChange=${() => flip('depts', d.id)}/>${d.name}</label>`)}</div><small>Tagging one of these teams reaches this person.</small></div>
    <div className="field"><span>Departments they manage</span><div className="checks">${db.depts.map((d) => html`<label key=${d.id} className=${v.role === 'staff' ? 'dis' : ''}><input type="checkbox" disabled=${v.role === 'staff'} checked=${v.manages.includes(d.id)} onChange=${() => flip('manages', d.id)}/>${d.name}</label>`)}</div><small>Managers see the progress of everyone in these teams and can edit the team’s tools.</small></div>
    ${p && p.id !== user.id && html`<label className="sm" style=${{ display: 'flex', gap: 8, alignItems: 'center' }}><input type="checkbox" checked=${v.active === false} onChange=${(e) => set('active', !e.target.checked)}/>Deactivated: can’t log in and won’t be tagged</label>`}
    ${err && html`<p className="err">${err}</p>`}
  <//>`;
}
function AdminView() {
  const { db, user, update, toast } = useApp();
  const flipFeature = (deptId, key) => update((d) => { const x = d.depts.find((y) => y.id === deptId); x.features = { ...(x.features || {}), [key]: !featureOn(x, key) }; });
  const [tab, setTab] = useState('people');
  const [edit, setEdit] = useState(null);
  const [nd, setNd] = useState({ name: '', color: TILE_COLORS[0] });
  if (tab === 'x') return null;
  const addDept = (e) => {
    e.preventDefault(); const name = nd.name.trim(); if (!name) return;
    const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 12) + Math.random().toString(36).slice(2, 5);
    update((d) => {
      d.depts.push({ id, name, color: nd.color, features: { tools: false, drive: false } });
      d.drives.push({ id: 'd-' + id, name, access: [id, 'mgmt'], desc: name + ' documents.' });
      d.chats.push({ id: 'c-' + id, kind: 'group', name, icon: '💬', color: nd.color, dept: id, members: [], createdBy: user.id, createdAt: Date.now(), read: {} });
    });
    setNd({ name: '', color: TILE_COLORS[0] }); toast(name + ' added, with its own group chat');
  };
  const flipAccess = (driveId, deptId) => update((d) => { const dr = d.drives.find((x) => x.id === driveId); dr.access = dr.access.includes(deptId) ? dr.access.filter((x) => x !== deptId) : [...dr.access, deptId]; });
  return html`<${Page} title="People & access" sub="Who can log in, which departments they’re in, and which drives each department can open." actions=${tab === 'people' && html`<button className="btn primary" onClick=${() => setEdit('new')}><${Icon} n="plus" s=${16}/>Add person</button>`}>
    <div className="tabs" role="tablist">${[['people', 'People', db.users.length], ['depts', 'Departments', db.depts.length], ['drives', 'Drive access', db.drives.filter((dr) => driveOn(db, dr)).length]].map(([k, l, n]) => html`<button key=${k} className=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${l} <b>${n}</b></button>`)}</div>
    ${tab === 'people' && html`<div className="table-wrap"><table>
      <thead><tr><th>Name</th><th>Access</th><th>Departments</th><th>Manages</th><th>PIN</th></tr></thead>
      <tbody>${db.users.map((u) => html`<tr key=${u.id} onClick=${() => setEdit(u.id)} tabIndex="0" onKeyDown=${(e) => { if (e.key === 'Enter') setEdit(u.id); }} style=${u.active === false ? { opacity: 0.5 } : null}>
        <td><div className="fname" style=${{ alignItems: 'center' }}><${Avatar} u=${u} s=${28}/><span>${u.name}<span className="muted sm" style=${{ display: 'block', fontWeight: 400 }}>${u.title}${u.active === false ? ' · deactivated' : ''}</span></span></div></td>
        <td><span className=${'rolebadge ' + u.role}>${u.role}</span></td>
        <td>${u.depts.map((d) => deptById(db, d).name).join(', ')}</td>
        <td>${u.manages.map((d) => deptById(db, d).name).join(', ') || html`<span className="muted">–</span>`}</td>
        <td className="mono">••••</td>
      </tr>`)}</tbody></table></div>`}
    ${tab === 'depts' && html`<div style=${{ display: 'grid', gap: 14 }}>
      <form className="dtool" onSubmit=${addDept}><input id="nd-name" className="input" style=${{ maxWidth: 280 }} value=${nd.name} onChange=${(e) => setNd({ ...nd, name: e.target.value })} placeholder="New department, e.g. Butchery"/><div className="swatches">${TILE_COLORS.map((c) => html`<button type="button" key=${c} className=${nd.color === c ? 'on' : ''} style=${{ '--c': c }} onClick=${() => setNd({ ...nd, color: c })} aria-label=${'Colour ' + c}></button>`)}</div><button className="btn primary">Add department</button></form>
      <p className="feat-note">Every department starts with its group chat, tagging and the “Needs you” board. Switch on the extra tools as each department comes on board.</p>
      <div className="dgrid">${db.depts.map((d) => html`<div key=${d.id} className="dcard"><div className="dcard-h"><span className="dsw" style=${{ '--c': d.color }}></span><div><h3>${d.name}</h3><span className="muted sm">${deptMembers(db, d.id).length} people · ${db.users.filter((u) => u.manages.includes(d.id)).map((u) => firstName(u)).join(', ') || 'no manager'}</span></div></div>

    .sort((a, b) => ((b.last && b.last.at) || b.c.createdAt) - ((a.last && a.last.at) || a.c.createdAt));
  const unreadChats = rows.filter((r) => r.unread > 0).length;
  const shown = rows.filter((r) => (filter === 'all' || (filter === 'unread' && r.unread > 0) || (filter === 'groups' && r.c.kind === 'group') || (filter === 'direct' && r.c.kind === 'dm'))
    && (!q || chatName(db, r.c, user.id).toLowerCase().includes(q.toLowerCase())));
  const open = rows.find((r) => r.c.id === openChatId);
  return html`<div className=${'chats' + (open ? ' has-chat' : '')}>
    <aside className="chatlist" aria-label="Chats">
      <div className="cl-head"><h2>Chats</h2><button className="icon-btn solid" onClick=${() => setNewChat(true)} title="New chat or group" aria-label="New chat or group"><${Icon} n="plus"/></button></div>
      <label className="tsearch cl-search"><${Icon} n="search" s=${15}/><input id="chat-q" value=${q} onChange=${(e) => setQ(e.target.value)} placeholder="Search chats" aria-label="Search chats"/></label>
      <div className="seg cl-filter" role="group" aria-label="Show">${[['all', 'All'], ['unread', 'Unread' + (unreadChats ? ' ' + unreadChats : '')], ['groups', 'Groups'], ['direct', 'Direct']].map(([k, l]) => html`<button key=${k} className=${filter === k ? 'on' : ''} onClick=${() => setFilter(k)}>${l}</button>`)}</div>
      <div className="cl-items">
        ${shown.length === 0 && html`<p className="muted sm" style=${{ padding: '12px 10px' }}>${filter === 'unread' ? 'No unread chats.' : 'No chats match.'}</p>`}
        ${shown.map((r) => html`<${ChatItem} key=${r.c.id} r=${r} on=${openChatId === r.c.id} onOpen=${() => openChat(r.c.id)}/>`)}
      </div>
    </aside>
    <section className="convo">${open ? html`<${Conversation} key=${open.c.id} c=${open.c}/>` : html`<div className="convo-empty"><span className="chat-av" style=${{ width: 68, height: 68, fontSize: 32, '--c': '#5E6B65' }}>💬</span><h2>Pick a chat</h2><p>Your department groups work like WhatsApp. Type @ in a message to tag someone, and it stays on their “Needs you” board until they deal with it.</p></div>`}</section>
    ${newChat && html`<${NewChatModal} onClose=${() => setNewChat(false)}/>`}
  </div>`;
}

/* ---------------- shell + app ---------------- */
const SCENES = ['warm', 'night', 'fresh'];
const SCENE_KEY = 'floorboard.scene.v1';
const DESKTOP_SHELL = /[?&]shell=desktop\b/.test(location.search);
function Shell() {
  const { view, openId, closePost, drawer, setDrawer, composer, closeComposer, ask, resetDemo, openChatId } = useApp();
  const chatsMode = view === 'chats';
  let content;
  if (view === 'needs' || view === 'all' || view === 'sent') content = html`<${FeedView} kind=${view}/>`;
  else if (view === 'team') content = html`<${TeamView}/>`;
  else if (view === 'teams') content = html`<${TeamsView}/>`;
  else if (view.startsWith('dept:')) content = html`<${DeptView} id=${view.slice(5)}/>`;
  else if (view === 'drive') content = html`<${DriveView}/>`;
  else if (view === 'pins') content = html`<${PinsView}/>`;
  else if (view === 'search') content = html`<${SearchView}/>`;
  else if (view === 'admin') content = html`<${AdminView}/>`;
  const note = html`<p className="board-note">Demo store with example staff. Changes stay on this device. <button onClick=${() => ask({ title: 'Reset the demo store?', body: 'All posts, files, pins and people go back to the example data. Anything you added is removed.', confirm: 'Reset demo', danger: true, onConfirm: resetDemo })}>Reset demo</button></p>`;
  return html`<div className=${'shell' + (openId ? ' has-detail' : '') + (chatsMode && openChatId ? ' chat-open' : '')}>
    <${Topbar}/>
    <${Rail}/>
    ${drawer && html`<div className="side-scrim" onClick=${() => setDrawer(false)}></div>`}
    ${chatsMode ? html`<main className="stage glass chats-mode"><${ChatsView}/></main>` : html`<main className="stage glass">
      <aside className="board-col"><${Board} note=${note}/></aside>
      <section className="content" key=${view}>${content}</section>
    </main>`}
    <${Dock}/>
    ${openId && html`<div className="detail-scrim" onClick=${closePost}></div>`}
    ${openId && html`<aside className="detail" aria-label="Post details"><${PostDetail} key=${openId} id=${openId}/></aside>`}
    ${composer && html`<${Composer} preset=${composer} onClose=${closeComposer}/>`}
    <${ConfirmModal}/>
    <${Lightbox}/>
  </div>`;
}
function App() {
  const [db, setDb] = useState(loadDb);
  const [me, setMe] = useState(() => lsGet(SESSION_KEY));
  const [mode, setMode] = useState(() => (location.hash === '#widget' ? 'widget' : 'full'));
  const [scene, setSceneState] = useState(() => { const s = lsGet(SCENE_KEY); return SCENES.includes(s) ? s : 'warm'; });
  const [view, setView] = useState('chats');
  const [openChatId, setOpenChatId] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [composer, setComposer] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [lightbox, setLightbox] = useState(null);
  const [drawer, setDrawer] = useState(false);
  const [confirmState, setConfirmState] = useState(null);
  const [filters, setFilters] = useState(NO_FILTERS);
  const [searchQ, setSearchQ] = useState('');
  const [saved, setSaved] = useState(true);
  useEffect(() => { setSaved(saveDb(db)); }, [db]);
  // The desktop sidebar, the full app and other tabs share this storage: follow their changes live.
  useEffect(() => {
    const h = (e) => {
      if (e.key === LS_KEY && e.newValue) { try { setDb(JSON.parse(e.newValue)); } catch (x) { } }
      if (e.key === SESSION_KEY) setMe(e.newValue || null);
      if (e.key === SCENE_KEY && SCENES.includes(e.newValue)) setSceneState(e.newValue);
    };
    window.addEventListener('storage', h); return () => window.removeEventListener('storage', h);
  }, []);
  useEffect(() => {
    const h = () => { setMode(location.hash === '#widget' ? 'widget' : 'full'); setOpenId(null); setDrawer(false); };
    window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h);
  }, []);
  useEffect(() => { document.documentElement.classList.toggle('native-glass', DESKTOP_SHELL && mode === 'widget'); }, [mode]);
  const update = useCallback((fn) => setDb((prev) => { const next = structuredClone(prev); fn(next); return next; }), []);
  const user = me ? db.users.find((u) => u.id === me && u.active !== false) : null;
  const toast = useCallback((msg, kind) => { const id = uid('t'); setToasts((t) => [...t, { id, msg, kind }]); setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3800); }, []);
  const go = useCallback((v) => { setView(v); setOpenId(null); setDrawer(false); }, []);
  // Pop-up alerts for anything new that needs this person; also keeps the desktop sidebar's count up to date
  // and wakes it for red items.
  const [alerts, setAlerts] = useState([]);
  const [soundOn, setSoundOnState] = useState(() => lsGet('floorboard.sound.v1') !== 'off');
  const known = useRef(null);
  const dismissAlert = useCallback((id) => setAlerts((l) => l.filter((x) => x.id !== id)), []);
  const openAlert = (a) => {
    dismissAlert(a.id);
    const desk = window.floorboardDesktop;
    if (a.postId) { setOpenId(a.postId); return; }
    if (mode === 'widget') { if (desk && desk.openFull) desk.openFull(); else location.hash = ''; }
    setOpenChatId(a.chatId); setView('chats'); setOpenId(null);
  };
  const openAlertRef = useRef(openAlert); openAlertRef.current = openAlert;
  useEffect(() => { known.current = null; setAlerts([]); }, [me]);
  useEffect(() => {
    if (!user) return;
    const desk = window.floorboardDesktop;
    const items = alertItems(db, user.id);
    const count = db.posts.filter((p) => needsMe(p, user.id)).length;
    if (!known.current) { known.current = new Set(items.map((i) => i.key)); if (desk && desk.attention) desk.attention({ count, urgent: false }); return; }
    const fresh = items.filter((i) => !known.current.has(i.key));
    fresh.forEach((i) => known.current.add(i.key));
    if (desk && desk.attention) desk.attention({ count, urgent: fresh.some((i) => i.level === 'red') });
    if (!fresh.length) return;
    fresh.slice(-3).forEach((i) => {
      const a = { ...i, id: uid('al') };
      setAlerts((l) => [...l.slice(-3), a]);
      if (i.level !== 'red') setTimeout(() => dismissAlert(a.id), 9000);
      try {
        if (popupPermission() === 'granted' && (document.hidden || !document.hasFocus())) {
          const n = new Notification(i.title, { body: i.body, icon: 'icon-192.png', tag: i.key, requireInteraction: i.level === 'red' });
          n.onclick = () => { window.focus(); if (desk && desk.focus) desk.focus(); openAlertRef.current(a); n.close(); };
        }
      } catch (e) { /* pop-ups are optional; the in-app alert still shows */ }
    });
    if (soundOn) chime(fresh.some((i) => i.level === 'red'));
  }, [db, user && user.id]);
  useEffect(() => {
    const h = (e) => { if (e.key !== 'Escape' || document.querySelector('.modal-wrap,.lightbox')) return; if (openId) setOpenId(null); else if (drawer) setDrawer(false); };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  }, [openId, drawer]);
  const ctx = {
    db, update, user, view, go, openId, toast, toasts, filters, setFilters, searchQ, setSearchQ, saved, drawer, setDrawer, lightbox, setLightbox, composer,
    confirmState, ask: setConfirmState, mode, scene, openChatId,
    openChat: (id) => { setOpenChatId(id); setView('chats'); setOpenId(null); setDrawer(false); },
    closeChat: () => setOpenChatId(null),
    alerts, dismissAlert, openAlert, soundOn,
    setSoundOn: (v) => { setSoundOnState(v); lsSet('floorboard.sound.v1', v ? 'on' : 'off'); if (v) chime(false); },
    enablePopups: () => {
      try { Notification.requestPermission().then((p) => toast(p === 'granted' ? 'Pop-up alerts are on for this device' : 'Pop-ups were blocked. Alerts still show inside the app.', p === 'granted' ? undefined : 'warn')); }
      catch (e) { toast('Pop-ups aren’t available here. Alerts still show inside the app.', 'warn'); }
    },
    // Demo only: a colleague sends you something a few seconds from now, so you can see how it arrives.
    sendTestTask: () => {
      if (!user) return;
      const others = db.users.filter((u) => u.id !== user.id && u.active !== false);
      const from = others.find((u) => u.role !== 'staff' && u.depts.some((d) => user.depts.includes(d))) || others.find((u) => u.role === 'admin') || others[0];
      const t = TEST_TASKS[testIdx++ % TEST_TASKS.length];
      toast('Demo: ' + firstName(from) + ' sends you a ' + TYPES[t.type].label.toLowerCase() + ' in 3 seconds');
      setTimeout(() => update((d) => {
        const now = Date.now();
        let ch = d.chats.find((c) => c.kind === 'dm' && c.members.includes(from.id) && c.members.includes(user.id));
        if (!ch) { ch = { id: uid('c'), kind: 'dm', name: '', icon: '', color: '', dept: null, members: [from.id, user.id], createdBy: from.id, createdAt: now, read: {} }; d.chats.push(ch); }
        d.counter += 1;
        const pid = uid('p');
        d.posts.unshift({ id: pid, chat: ch.id, no: d.counter, type: t.type, title: t.title, body: '', author: from.id, createdAt: now, toUsers: [user.id], toDepts: [], about: user.depts[0],
          level: t.level, due: t.type === 'task' ? dkey() : null, attachments: [], recips: { [user.id]: { status: 'todo', pct: 0, seen: null, updatedAt: null } }, activity: [], poll: null, closed: false });
        d.messages.push({ id: uid('m'), chat: ch.id, user: from.id, at: now, text: '', attachments: [], mentions: [], replyTo: null, postId: pid, kind: 'msg' });
      }), 3000);
    },
    setScene: (s) => { setSceneState(s); lsSet(SCENE_KEY, s); },
    openPost: (id) => { setOpenId(id); setDrawer(false); }, closePost: () => setOpenId(null),
    compose: (preset) => setComposer(preset || {}), closeComposer: () => setComposer(null),
    login: (id) => { lsSet(SESSION_KEY, id); setMe(id); setView('chats'); setOpenChatId(null); setOpenId(null); setFilters(NO_FILTERS); },
    logout: () => { lsSet(SESSION_KEY, ''); setMe(null); setOpenId(null); setDrawer(false); setComposer(null); },
    resetDemo: async () => { await Blobs.clear(); setDb(seed()); setOpenId(null); setOpenChatId(null); setView('chats'); setFilters(NO_FILTERS); toast('Demo store reset'); },
  };
  return html`<${Ctx.Provider} value=${ctx}>
    <div className="scene" data-scene=${scene} aria-hidden="true"></div>
    ${!user ? html`<${Login}/>` : mode === 'widget' ? html`<${Widget}/>` : html`<${Shell}/>`}
    <${AlertStack}/>
    <${Toasts}/>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
