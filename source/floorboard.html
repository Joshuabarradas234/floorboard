// posts, documents, people and chats matching every word: the island's quick search (Enter opens the full search)
function islFind(db, user, q) {
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return null;
  const has = (s) => words.every((w) => String(s || '').toLowerCase().includes(w));
  const posts = db.posts.filter((p) => canSee(db, p, user) && has([p.title, p.body, '#' + p.no, (userById(db, p.author) || {}).name, deptById(db, p.about).name, ...p.attachments.map((a) => a.name)].join(' '))).sort((a, b) => b.createdAt - a.createdAt).slice(0, 5);
  const okDrives = db.drives.filter((d) => driveOn(db, d) && canDrive(user, d)).map((d) => d.id);
  const files = [...db.files.filter((f) => okDrives.includes(f.drive) && fileMatches(db, f, words.join(' '))).map((f) => ({ id: f.id, name: f.name, where: (db.drives.find((d) => d.id === f.drive) || {}).name || 'Drive' })),
    ...(((db.pins[user.id] || {}).myfiles) || []).filter((f) => has(f.title)).map((f) => ({ id: f.id, name: f.title, where: 'My files' }))].slice(0, 5);
  const people = db.users.filter((u) => u.active !== false && has(u.name + ' ' + u.title)).slice(0, 4);
  const chats = myChats(db, user.id).filter((c) => has(chatName(db, c, user.id))).slice(0, 4);
  return { posts, files, people, chats, total: posts.length + files.length + people.length + chats.length };
}

/* ---------------- team progress ---------------- */
function TeamView() {
  const { db, user, openPost, update, toast } = useApp();
  const options = user.role === 'admin' ? [{ id: 'all', name: 'Whole store', color: '#5E6B65' }, ...db.depts] : db.depts.filter((d) => user.manages.includes(d.id));
  const [sel, setSel] = useState(options[0] ? options[0].id : null);
  const [openRow, setOpenRow] = useState(null);
  if (!sel) return html`<${Page} title="Team progress"><div className="empty"><h3>You don’t manage a team yet</h3><p>An admin can make you the manager of a department.</p></div><//>`;
  const memberIds = (sel === 'all' ? db.users.filter((u) => u.active !== false).map((u) => u.id) : deptMembers(db, sel)).filter((id) => id !== user.id);
  const tasks = db.posts.filter((p) => p.type === 'task' && !p.closed);
  const rows = memberIds.map((id) => {
    const mine = tasks.filter((p) => p.recips[id]);
    const open = mine.filter((p) => p.recips[id].status !== 'done');
    const avg = open.length ? Math.round(open.reduce((a, p) => a + (p.recips[id].pct || 0), 0) / open.length) : null;
    return { u: userById(db, id), open, overdue: open.filter((p) => isOverdue(p, id)), stale: open.filter((p) => isStale(p, id)),
      doneWeek: mine.filter((p) => p.recips[id].status === 'done' && (p.recips[id].updatedAt || 0) > Date.now() - 7 * DAY), avg,
      waiting: db.posts.filter((p) => p.type !== 'task' && needsMe(p, id)).length };
  }).sort((a, b) => b.overdue.length - a.overdue.length || b.stale.length - a.stale.length || b.open.length - a.open.length);
  const sum = (k) => rows.reduce((a, r) => a + r[k].length, 0);
  const nudge = (p, id) => { update((d) => { const q = d.posts.find((x) => x.id === p.id); q.recips[id].nudgedAt = Date.now(); q.recips[id].seen = null; q.activity.push({ id: uid('e'), kind: 'system', user: user.id, at: Date.now(), text: 'nudged ' + userById(d, id).name + ' for a progress update' }); }); toast('Nudged ' + firstName(userById(db, id))); };
  return html`<${Page} title="Team progress" sub="How far along each person is with the tasks they’ve been given, whoever gave them. People who haven’t posted an update in 2 days are flagged.">
    ${options.length > 1 && html`<div className="filters"><div className="seg" role="group" aria-label="Team">${options.map((o) => html`<button key=${o.id} className=${sel === o.id ? 'on' : ''} onClick=${() => { setSel(o.id); setOpenRow(null); }}>${o.name}</button>`)}</div></div>`}
    <div className="stats">
      <div className="stat"><b>${sum('open')}</b><span>Open tasks</span></div>
      <div className=${'stat' + (sum('overdue') ? ' bad' : '')}><b>${sum('overdue')}</b><span>Overdue</span></div>
      <div className=${'stat' + (sum('stale') ? ' warn' : '')}><b>${sum('stale')}</b><span>No update in 2+ days</span></div>
      <div className="stat ok"><b>${sum('doneWeek')}</b><span>Done in the last 7 days</span></div>
    </div>
    <div style=${{ display: 'grid', gap: 8 }}>
      <div className="mhead"><span>Person</span><span>Open</span><span>Avg progress</span><span>Overdue</span><span>No update</span><span></span></div>
      ${rows.length === 0 && html`<div className="empty"><p>No one else is in this team yet.</p></div>`}
      ${rows.map((r) => { const isOpen = openRow === r.u.id; return html`<div className="mrow" key=${r.u.id}>
        <button className="mrow-h" onClick=${() => setOpenRow(isOpen ? null : r.u.id)} aria-expanded=${isOpen}>
          <span className="who"><${Avatar} u=${r.u} s=${32}/><span style=${{ minWidth: 0 }}><b style=${{ display: 'block' }}>${r.u.name}</b><span className="muted sm">${r.u.title}${r.waiting ? ' · ' + r.waiting + ' other item' + (r.waiting === 1 ? '' : 's') + ' waiting' : ''}</span></span></span>
          <span className="num"><span className="lab">Open </span>${r.open.length}</span>
          <span style=${{ display: 'flex', alignItems: 'center', gap: 8 }}><span className="lab">Avg </span>${r.avg == null ? html`<span className="muted sm">–</span>` : html`<span className="bar"><i style=${{ width: r.avg + '%' }}></i></span><span className="mono sm">${r.avg}%</span>`}</span>
          <span className=${'num' + (r.overdue.length ? ' st bad' : '')}><span className="lab">Overdue </span>${r.overdue.length}</span>
          <span className=${'num' + (r.stale.length ? ' st warn' : '')}><span className="lab">No update </span>${r.stale.length}</span>
          <span className="chev"><${Icon} n=${isOpen ? 'chevdown' : 'chev'} s=${16}/></span>
        </button>
        ${isOpen && html`<div className="mtasks">${r.open.length === 0 ? html`<p className="muted sm" style=${{ padding: '8px 0' }}>No open tasks. ${r.doneWeek.length} finished this week.</p>` : r.open.map((p) => { const rr = p.recips[r.u.id]; return html`<div className="mtask" key=${p.id}>
          <${LevelTag} l=${p.level}/><button className="t" onClick=${() => openPost(p.id)}>${p.title}</button>
          ${p.due && html`<${DueTag} p=${p} uid=${r.u.id}/>`}
          <span className="pl-bar"><span className="bar"><i style=${{ width: (rr.pct || 0) + '%' }}></i></span><span className="mono sm">${rr.pct || 0}%</span></span>
          <span className=${isStale(p, r.u.id) ? 'st warn' : 'muted sm'}>${rr.updatedAt ? 'Updated ' + ago(rr.updatedAt) : 'No update yet'}</span>
          ${rr.nudgedAt ? html`<span className="st muted">Nudged ${ago(rr.nudgedAt)}</span>` : html`<button className="btn sm" onClick=${() => nudge(p, r.u.id)}><${Icon} n="bell" s=${14}/>Nudge</button>`}
        </div>`; })}</div>`}
      </div>`; })}
    </div>
  <//>`;
}

    <div className="tabs" role="tablist">

/* ---------------- Sort my files: every document into the right folder ---------------- */
// Goes by what each document is: the text inside PDFs and text files, a picture of photographed or scanned paper (read

  ['Delivery notes', /delivery|\bgrv\b|goods\s*receiv|\bdn[\s_.#-]*\d/i],
  ['Orders', /purchase\s*orders?|\borders?\b|\bpo[\s_.#-]*\d/i],
  ['Statements', /statements?\b|\bstmt\b/i],
  ['Receipts', /receipts?\b|till\s*slip|proof\s*of\s*payment|\bpop\b/i],
  ['Payslips', /pay\s*slips?|salary|\birp5\b|\buif\b|payroll/i],
  ['Contracts', /contracts?\b|agreements?\b|\blease\b|terms\s*(and|&)\s*conditions/i],
  ['Certificates', /certificates?\b|\bcert\b|licen[cs]es?\b|permits?\b|compliance/i],
  ['Forms', /\bforms?\b|applications?\b|leave\s*request/i],
  ['Policies & SOPs', /polic(y|ies)|\bsops?\b|procedures?\b|manuals?\b|handbook|\bguides?\b/i],
  ['Price lists', /price\s*lists?|pricelist|\bprices\b|tariffs?\b/i],
  ['Reports', /reports?\b|stock\s*count|waste\s*sheet|summary|\blogs?\b|minutes/i],

const MEDIA_FOLDERS = { image: 'Photos', video: 'Videos', audio: 'Voice notes' };
const EXT_FOLDERS = [[/^(xlsx?|csv|ods)$/i, 'Spreadsheets'], [/^(pdf|docx?|odt|rtf|txt|pptx?)$/i, 'Documents']];

function SearchView() {
  const { db, user, searchQ, setSearchQ, compose, openChat } = useApp();
  const [scope, setScope] = useState('posts'); const [status, setStatus] = useState('all');
  const [fileOpen, setFileOpen] = useState(null);
  const raw = searchQ.trim().toLowerCase();
  const tokens = raw.split(/\s+/).filter(Boolean);
  const mentions = tokens.filter((t) => t.startsWith('@') && t.length > 1).map((t) => t.slice(1));
  const nums = tokens.filter((t) => /^#\d+$/.test(t)).map((t) => +t.slice(1));
  const words = tokens.filter((t) => !t.startsWith('@') && !/^#\d+$/.test(t));
  const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  const involves = (p, m) => [...Object.keys(p.recips), p.author].some((id) => norm((userById(db, id) || { name: '' }).name).includes(norm(m))) || [...p.toDepts, p.about].some((d) => norm(deptById(db, d).name).includes(norm(m)));
  const text = (p) => [p.title, p.body, ...p.activity.map((a) => a.text || ''), ...p.attachments.map((a) => a.name), (userById(db, p.author) || {}).name, deptById(db, p.about).name, TYPES[p.type].label, LEVELS[p.level].label].join(' ').toLowerCase();
  const posts = !raw ? [] : db.posts.filter((p) => canSee(db, p, user) && (!nums.length || nums.includes(p.no)) && mentions.every((m) => involves(p, m)) && words.every((w) => text(p).includes(w)))
    .filter((p) => status === 'all' || (status === 'open') === !(p.closed || Object.values(p.recips).every((r) => r.status === 'done'))).sort((a, b) => b.createdAt - a.createdAt);
  const okDrives = db.drives.filter((d) => driveOn(db, d) && canDrive(user, d)).map((d) => d.id);
  const chatIds = new Set(myChats(db, user.id).map((c) => c.id));
  const msgs = !raw || nums.length ? [] : db.messages.filter((m) => m.kind === 'msg' && m.text && chatIds.has(m.chat)
    && words.every((w) => m.text.toLowerCase().includes(w))
    && mentions.every((mm) => norm((userById(db, m.user) || { name: '' }).name).includes(norm(mm)) || (m.mentions || []).some((x) => norm(x.label).includes(norm(mm)))))
    .sort((a, b) => b.at - a.at).slice(0, 60);
  const files = !raw || nums.length ? [] : db.files.filter((f) => okDrives.includes(f.drive) && fileMatches(db, f, [...words, ...mentions].join(' ')));
  const people = !raw || nums.length ? [] : db.users.filter((u) => u.active !== false && [...words, ...mentions].every((w) => (u.name + ' ' + u.title + ' ' + u.depts.map((d) => deptById(db, d).name).join(' ')).toLowerCase().includes(w)));
  const examples = ['@bakery', '#1047', 'invoice highveld', '@fatima', 'cabinet 2', 'load-shedding'];
  return html`<${Page} title="Search" sub="Find any post, document or person without scrolling through chats. Use @ for a person or team and # for a post number.">
    <label className="bigsearch"><${Icon} n="search" s=${20}/><input id="big-search" autoFocus value=${searchQ} onChange=${(e) => setSearchQ(e.target.value)} placeholder="Try @bakery, #1046, invoice, Highveld…" aria-label="Search"/>${searchQ && html`<button className="icon-btn sm" onClick=${() => setSearchQ('')} aria-label="Clear search"><${Icon} n="close" s=${15}/></button>`}</label>
    ${!raw ? html`<div className="tips">Examples: ${examples.map((x) => html`<button key=${x} onClick=${() => setSearchQ(x)}>${x}</button>`)}</div>` : html`
      <div className="tabs" role="tablist">
        <button className=${scope === 'posts' ? 'on' : ''} onClick=${() => setScope('posts')}>Posts <b>${posts.length}</b></button>
        <button className=${scope === 'messages' ? 'on' : ''} onClick=${() => setScope('messages')}>Messages <b>${msgs.length}</b></button>
        <button className=${scope === 'files' ? 'on' : ''} onClick=${() => setScope('files')}>Documents <b>${files.length}</b></button>
        <button className=${scope === 'people' ? 'on' : ''} onClick=${() => setScope('people')}>People <b>${people.length}</b></button>
      </div>
      ${scope === 'posts' && html`<div className="filters"><div className="seg" role="group" aria-label="Status">${[['all', 'All'], ['open', 'Still open'], ['done', 'Finished']].map(([k, l]) => html`<button key=${k} className=${status === k ? 'on' : ''} onClick=${() => setStatus(k)}>${l}</button>`)}</div></div>
        ${posts.length ? html`<div className="cards">${posts.map((p) => html`<${PostCard} key=${p.id} p=${p}/>`)}</div>` : html`<div className="empty"><p>No posts match “${searchQ}”.</p></div>`}`}
      ${scope === 'messages' && (msgs.length ? html`<div className="cards">${msgs.map((m) => { const c = db.chats.find((x) => x.id === m.chat); return html`<button key=${m.id} className="msg-hit" onClick=${() => openChat(c.id)}><${ChatAvatar} c=${c} s=${40}/><span className="pm"><span className="mh-top"><b>${chatName(db, c, user.id)}</b><span className="muted sm">${ago(m.at)}</span></span><span className="sm"><b>${m.user === user.id ? 'You' : firstName(userById(db, m.user))}:</b> <${MsgText} text=${m.text} mentions=${m.mentions}/></span></span></button>`; })}</div>` : html`<div className="empty"><p>No chat messages match “${searchQ}”.</p></div>`)}
      ${scope === 'files' && (files.length ? html`<${FileTable} files=${files} onOpen=${setFileOpen} showPath/>` : html`<div className="empty"><p>No documents you can open match “${searchQ}”.</p></div>`)}
      ${scope === 'people' && (people.length ? html`<div className="people">${people.map((u) => html`<div className="person" key=${u.id}><${Avatar} u=${u} s=${36}/><div className="pm"><b>${u.name}</b><span className="muted sm">${u.title} · ${u.depts.map((d) => deptById(db, d).name).join(', ')}</span></div>${u.id !== user.id && html`<button className="btn sm" onClick=${() => compose({ to: [{ k: 'u', id: u.id }], about: u.depts[0] })}><${Icon} n="at" s=${14}/>Tag</button>`}</div>`)}</div>` : html`<div className="empty"><p>No one matches “${searchQ}”.</p></div>`)}
    `}
    ${fileOpen && html`<${DocModal} fileId=${fileOpen} onClose=${() => setFileOpen(null)}/>`}
  <//>`;
}

// Ask Floorboard's flagged questions: ones to the work assistant that clearly weren't about work (admins only; staff are

  }, []);

  return html`<div className="ask-flags">

function chatMembers(db, c) {
  if (c.dept) {
    const s = new Set(deptMembers(db, c.dept));
    db.users.forEach((u) => { if (u.role === 'admin' && u.active !== false) s.add(u.id); });
    return [...s];
  }
  return c.members.filter((id) => { const u = userById(db, id); return u && u.active !== false; });
}
const myChats = (db, me) => db.chats.filter((c) => chatMembers(db, c).includes(me));
function chatName(db, c, me) {
  if (c.kind !== 'dm') return c.name;
  const other = userById(db, c.members.find((id) => id !== me));
  return other ? other.name : 'Former staff';
}
function lastMsg(db, c) { let last = null; for (const m of db.messages) if (m.chat === c.id && (!last || m.at > last.at)) last = m; return last; }
function unreadIn(db, c, me) { const t = (c.read || {})[me] || 0; return db.messages.filter((m) => m.chat === c.id && m.at > t && m.user !== me && m.kind !== 'system').length; }
const mentioned = (db, m, me) => (m.mentions || []).some((x) => (x.k === 'u' ? x.id === me : deptMembers(db, x.id).includes(me)));
function mentionsIn(db, c, me) { const t = (c.read || {})[me] || 0; return db.messages.some((m) => m.chat === c.id && m.at > t && m.user !== me && mentioned(db, m, me)); }
function labelFor(db, u) { const first = u.name.split(' ')[0]; return db.users.filter((x) => x.active !== false && x.name.split(' ')[0] === first).length > 1 ? u.name : first; }
function shortTime(t) { const k = dkey(t); if (k === dkey()) return hm(t); if (k === keyPlus(-1)) return 'Yesterday'; if (Date.now() - t < 6 * DAY) return fmtDay(t, { weekday: 'short' }); return fmtDay(t, { day: 'numeric', month: 'short' }); }
function dayLabel(t) { const k = dkey(t); if (k === dkey()) return 'Today'; if (k === keyPlus(-1)) return 'Yesterday'; return fmtDay(t, { weekday: 'long', day: 'numeric', month: 'long' }); }
const NAME_COLORS = ['#FFB38A', '#9CC3FF', '#A6E3B0', '#F5A3C7', '#FFD27A', '#C3A6FF', '#7FE0D6', '#FF9C9C'];
const nameColor = (id) => NAME_COLORS[[...String(id)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % NAME_COLORS.length];
const isTouch = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };

function ChatAvatar({ c, s = 44 }) {
  const { db, user } = useApp();
  if (c.kind === 'dm') return html`<${Avatar} u=${userById(db, c.members.find((id) => id !== user.id))} s=${s}/>`;
  return html`<span className="chat-av" style=${{ width: s, height: s, fontSize: Math.round(s * 0.48), '--c': c.color || '#5E6B65' }}>${c.icon || '💬'}</span>`;
}
function MsgText({ text, mentions }) {
  if (!mentions || !mentions.length) return text;
  const labels = mentions.map((m) => '@' + m.label).sort((a, b) => b.length - a.length);
  const re = new RegExp('(' + labels.map((l) => l.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');
  return text.split(re).map((part, i) => (labels.includes(part) ? html`<b key=${i} className="mention">${part}</b>` : part));
}
function ChatItem({ r, on, onOpen }) {

/* ---------------- one-tap answers, alerts and the demo task ---------------- */
function quickAct(update, p, who, action) {
  if (action === 'gotpaid') { update((d) => { const q = d.posts.find((x) => x.id === p.id), r = q && q.recips[who]; if (r) { r.status = 'done'; r.seen = r.seen || Date.now(); r.updatedAt = Date.now(); r.nudgedAt = null; } }); return; }
  update((d) => {
    const q = d.posts.find((x) => x.id === p.id); const r = q && q.recips[who];
    if (!r) return;
    const now = Date.now();
    r.seen = r.seen || now; r.updatedAt = now; r.nudgedAt = null;
    if (action === 'seen') r.status = 'done';
    if (action === 'start') { r.status = 'doing'; r.pct = Math.max(r.pct || 0, 10); q.activity.push({ id: uid('e'), kind: 'update', user: who, at: now, pct: r.pct, text: 'On it.', attachments: [] }); }
    if (action === 'done') { r.status = 'done'; r.pct = 100; q.activity.push({ id: uid('e'), kind: 'update', user: who, at: now, pct: 100, text: 'Done.', attachments: [] }); }
  });
}
function QuickActions({ p }) {
  const { user, update, toast, openPost } = useApp();
  const r = p.recips[user.id];
  if (!r || !needsMe(p, user.id)) return null;
  const act = (a, msg) => { quickAct(update, p, user.id, a); toast(msg); };
  const btns = p.type === 'approval' ? (r.paid || r.rejected ? [['Got it', 'check', true, () => act('gotpaid', 'Thanks')]] : r.answer ? [['Answer', 'reply', false, () => openPost(p.id)]]
      : [['Review', 'look', false, () => openPost(p.id)]])
    : p.type === 'look' ? [['Got it', 'check', true, () => act('seen', 'Marked as seen')]]
    : p.type === 'task' ? [r.status === 'todo' && ['On it', 'clock', false, () => act('start', 'Marked as started')], ['Done', 'check', true, () => act('done', 'Marked done')]].filter(Boolean)
    : [[p.type === 'vote' ? 'Vote' : 'Reply', p.type === 'vote' ? 'vote' : 'reply', false, () => openPost(p.id)]];
  const sign = p.type === 'approval' && !r.paid && !r.rejected && !r.answer;
  return html`<div className="qa" onClick=${(e) => e.stopPropagation()} onKeyDown=${(e) => e.stopPropagation()}>${sign && html`<${ApproveButton} p=${p} cls="qa-b go" s=${14}/>`}${btns.map(([l, ic, go, fn]) => html`<button key=${l} className=${'qa-b' + (go ? ' go' : '')} onClick=${fn}><${Icon} n=${ic} s=${14}/>${l}</button>`)}</div>`;
}
// Everything that should pop up for this person: new tags on their board, reminders, @mentions and direct messages.
function alertItems(db, me) {
  const out = [];
  db.posts.forEach((p) => {
    const r = p.recips[me], own = p.author === me;
    // your own post only comes back to you with a question about it, or to say it's paid
    if ((own && !(r && (r.answer || r.paid || r.rejected))) || !needsMe(p, me)) return;
    const why = r && r.paid ? 'paid' : r && r.rejected ? 'reject' : 'query';
    const by = own ? ([...p.activity].reverse().find((e) => e.kind === why) || {}).user : null;
    out.push({ key: 'p:' + p.id + ':' + (r.nudgedAt || 0) + (own ? ':' + why : ''), level: p.level, from: by || p.author, postId: p.id, chatId: p.chat || null,
      title: own ? ({ paid: 'Paid · your ', reject: 'Not approved · your ', query: 'A query about your ' }[why]) + (p.approval ? p.approval.kind.toLowerCase() : 'request') + (by ? ' from ' + firstName(userById(db, by)) : '')

    if (!from || from === 'und') return null;
    if (from.split('-')[0] === to) return { same: true };
    if ((await Translator.availability({ sourceLanguage: from, targetLanguage: to })) !== 'available') return null;

    if (e && e.stopPropagation) e.stopPropagation();
    if (tr) { if (tr !== 'busy') setTr(null); return; }
    const to = look.lang || 'en';
    setTr('busy');

/* ---------------- sticky notes: the paper ones on the desk, kept neat ---------------- */
// Each person's own, kept with their pins (which only they can read): { id, text, color, remindAt, firedAt, done, doneAt, at }.
// A reminder pops up on time on any device with Floorboard open; done notes can be brought back for a week.
const STICKY_COLORS = { yellow: '#FFE38A', pink: '#FFBDD0', green: '#BDEBAA', blue: '#B4DAFF', lilac: '#DCC8FF' };
const stickiesOf = (db, id) => (db.pins[id] || {}).stickies || [];
function editStickies(d, who, fn) {
  d.pins[who] = d.pins[who] || { posts: [], notes: [] };
  const p = d.pins[who];
  p.stickies = p.stickies || [];

  const now = Date.now();
  p.stickies = p.stickies.filter((n) => !n.done || now - (n.doneAt || 0) < 7 * DAY);
}
function stickyAct(update, who, id, act) {
  update((d) => editStickies(d, who, (p) => {
    const x = p.stickies.find((y) => y.id === id), now = Date.now();
    if (!x) return;
    if (act === 'done' || act === 'back') { x.done = act === 'done'; x.doneAt = x.done ? now : null; }
    if (act === 'snooze') { x.remindAt = now + HOUR; x.firedAt = null; }
  }));
}
function remindLabel(t) {
  const k = dkey(t), day = k === dkey() ? '' : k === keyPlus(1) ? 'Tomorrow ' : fmtDay(t, { weekday: 'short', day: 'numeric', month: 'short' }) + ' ';
  return day + hm(t);
}
const atHour = (h, plusDays) => { const d = new Date(); d.setDate(d.getDate() + (plusDays || 0)); d.setHours(h, 0, 0, 0); return d.getTime(); };
const toLocalInput = (t) => { const d = new Date(t); return dkey(t) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function StickyModal({ id, onClose }) {
  const { db, user, update, toast } = useApp();
  const n = stickiesOf(db, user.id).find((x) => x.id === id);
  const [text, setText] = useState(n ? n.text : '');
  const [color, setColor] = useState(n ? n.color : 'yellow');
  const [when, setWhen] = useState(n ? n.remindAt || null : null);
  const [pick, setPick] = useState(n && n.remindAt ? 'set' : 'none');
  const [err, setErr] = useState('');
  const later = new Date().getHours() < 15;
  const presets = [['none', 'No reminder', null], ['hour', 'In 1 hour', () => Math.ceil((Date.now() + HOUR) / (5 * MIN)) * 5 * MIN],
    later && ['today', 'Today 16:00', () => atHour(16)], ['tomorrow', 'Tomorrow 08:00', () => atHour(8, 1)], ['custom', 'Pick a time', null]].filter(Boolean);
  const choose = ([k, , f]) => { setPick(k); setErr(''); if (k === 'none') setWhen(null); else if (f) setWhen(f()); else if (k === 'custom' && !when) setWhen(atHour(9, 1)); };
  const save = () => {
    const t = text.trim();
    if (!t) return setErr('Write something on it first.');
    if (when && when < Date.now() - MIN && (!n || when !== n.remindAt)) return setErr('That time has already passed. Pick a later one.');
    update((d) => editStickies(d, user.id, (p) => {
      const x = n && p.stickies.find((y) => y.id === n.id);
      if (x) { x.text = t; x.color = color; if (x.remindAt !== when) { x.remindAt = when; x.firedAt = null; } }
      else p.stickies.unshift({ id: uid('s'), text: t, color, remindAt: when, firedAt: null, done: false, doneAt: null, at: Date.now() });
    }));
    onClose();
    toast(when && (!n || when !== n.remindAt) ? 'Stuck on. It’ll remind you ' + (dkey(when) === dkey() ? 'at ' : '') + remindLabel(when) + '.' : n ? 'Saved' : 'Stuck on your desk');
  };
  const remove = () => { update((d) => editStickies(d, user.id, (p) => { p.stickies = p.stickies.filter((y) => y.id !== n.id); })); onClose(); toast('Thrown away'); };
  return html`<${Modal} title=${n ? 'Sticky note' : 'New sticky note'} onClose=${onClose} footer=${html`${n && html`<button className="btn ghost" style=${{ marginRight: 'auto' }} onClick=${remove}><${Icon} n="trash" s=${15}/>Throw away</button>`}<button className="btn" onClick=${onClose}>Cancel</button><button className="btn primary" onClick=${save}>${n ? 'Save' : 'Stick it on'}</button>`}>
    <textarea id="stk-text" className="stk-edit" rows="4" maxLength="160" autoFocus value=${text} style=${{ '--n': STICKY_COLORS[color] }} onChange=${(e) => { setText(e.target.value); setErr(''); }}
      onKeyDown=${(e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); } }} placeholder="e.g. Call SunPack about the short delivery" aria-label="What the note says"></textarea>
    <div className="field"><span>Colour</span><div className="swatches">${Object.entries(STICKY_COLORS).map(([k, c]) => html`<button type="button" key=${k} className=${color === k ? 'on' : ''} style=${{ '--c': c }} onClick=${() => setColor(k)} aria-label=${k} aria-pressed=${color === k}></button>`)}</div></div>
    <div className="field"><span>Remind me</span>
      <div className="seg" role="group">${presets.map((p) => html`<button type="button" key=${p[0]} className=${pick === p[0] ? 'on' : ''} onClick=${() => choose(p)} aria-pressed=${pick === p[0]}>${p[1]}</button>`)}</div>
      ${pick === 'custom' && html`<input id="stk-when" type="datetime-local" className="input" value=${when ? toLocalInput(when) : ''} min=${toLocalInput(Date.now())} onChange=${(e) => { setWhen(e.target.value ? new Date(e.target.value).getTime() : null); setErr(''); }}/>`}
      ${when && html`<small><${Icon} n="bell" s=${12}/> ${n && n.firedAt && when === n.remindAt ? 'Reminded you at ' : 'Pops up '}${dkey(when) === dkey() ? 'today at ' : ''}${remindLabel(when)}, on any device with Floorboard open.</small>`}
    </div>

  <//>`;

// Folded away to one small bar until it's opened (this device remembers which); + still adds a note straight away.

/* ---------------- signing an approval ---------------- */
// Approving always takes a signature. It's saved on the approval's record with the name and time; a person can
// keep theirs (privately, with their pins) so next time it's one tap on it.
function exportSig(cv) {
  const g = cv.getContext('2d'), w = cv.width, h = cv.height, px = g.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 - x0 < 30 && y1 - y0 < 30) return null; // a dot or a tiny tick isn't a signature
  const pad = 8, sw = x1 - x0 + 1 + pad * 2, sh = y1 - y0 + 1 + pad * 2, k = Math.min(1, 110 / sh, 380 / sw);
  const out = document.createElement('canvas');
  out.width = Math.max(1, Math.round(sw * k)); out.height = Math.max(1, Math.round(sh * k));
  out.getContext('2d').drawImage(cv, x0 - pad, y0 - pad, sw, sh, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}
function SignPad({ onChange }) {

    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    const g = cv.getContext('2d');
    g.scale(dpr, dpr); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = '#17233f'; g.lineWidth = 2.6;
  }, []);
  const at = (e) => { const r = ref.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const down = (e) => {
    e.preventDefault();
    try { ref.current.setPointerCapture(e.pointerId); } catch (x) { /* drawing still works */ }
    const p = at(e), g = ref.current.getContext('2d');
    st.current = { down: true, last: p };

    <span className="sig-line">Sign here</span>

}

function guessFromFile(name) {
  const base = name.replace(/\.[a-z0-9]{2,5}$/i, '').replace(/_/g, ' ');
  const m = base.match(/\b([A-Z]{0,4}-?\d{3,}[A-Z0-9-]*)\b/i);

/* ---------------- a quick look at a PDF: the facts read straight from its text ---------------- */
// No AI, and nothing leaves the computer: pdf.js gives the text, and simple rules pick out who it's from, the number,

const MONEY = /(?:R\s?)?-?\d{1,3}(?:[  ,.]\d{3})*[.,]\d{2}\b|R\s?\d+\b/g;

      let row = rows.find((r) => Math.abs(r.y - y) <= 3);
      if (!row) { row = { y, parts: [], h: 0 }; rows.push(row); }
      row.parts.push({ x: it.transform[4], s: it.str }); row.h = Math.max(row.h, h);

  }

}
function summarizeText(pages) {

  const amountIn = (t) => { const m = t.match(MONEY); return m ? toAmount(m[m.length - 1]) : null; };
  const firstMatch = (re) => { for (const l of lines) { const m = l.text.match(re); if (m) return m; } return null; };

    || [...lines].reverse().find((l) => /\btotal\b/i.test(l.text) && !/sub ?-?total/i.test(l.text) && amountIn(l.text) != null);
  const vatLine = lines.find((l) => /\b(vat|tax)\b/i.test(l.text) && !/\b(tax invoice|vat (no|reg|number))\b/i.test(l.text) && amountIn(l.text) != null);

  const num = firstMatch(/\b(?:quote|quotation|invoice|inv|estimate|ref(?:erence)?)\s*(?:no\.?|number|#)?\s*[:#-]?\s*([A-Z]{0,4}[-/]?\d[\w/-]{2,})/i);
  const date = firstMatch(/\b(\d{1,2}[/.\- ](?:\d{1,2}|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[/.\- ]\d{2,4}|\d{4}-\d{2}-\d{2})\b/i);

  const items = lines.filter((l) => !stop.test(l.text) && /[a-z]{3}/i.test(l.text) && amountIn(l.text) != null).slice(0, 6).map((l) => {
    const m = l.text.match(MONEY), last = m[m.length - 1];

  }).filter((x) => x.text.length > 2);

}

/* ---------------- month end: Finance's deadline sheet, with reminders ---------------- */
// One item per line of the sheet: { id, list, title, owners, due, repeat: '' | 'daily' | 'weekly', day, when, remind, star, dept, createdBy, createdAt }.
// Ticks live in done as 'date|person', or 'date|*' when a manager closes the whole item; items with no fixed day use the date 'any'.
// A reminder is an ordinary task sent remind days before, so it shows in Needs you and reaches phones. Ticking either one ticks both.
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
const REMIND_OPTS = [[-1, 'No reminder'], [0, 'On the day'], [1, 'The day before'], [2, '2 days before'], [3, '3 days before'], [7, 'A week before']];
const REMIND_HOUR = 7; // the live store sends the day's reminders from 07:00
const meDepts = (db) => db.depts.filter((d) => featureOn(d, 'monthend'));
const canEditME = (db, u) => meDepts(db).length > 0 && (u.role === 'admin' || meDepts(db).some((d) => u.manages.includes(d.id)));
function canSeeME(db, u) {
  const ds = meDepts(db);
  return ds.length > 0 && (u.role === 'admin' || ds.some((d) => u.depts.includes(d.id) || u.manages.includes(d.id)) || (db.deadlines || []).some((x) => x.owners.includes(u.id)));
}
const addDays = (k, n) => dkey(keyToDate(k).getTime() + n * DAY + 12 * HOUR);
const dowOf = (k) => keyToDate(k).getDay();
// the day that counts now: its date; today for weekday jobs (Monday at the weekend); this week's day for weekly ones
function occKey(dl, today = dkey()) {
  if (dl.repeat === 'daily') { let k = today; while (dowOf(k) === 0 || dowOf(k) === 6) k = addDays(k, 1); return k; }
  if (dl.repeat === 'weekly') return addDays(today, (dl.day - dowOf(today) + 7) % 7);
  return dl.due || 'any';
}
const reminderId = (dl, k) => 'p-dl-' + dl.id + '-' + k;
const reminderMap = (db) => { const m = new Map(); db.posts.forEach((p) => { if (p.deadline) m.set(p.id, p); }); return m; };
// someone's part is done on their reminder task when they have one, otherwise by the tick on the page
function personDone(dl, k, who, p) {
  const r = p && p.recips[who];
  if (r) return r.status === 'done' ? { by: who, at: r.updatedAt } : null;
  return (dl.done || {})[k + '|' + who] || null;
}
function meState(dl, k, p) {
  const all = (dl.done || {})[k + '|*'] || null;
  const parts = dl.owners.map((id) => ({ id, d: all || personDone(dl, k, id, p) }));
  const n = parts.filter((x) => x.d).length;
  return { parts, n, all, done: !!all || (parts.length > 0 && n === parts.length) };
}
function meTick(d, id, k, who, on, by) {
  const dl = (d.deadlines || []).find((x) => x.id === id);
  if (!dl) return;
  dl.done = dl.done || {};
  const now = Date.now(), p = d.posts.find((x) => x.id === reminderId(dl, k)), r = who !== '*' && p && p.recips[who];
  if (r) {
    r.status = on ? 'done' : 'todo'; r.pct = on ? 100 : 0; r.updatedAt = now; r.seen = r.seen || now;
    p.activity.push({ id: uid('e'), kind: 'update', user: by, at: now, pct: r.pct, text: on ? 'Ticked off on the Month end page' : 'Unticked on the Month end page' });
    return;
  }
  if (on) dl.done[k + '|' + who] = { by, at: now }; else delete dl.done[k + '|' + who];
  if (who === '*' && p) { p.closed = on; p.activity.push({ id: uid('e'), kind: 'system', user: by, at: now, text: on ? 'marked it done on the Month end page' : 'opened it again on the Month end page' }); }
}
function meBody(dl) {
  const often = dl.repeat === 'daily' ? 'Every weekday. ' : dl.repeat === 'weekly' ? 'Every ' + WEEKDAYS[dl.day] + '. ' : '';
  return 'Month end · ' + dl.list + '. ' + often + (dl.when ? dl.when + '. ' : '') + 'Mark it done here when it’s finished and it ticks off on the Month end page too.';
}
// Any open app sends the day's reminders and tells the manager about misses. Fixed ids, so two devices doing it at once leave one.
function meReminders(d, now, dry) {
  if (!(d.deadlines || []).length || (CLOUD && new Date(now).getHours() < REMIND_HOUR)) return 0;
  const today = dkey(now), pm = reminderMap(d);
  let n = 0;
  d.deadlines.forEach((dl) => {
    const owners = dl.owners.filter((id) => { const u = userById(d, id); return u && u.active !== false; });
    const k = occKey(dl, today);
    if (!owners.length || k === 'any') return;
    const p = pm.get(reminderId(dl, k)), st = meState(dl, k, p);
    if (!p) {
      if (dl.remind == null || dl.remind < 0 || k < today || addDays(k, -dl.remind) > today || st.done) return;
      n++; if (dry) return;
      const author = userById(d, dl.createdBy) ? dl.createdBy : owners[0], recips = {};
      owners.forEach((id) => { const t = (dl.done || {})[k + '|' + id]; recips[id] = t ? { status: 'done', pct: 100, seen: t.at, updatedAt: t.at } : { status: 'todo', pct: 0, seen: null, updatedAt: null }; });
      d.counter += 1;
      d.posts.unshift({ id: reminderId(dl, k), chat: null, no: d.counter, type: 'task', title: dl.title, body: meBody(dl), author, createdAt: now, toUsers: owners, toDepts: [],
        about: dl.dept || userById(d, author).depts[0], level: dl.repeat ? 'green' : 'amber', due: k, attachments: [], recips, activity: [], poll: null, closed: false, deadline: { id: dl.id, date: k } });
    } else if (k < today && !p.lateAt && !p.closed && !st.done) {
      n++; if (dry) return;

      p.lateAt = now;
      if (tell && !p.recips[boss.id]) p.recips[boss.id] = { status: 'todo', pct: 0, seen: null, updatedAt: null, late: now };
      p.activity.push({ id: 'e-late-' + p.id, kind: 'system', esc: true, user: p.author, at: now, text: 'it missed its month-end date' + (tell ? ', so ' + firstName(boss) + ' was told' : '') });
    } else if (p.lateAt && st.done && Object.values(p.recips).some((r) => r.late && r.status !== 'done')) {
      n++; if (dry) return;
      Object.values(p.recips).forEach((r) => { if (r.late) { r.status = 'done'; r.pct = 100; r.updatedAt = now; } });
    }
  });

}

/* pasting the sheet from Excel: dates in the first column, the job in the next, a name on its own line starts a new list */
function parseSheetDate(s) {
  const mk = (y, m, d) => { if (y < 100) y += 2000; const t = new Date(y, m, d); return t.getFullYear() === y && t.getMonth() === m && t.getDate() === d ? dkey(t.getTime()) : null; };
  const mon = (w) => MONTHS.findIndex((x) => x.slice(0, 3) === w.slice(0, 3).toLowerCase());
  let m = s.match(/\b(\d{1,2})(?:st|nd|rd|th)?[\s\-./]+([A-Za-z]{3,9})\.?,?[\s\-./]+(\d{4}|\d{2})\b/);
  if (m && mon(m[2]) >= 0) return mk(+m[3], mon(m[2]), +m[1]);
  m = s.match(/\b([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/);
  if (m && mon(m[1]) >= 0) return mk(+m[3], mon(m[1]), +m[2]);
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return mk(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[/.\-](\d{1,2})[/.\-](\d{4}|\d{2})$/); // day first, the way South Africa writes it
  if (m) return mk(+m[3], +m[2] - 1, +m[1]);
  return null;
}
const isWhenWord = (c) => /^(every|daily|on avail|tbc|tba|start\b|as needed|when\b|ongoing|weekly)/i.test(c) || WEEKDAYS.some((w) => c.toLowerCase().startsWith(w.toLowerCase()));
const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function guessOwners(db, name) {
  const parts = name.split(/\s*(?:&|,|\+|\/|\band\b)\s*/i).map((x) => x.trim().toLowerCase()).filter(Boolean);
  const act = db.users.filter((u) => u.active !== false);
  return [...new Set(parts.flatMap((p) => act.filter((u) => u.name.toLowerCase() === p || u.name.split(' ')[0].toLowerCase() === p).map((u) => u.id)))];
}
// on a shared list, a job that names one of the people (“… - Lerato”) goes to just that person
function ownersFor(db, owners, title) {
  if (owners.length < 2) return owners;
  const named = owners.filter((id) => { const u = userById(db, id); return u && new RegExp('\\b' + reEsc(u.name.split(' ')[0]) + '\\b', 'i').test(title); });
  return named.length ? named : owners;
}
function parseSheet(text, db) {
  const lists = [];
  let cur = null;
  const start = (name) => { cur = { name, owners: guessOwners(db, name), items: [] }; lists.push(cur); };
  text.replace(/\r/g, '').split('\n').forEach((line) => {
    const cells = line.split('\t').map((c) => c.replace(/\s+/g, ' ').trim()).filter(Boolean);
    if (!cells.length) return;
    if (cells.length === 1) {
      const c = cells[0];
      if (/^week\s*\d+\s*:?$/i.test(c) || parseSheetDate(c) || isWhenWord(c)) return; // a week heading, or a day with nothing on it
      if (/deadlines?\s*$/i.test(c) && !lists.length) return; // the sheet's own title
      if (c.length <= 40 && !/[.!?]$/.test(c)) { start(c); return; } // a heading: the next person or team
    }
    const first = cells.length > 1 ? cells[0] : '', title = (cells.length > 1 ? cells.slice(1) : cells).join(' · ');
    if (!cur) start('Month end');
    const it = { title, due: null, repeat: '', day: 0, when: '' };
    const dt = first && parseSheetDate(first);
    if (dt) it.due = dt;
    else if (/every\s*day|daily/i.test(first)) it.repeat = 'daily';
    else {
      const days = WEEKDAYS.map((w, i) => [i, first.toLowerCase().lastIndexOf(w.toLowerCase())]).filter(([, at]) => at >= 0).sort((a, b) => b[1] - a[1]);
      if (days.length) { it.repeat = 'weekly'; it.day = days[0][0]; if (!/^every\s/i.test(first)) it.when = first; } else it.when = first;
    }
    cur.items.push(it);
  });

}
function sheetWhen(it) {
  if (it.due) return fmtKey(it.due);
  if (it.repeat === 'daily') return 'Every weekday';
  if (it.repeat === 'weekly') return 'Every ' + WEEKDAYS[it.day];
  return it.when || 'Any time';
}

  const out = [], lines = String(text || '').split('\n');
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].trim(); if (!l) continue;
    if (/^[-*•]\s+/.test(l)) { const items = []; while (i < lines.length && /^[-*•]\s+/.test(lines[i].trim())) { items.push(lines[i].trim().replace(/^[-*•]\s+/, '')); i++; } i--; out.push(html`<ul key=${i}>${items.map((x, j) => html`<li key=${j}>${bold(x)}</li>`)}</ul>`); }
    else out.push(html`<p key=${i}>${bold(l.replace(/^#+\s*/, ''))}</p>`);
  }
  return out;
}

      const { db: db0, user: u0 } = ASK.ctx, convo = await newConvo(db0, u0);

/* ---------------- Task board: each department's tasks for the week, set by its head ---------------- */
// The head of a department (whoever manages it, and admins) sets the week's tasks, for the whole team or for one person.
// Everyone moves their own progress along on theirs; the head sees how far each person is. On for every department
// unless an admin switches it off in People & access. Kept per week (that Monday's date), each person's progress as its
// own record, so two people moving theirs at once never clash.
const tboardOff = (d) => !!(d && d.features && d.features.taskboard === false);
const weekOf = (k = dkey()) => addDays(k, -((dowOf(k) + 6) % 7)); // that week's Monday
const tbDepts = (db, u) => db.depts.filter((d) => !tboardOff(d) && (u.role === 'admin' || u.depts.includes(d.id) || u.manages.includes(d.id)));
const tbHead = (u, deptId) => u.role === 'admin' || u.manages.includes(deptId);
// the team a head sets tasks for: everyone in the department who doesn't run it
const tbTeam = (db, deptId) => db.users.filter((x) => x.active !== false && x.depts.includes(deptId) && !x.manages.includes(deptId));
const tbWho = (db, t) => (t.for === 'team' ? tbTeam(db, t.dept).map((x) => x.id) : [t.for]);
const tbPct = (t, id) => ((t.progress || {})[id] || {}).pct || 0;
const tbWeek = (db, deptId, wk) => (db.wtasks || []).filter((t) => t.dept === deptId && t.week === wk).sort((a, b) => (a.at || 0) - (b.at || 0));
// one person's week in a department: their tasks, how far along overall, how many done, when they last moved one
function tbPerson(db, deptId, wk, id) {
  const ts = tbWeek(db, deptId, wk).filter((t) => tbWho(db, t).includes(id));
  return { ts, pct: ts.length ? Math.round(ts.reduce((a, t) => a + tbPct(t, id), 0) / ts.length) : 0,
    done: ts.filter((t) => tbPct(t, id) >= 100).length, last: Math.max(0, ...ts.map((t) => ((t.progress || {})[id] || {}).at || 0)) };
}
// how far a whole department (or several) is this week: the average of each person with tasks, or null with none
function tbTeamPct(db, depts, wk = weekOf()) {
  const ps = [];
  depts.forEach((d) => tbTeam(db, d.id).forEach((m) => { const s = tbPerson(db, d.id, wk, m.id); if (s.ts.length) ps.push(s.pct); }));
  return ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length) : null;
}

// Phone photos are often 4000px wide: keep wallpapers small enough to load fast everywhere.
async function shrinkImage(file, max, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob((b) => res(b || file), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}

        let ch = d.chats.find((c) => c.kind === 'dm' && c.members.includes(from.id) && c.members.includes(user.id));
        if (!ch) { ch = { id: uid('c'), kind: 'dm', name: '', icon: '', color: '', dept: null, members: [from.id, user.id], createdBy: from.id, createdAt: now, read: {} }; d.chats.push(ch); }
        d.counter += 1;
        const pid = uid('p');
        d.posts.unshift({ id: pid, chat: ch.id, no: d.counter, type: t.type, title: t.title, body: '', author: from.id, createdAt: now, toUsers: [user.id], toDepts: [], about: user.depts[0],
          level: t.level, due: t.type === 'task' ? dkey() : null, attachments: [], recips: { [user.id]: { status: 'todo', pct: 0, seen: null, updatedAt: null } }, activity: [], poll: null, closed: false });
        d.messages.push({ id: uid('m'), chat: ch.id, user: from.id, at: now, text: '', attachments: [], mentions: [], replyTo: null, postId: pid, kind: 'msg' });
      }), 3000);
    },
    openPost: (id) => { setOpenId(id); setDrawer(false); }, closePost: () => setOpenId(null),
    compose: (preset) => setComposer(preset || {}), closeComposer: () => setComposer(null),
    recordAsk, clearRecordAsk: () => setRecordAsk(null),
    login: (id) => { lsSet(SESSION_KEY, id); setMe(id); lsSet(SEEAS_KEY, ''); setSeeAs(''); setView(recordAsk ? 'calendar' : 'chats'); setOpenChatId(null); setOpenId(null); setFilters(NO_FILTERS); },
    logout: (sure) => {
      // changes still waiting for a signal would be lost: say so first
      if (CLOUD && sure !== true && (Sync.pending() || Uploads.list().length)) {
        setConfirmState({ title: 'Some changes haven’t been sent yet', body: 'You made changes with no signal and they haven’t reached the store yet. If you log out now they are lost. Connect to the internet first and wait for ● Live.', confirm: 'Log out anyway', danger: true, onConfirm: () => ctx.logout(true) });
        return;
      }
      setOpenId(null); setDrawer(false); setComposer(null); setOpenChatId(null); lsSet(SEEAS_KEY, ''); setSeeAs('');
      MS.signOut().catch(() => {}); // the next person on this device doesn't get this mailbox
      try { const dk = window.floorboardDesktop; if (dk && dk.jarvis) dk.jarvis.who({}); } catch (e) { /* not the Windows app */ } // nor JARVIS
      if (!CLOUD) { lsSet(SESSION_KEY, ''); setMe(null); return; }
      // shared devices: don't leave the store's data or anyone's files behind
      lsSet(CACHE_KEY, ''); lsSet('floorboard.cloud.me', ''); lsSet(PENDING_KEY, ''); lsSet(UPLOADS_KEY, ''); Blobs.clear();
      Sync.stop(); Presence.stop(); setDb(emptyDb()); setMe(null); setCloud('signedout');
      // this person's alerts stop on this device before signing out (the next person to log in here gets theirs)
      (lsGet(PUSH_KEY) ? pushOff(true) : Promise.resolve()).finally(() => CLOUD.auth.signOut());
    },
    cloud, syncStatus, cloudSignedIn: (session) => { setView(recordAsk ? 'calendar' : 'chats'); setOpenChatId(null); startCloud(session); },
    resetDemo: async () => { await Blobs.clear(); setDb(seed()); setOpenId(null); setOpenChatId(null); setView('chats'); setFilters(NO_FILTERS); toast('Demo store reset'); },
  };
  // the bar at the top of the screen: just the pill, on a see-through window
  // the folded sidebar's own window (Windows app): just the rail
  if (mode === 'rail') return html`<${Ctx.Provider} value=${ctx}>${user && html`<div className="rail-win" data-scene=${look.scene}><${SlimRail} onOpen=${(sec) => { const d = window.floorboardDesktop; if (d && d.openSidebarAt) d.openSidebarAt(sec || ''); }}/></div>`}<//>`;
  if (mode === 'bar') return html`<${Ctx.Provider} value=${ctx}>${user && (!CLOUD || cloud === 'ready' || cloud === 'offline') ? html`<${Island}/>`
    : html`<div className="fbar"><button className="fbar-pill" onClick=${() => { const d = window.floorboardDesktop; if (d && d.showSidebar) d.showSidebar(); }}>${BAR_MARK}<span className="fbar-peek">${cloud === 'checking' || cloud === 'loading' ? 'Connecting…' : 'Log in to Floorboard'}</span></button></div>`}<//>`;
  return html`<${Ctx.Provider} value=${ctx}>
    <${Scene} look=${look}/>
    ${cloud === 'checking' || cloud === 'loading' ? html`<${CloudLoading} text=${cloud === 'loading' ? 'Loading your store…' : 'Connecting…'}/>`
      : !user ? (CLOUD ? html`<${CloudLogin}/>` : html`<${Login}/>`) : mode === 'widget' ? html`<${Widget}/>` : html`<${Shell}/>`}
    <${AlertStack}/>
    ${user && html`<${SeeingBar}/>`}
    ${lookOpen && html`<${LookModal} onClose=${() => setLookOpen(false)}/>`}
    ${phoneOpen && html`<${PhoneModal} onClose=${() => setPhoneOpen(false)}/>`}
    ${user && shiftOpen && html`<${ShiftModal} onClose=${() => setShiftOpen(false)}/>`}
    ${user && summary && !shiftOpen && html`<${ShiftSummary} onClose=${() => setSummary(false)}/>`}
    <${Toasts}/>
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
