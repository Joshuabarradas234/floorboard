<title>Floorboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: frosted-glass desk. A blurred back-office scene sits behind everything; a floating top bar, a left rail of departments, one big glass stage (board + feed) and a floating dock of views. #widget turns it into a narrow sidebar for the desktop or a phone. One committed look: light glass on a warm, dim scene, so it does not switch with light/dark mode. */
:root{
  --scene-base:#2b2018;
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.16); --glass-3:rgba(255,255,255,.24);
  --glass-line:rgba(255,255,255,.18); --glass-line-2:rgba(255,255,255,.32);
  --glass-deep:rgba(34,25,19,.58);
  --ink:#FFFFFF; --ink-2:rgba(255,255,255,.78); --ink-3:rgba(255,255,255,.58);
  --accent:#FFFFFF; --accent-ink:#22180F; --sky:#A9CBFF; --sky-soft:rgba(140,185,255,.22);
  --red:#FF8B79; --red-dot:#FF6B57; --red-soft:rgba(255,94,72,.26);
  --amber:#FFCF85; --amber-dot:#FFB547; --amber-soft:rgba(255,176,56,.22);
  --green:#93EBB6; --green-dot:#4FD688; --green-soft:rgba(70,210,130,.2);
  --shadow:0 20px 60px rgba(12,7,3,.38);
  --hi:inset 0 1px 0 rgba(255,255,255,.22);
  --scrim:rgba(14,9,6,.42);
  --blur:blur(28px) saturate(160%);
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-sm:10px; --r:16px; --r-lg:26px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--scene-base)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--scene-base);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
#root{height:100%;position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
option,optgroup{background:#2f241c;color:#fff}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
::placeholder{color:rgba(255,255,255,.48)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
.ic{flex:none;display:block}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:28px;font-stretch:115%;font-weight:750;letter-spacing:-.01em}
h2{font-size:19px;font-stretch:108%;font-weight:700}
h3{font-size:15px;font-stretch:105%;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sm{font-size:13px}
.grow{flex:1}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}

/* the wallpaper behind the glass: a preset painted with gradients, or the person's own photo */
[data-scene="warm"],[data-scene="see"]{--scene-bg:
    radial-gradient(28% 38% at 14% 30%, #e2c6a0 0%, rgba(226,198,160,0) 70%),
    radial-gradient(26% 34% at 86% 22%, #ead6b8 0%, rgba(234,214,184,0) 70%),
    radial-gradient(30% 22% at 50% 34%, #231d19 0%, rgba(35,29,25,0) 72%),
    radial-gradient(18% 26% at 70% 64%, #6f7c3c 0%, rgba(111,124,60,0) 70%),
    radial-gradient(16% 20% at 26% 72%, #59692f 0%, rgba(89,105,47,0) 70%),
    radial-gradient(70% 34% at 50% 104%, #8d623f 0%, rgba(141,98,63,0) 75%),
    radial-gradient(40% 30% at 50% 58%, #a07a55 0%, rgba(160,122,85,0) 70%),
    linear-gradient(180deg,#b29474 0%,#7d5d42 55%,#3c2b1f 100%)}
[data-scene="night"]{--scene-bg:
    radial-gradient(30% 36% at 18% 26%, #3d4a8f 0%, rgba(61,74,143,0) 70%),
    radial-gradient(28% 34% at 84% 30%, #7a3f7e 0%, rgba(122,63,126,0) 70%),
    radial-gradient(40% 30% at 52% 70%, #1f6f78 0%, rgba(31,111,120,0) 70%),
    linear-gradient(180deg,#1b2140 0%,#141a2e 60%,#0b0e1a 100%)}
[data-scene="fresh"]{--scene-bg:
    radial-gradient(30% 36% at 20% 28%, #9fcf7a 0%, rgba(159,207,122,0) 70%),
    radial-gradient(26% 30% at 82% 24%, #f2d36b 0%, rgba(242,211,107,0) 70%),
    radial-gradient(34% 30% at 60% 72%, #e0794a 0%, rgba(224,121,74,0) 70%),
    radial-gradient(30% 28% at 30% 80%, #3e8a4f 0%, rgba(62,138,79,0) 70%),
    linear-gradient(180deg,#5d8a4e 0%,#3b6236 60%,#1f3520 100%)}
[data-scene="ocean"]{--scene-bg:
    radial-gradient(32% 40% at 20% 25%, #5fd0e0 0%, rgba(95,208,224,0) 70%),
    radial-gradient(30% 36% at 80% 30%, #2f6fd0 0%, rgba(47,111,208,0) 70%),
    radial-gradient(40% 30% at 55% 80%, #13a89e 0%, rgba(19,168,158,0) 70%),
    linear-gradient(180deg,#1d5f8a 0%,#123d63 60%,#0a2238 100%)}
[data-scene="sunset"]{--scene-bg:
    radial-gradient(34% 40% at 25% 30%, #ffb35c 0%, rgba(255,179,92,0) 70%),
    radial-gradient(30% 34% at 78% 26%, #ff6f91 0%, rgba(255,111,145,0) 70%),
    radial-gradient(40% 34% at 55% 78%, #7b4bc4 0%, rgba(123,75,196,0) 72%),
    linear-gradient(180deg,#e2724f 0%,#9c3f6e 55%,#3b1f4f 100%)}
[data-scene="blossom"]{--scene-bg:
    radial-gradient(32% 40% at 22% 28%, #ffc8dd 0%, rgba(255,200,221,0) 70%),
    radial-gradient(30% 34% at 78% 32%, #f78fb3 0%, rgba(247,143,179,0) 70%),
    radial-gradient(36% 30% at 50% 80%, #c86b98 0%, rgba(200,107,152,0) 70%),
    linear-gradient(180deg,#d98fae 0%,#a85682 60%,#5a2a4a 100%)}
[data-scene="graphite"]{--scene-bg:
    radial-gradient(30% 36% at 25% 30%, #8a939c 0%, rgba(138,147,156,0) 70%),
    radial-gradient(30% 34% at 78% 60%, #4b535b 0%, rgba(75,83,91,0) 70%),
    linear-gradient(180deg,#5c636b 0%,#3a4047 60%,#1c2024 100%)}
[data-scene="aurora"]{--scene-bg:
    radial-gradient(34% 30% at 25% 30%, #3fe0a0 0%, rgba(63,224,160,0) 70%),
    radial-gradient(30% 34% at 70% 22%, #7b5cff 0%, rgba(123,92,255,0) 70%),
    radial-gradient(40% 30% at 55% 75%, #1aa3c8 0%, rgba(26,163,200,0) 70%),
    linear-gradient(180deg,#14213d 0%,#0e1a2e 60%,#060b16 100%)}
.scene{position:fixed;inset:-80px;z-index:0;pointer-events:none;filter:blur(34px) saturate(115%);background:var(--scene-bg)}
.scene.photo{background:center/cover no-repeat;inset:-40px}
.scene::after{content:"";position:absolute;inset:0;background:rgba(14,10,7,var(--dim,.3))}
.native-glass,.native-glass body{background:transparent}
/* the Windows sidebar shows the chosen wallpaper; "See-through" lets the Windows glass and the desktop show instead */
.native-glass .scene[data-scene="see"]:not(.photo){display:none}
.native-glass:has(.scene[data-scene="see"]:not(.photo)) .widget{background:rgba(30,22,17,.30)}

.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--hi),var(--shadow)}
/* glassier: a light sheen across each pane, a bright top edge like light catching real glass, and a faint inner glow */
.glass{background-image:linear-gradient(135deg,rgba(255,255,255,.17) 0%,rgba(255,255,255,.04) 38%,rgba(255,255,255,0) 62%,rgba(255,255,255,.06) 100%);
  border-color:rgba(255,255,255,.2);border-top-color:rgba(255,255,255,.42);border-left-color:rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.03),inset 0 -20px 40px rgba(255,255,255,.025),var(--shadow)}
/* the person's Glass setting */
:root[data-glass="clear"]{--glass:rgba(255,255,255,.05);--glass-2:rgba(255,255,255,.1);--glass-3:rgba(255,255,255,.18);--glass-deep:rgba(28,20,15,.42);--blur:blur(18px) saturate(190%)}
:root[data-glass="frosted"]{--glass:rgba(255,255,255,.09);--glass-2:rgba(255,255,255,.15);--glass-3:rgba(255,255,255,.23);--blur:blur(36px) saturate(180%)}
:root[data-glass="solid"]{--glass:rgba(34,26,20,.66);--glass-2:rgba(48,38,30,.74);--glass-3:rgba(64,52,42,.82);--glass-deep:rgba(30,22,17,.93);--blur:blur(40px) saturate(130%)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--glass-line);background:var(--glass-2);color:var(--ink);padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;line-height:1.2;white-space:nowrap;text-decoration:none;box-shadow:var(--hi)}
.btn:hover{background:var(--glass-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.btn.primary:hover{background:#F1ECE6}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--glass-2)}
.btn.danger{color:var(--red);border-color:rgba(255,120,100,.5)}
.btn.danger.solid{background:var(--red-dot);border-color:var(--red-dot);color:#2a0d07}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.pinned{background:var(--sky-soft);border-color:transparent;color:var(--sky)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:inherit;flex:none;position:relative}
.icon-btn:hover{background:var(--glass-2)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn.solid{background:var(--glass-2);border:1px solid var(--glass-line)}
.icon-btn.white{background:#fff;color:var(--accent-ink)}
.linkish{border:0;background:none;padding:0;color:var(--sky);font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* form controls */
.field{display:grid;gap:6px}
.field > span{font-size:13px;font-weight:700;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:12.5px}
.input,.select,textarea{width:100%;border:1px solid var(--glass-line);background:rgba(255,255,255,.08);border-radius:var(--r-sm);padding:9px 12px;line-height:1.35;color:var(--ink)}
textarea{resize:vertical;min-height:64px}
.input:focus,.select:focus,textarea:focus{outline:2px solid var(--sky);outline-offset:-1px;border-color:transparent;background:rgba(255,255,255,.12)}
.select.sm{padding:6px 10px;font-size:13px;width:auto;border-radius:999px}
input[type=range]{accent-color:#fff}
input[type=checkbox],input[type=radio]{accent-color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}

/* tags */
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px 2px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.lvl::before{content:"";width:8px;height:8px;border-radius:50%}
.lvl.red{color:var(--red);background:var(--red-soft)} .lvl.red::before{background:var(--red-dot);box-shadow:0 0 8px var(--red-dot)}
.lvl.amber{color:var(--amber);background:var(--amber-soft)} .lvl.amber::before{background:var(--amber-dot)}
.lvl.green{color:var(--green);background:var(--green-soft)} .lvl.green::before{background:var(--green-dot)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);padding:1px 9px;border-radius:999px;border:1px solid var(--glass-line);white-space:nowrap}
.dept{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.dept i{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.due{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.due.over{color:var(--red);font-weight:700}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.st.ok{color:var(--green);font-weight:700}
.st.todo{color:var(--sky);font-weight:700}
.st.warn{color:var(--amber);font-weight:700}
.st.bad{color:var(--red);font-weight:700}
.st.muted{color:var(--ink-3)}
.you{font-size:11px;font-weight:700;color:var(--accent-ink);background:#fff;padding:0 6px;border-radius:99px;margin-left:6px}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;letter-spacing:.02em;line-height:1;font-family:var(--f-body);box-shadow:0 0 0 1.5px rgba(255,255,255,.55)}

/* bars */
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;flex:1;min-width:48px}
.bar > i{display:block;height:100%;background:#fff;border-radius:inherit;transition:width .3s}
.bar.full > i,.bar > i.full{background:var(--green-dot)}
.bar.sm{width:64px;flex:none}
.bar.big{height:9px;margin-bottom:6px}

/* shell */
.shell{position:relative;height:100%;display:grid;grid-template-columns:62px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px 14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-height:58px;padding:7px 8px 7px 8px;border-radius:999px;position:relative;z-index:20}
.greet{display:flex;align-items:center;gap:10px;min-width:0}
.greet b{display:block;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.10);border:1px solid var(--glass-line);border-radius:999px;padding:0 14px;height:40px;width:min(440px,100%);color:var(--ink-3);margin:0 auto}
.tsearch input{border:0;background:transparent;outline:none;flex:1;min-width:0;color:var(--ink);height:100%}
.w-search{flex:none;width:auto;margin:0;height:38px;padding:0 6px 0 14px}
.tsearch:focus-within{border-color:var(--glass-line-2);background:rgba(255,255,255,.16)}
.menu-btn,.search-btn{display:none}
.badge{position:absolute;top:1px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--red-dot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--f-mono);box-shadow:0 0 0 2px rgba(40,28,20,.6)}
.bell-wrap{position:relative}
.pop-scrim{position:fixed;inset:0;z-index:30}
.pop{position:absolute;right:0;top:48px;width:min(370px,calc(100vw - 32px));background:var(--glass-deep);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--shadow);z-index:31;padding:8px}
.pop-h{padding:6px 8px 8px;display:flex;justify-content:space-between;align-items:center}
.pop-i{display:flex;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px;border-radius:10px;align-items:flex-start}
.pop-i:hover{background:var(--glass-2)}
.pop-i .lvl{margin-top:1px}
.pop-t{font-weight:700;font-size:13.5px;line-height:1.3}

/* left rail */
.rail{grid-column:1;grid-row:2;align-self:start;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 7px;border-radius:999px;position:relative;z-index:15}
.rail-h{display:none}
.rail-i{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink-2)}
.rail-i:hover,.rail-i.on{background:var(--glass-3);color:var(--ink)}
.rail-i .sq{width:16px;height:16px;border-radius:5px;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.rail-i .lbl{position:absolute;left:54px;top:50%;transform:translateY(-50%);background:#fff;color:var(--accent-ink);font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.rail-i:hover .lbl,.rail-i:focus-visible .lbl{opacity:1}
.rail-sep{width:24px;height:1px;background:var(--glass-line);margin:4px 0}

/* stage */
.stage{grid-column:2;grid-row:2;border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:0;overflow:hidden;display:grid;grid-template-columns:292px minmax(0,1fr);min-height:0;transition:margin-right .2s ease}
.board-col{overflow-y:auto;padding:22px 0 130px 22px}
.content{overflow-y:auto;padding:24px 28px 140px;min-width:0}
.page{max-width:960px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head .sub{color:var(--ink-2);margin-top:5px;max-width:62ch}
.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.inline-board{display:none}

/* board (needs you) */
.board{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-lg);padding:16px 14px 10px;box-shadow:var(--hi)}
.board-top{display:flex;align-items:flex-end;gap:12px;margin:6px 0 14px}
.board-num{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:60px;line-height:.86;font-variant-numeric:tabular-nums;text-shadow:0 4px 24px rgba(0,0,0,.25)}
.board-cap{font-size:13px;color:var(--ink-2);line-height:1.3;padding-bottom:4px}
.board-cap em{font-style:normal;color:var(--red);font-weight:700}
.lvlbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.14);gap:2px}
.lvlbar i.red{background:var(--red-dot)} .lvlbar i.amber{background:var(--amber-dot)} .lvlbar i.green{background:var(--green-dot)}
.lvl-legend{display:flex;gap:2px;margin:8px -4px 6px;flex-wrap:wrap}
.lvl-legend button{border:0;background:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 6px;border-radius:999px}
.lvl-legend button:hover{background:var(--glass-2)}
.lvl-legend i{width:8px;height:8px;border-radius:50%}
.lvl-legend i.red{background:var(--red-dot)} .lvl-legend i.amber{background:var(--amber-dot)} .lvl-legend i.green{background:var(--green-dot)}
.board-rows{border-top:1px solid var(--glass-line);margin:4px -4px 0;padding-top:6px}
.board-row{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:10px;text-align:left;font-size:14px}
.board-row:hover{background:var(--glass-2)}
.board-row span{flex:1}
.board-row b{font-family:var(--f-mono);font-weight:500}
.board-row .ic{color:var(--ink-3)}
.board-note{font-size:12.5px;color:var(--ink-3);padding:12px 6px 0;line-height:1.45}
.board-note button{border:0;background:none;color:var(--ink-2);text-decoration:underline;padding:0;font-size:12.5px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;max-width:calc(100% - 24px)}
.dock-i{position:relative;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-2);padding:9px 14px;border-radius:999px;font-weight:700;font-size:13.5px;white-space:nowrap}
.dock-i:hover{color:var(--ink);background:var(--glass-2)}
.dock-i.on{background:var(--glass-3);color:var(--ink)}
.dock-i b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;background:var(--red-dot);color:#fff;border-radius:99px;padding:0 6px;line-height:17px}
.dock .plus{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--accent-ink);border:0;display:grid;place-items:center;margin-left:6px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.dock .plus:hover{transform:scale(1.05)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button:hover{background:var(--glass-2);color:var(--ink)}
.seg button.on{background:#fff;color:var(--accent-ink)}
.seg button b{font-family:var(--f-mono);font-weight:500;font-size:12px;opacity:.75}
.ldot{width:8px;height:8px;border-radius:50%;display:inline-block}
.ldot.red{background:var(--red-dot)} .ldot.amber{background:var(--amber-dot)} .ldot.green{background:var(--green-dot)}

/* cards */
.group{display:grid;gap:10px}
.group-h{display:flex;align-items:center;gap:10px;font-size:13px;font-family:var(--f-body);font-weight:700;color:var(--ink-2)}
.group-h .n{font-family:var(--f-mono);font-weight:500;color:var(--ink-3)}
.cards{display:grid;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-width:0;box-shadow:var(--hi);transition:background .15s,transform .15s}
.card:hover{background:var(--glass-2);transform:translateY(-1px)}
.card.is-red{border-color:rgba(255,120,100,.45)}
.card.is-open{outline:2px solid #fff;outline-offset:-1px;background:var(--glass-2)}
.card.is-closed{opacity:.65}
.card-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card-top .when{margin-left:auto;color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.card-title{font-family:var(--f-body);font-weight:700;font-size:16px;line-height:1.3;margin-top:9px;display:flex;gap:8px;align-items:baseline;font-stretch:100%}
.card-body{color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--ink-2)}
.card-meta .from{display:inline-flex;align-items:center;gap:7px;min-width:0}
.card-meta .meta-i{display:inline-flex;align-items:center;gap:4px}
.card-meta .meta-end{margin-left:auto}
.dot-new{width:9px;height:9px;border-radius:50%;background:var(--sky);flex:none;transform:translateY(-1px);box-shadow:0 0 10px var(--sky)}
.empty{background:var(--glass);border:1px dashed var(--glass-line-2);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2);display:grid;gap:8px;justify-items:center}
.empty h3{font-size:17px;color:var(--ink)}

/* detail sheet */
.detail{position:fixed;top:14px;right:max(16px,env(safe-area-inset-right,0px));bottom:14px;width:min(470px,calc(100% - 32px));z-index:40;border-radius:var(--r-lg);overflow-y:auto;background:var(--glass-deep);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);box-shadow:var(--hi),var(--shadow)}
.detail-scrim{display:none}
.detail-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(40,29,22,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-line)}
.dno{font-size:14px;color:var(--ink-3)}
.detail-body{padding:18px 20px 60px;display:grid;gap:18px}
.d-title{font-size:22px;font-stretch:108%;line-height:1.2;margin-top:-6px}
.d-from{display:flex;gap:10px;align-items:center}
.d-text{white-space:pre-wrap;font-size:15px;line-height:1.55}
.notice{display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.action{background:rgba(255,255,255,.12);border:1px solid var(--glass-line-2);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.action.done{display:flex;align-items:center;gap:8px;background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:700;font-size:14px}
.action.look{display:flex;align-items:center;justify-content:space-between;gap:12px}
.action-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.action-h .eyebrow{color:#fff}
.action-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input{flex:1}
.pct{font-size:20px;font-weight:500;min-width:52px;text-align:right}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.qbtn{border:1px solid var(--glass-line);background:var(--glass);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.qbtn.on{background:#fff;border-color:#fff;color:var(--accent-ink)}
.opts{display:grid;gap:6px}
.opt{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;font-weight:700}
.opt.on{border-color:#fff;box-shadow:inset 0 0 0 1px #fff}
.sect{display:grid;gap:10px;border-top:1px solid var(--glass-line);padding-top:16px}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res{display:grid;gap:5px}
.res-top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px}
.res-who{display:flex;gap:4px;flex-wrap:wrap}
.plist{list-style:none;margin:0;padding:0;display:grid}
.plist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--glass-line);flex-wrap:wrap}
.plist li:last-child{border-bottom:0}
.pl-main{flex:1;min-width:140px}
.pl-name{font-weight:700;font-size:14px}
.pl-bar{display:flex;align-items:center;gap:8px;width:120px}
.pl-flags{display:flex;gap:6px;flex-wrap:wrap}
.thread{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.t-item{display:flex;gap:10px}
.t-main{flex:1;min-width:0;display:grid;gap:6px}
.t-head{font-size:13.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.t-text{white-space:pre-wrap;font-size:14.5px}
.t-sys{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3);padding-left:4px}
.pct-pill{font-family:var(--f-mono);font-size:12px;background:#fff;color:var(--accent-ink);padding:0 7px;border-radius:99px}
.pct-pill.full{background:var(--green-dot);color:#0b2a17}
.comment{display:grid;gap:8px}

/* attachments */
.atts{display:grid;gap:8px}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--glass-line);border-radius:var(--r-sm);overflow:hidden;padding:0;background:var(--glass);aspect-ratio:4/3;max-width:100%}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.25)}
.thumb-missing{font-size:12px;color:var(--ink-3);padding:8px;display:grid;place-items:center;height:100%}
.doc-row{display:flex;align-items:center;gap:10px;border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:8px 10px;background:var(--glass)}
.doc-ic{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--accent-ink);display:grid;place-items:center;flex:none}
.doc-meta{flex:1;min-width:0}
.doc-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-sub{font-size:12px;color:var(--ink-3)}
.attach{display:grid;gap:8px}
.attach-list{display:grid;gap:6px}
.attach-item{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:5px 6px}
.attach-item img,.attach-item video{width:40px;height:40px;object-fit:cover;border-radius:7px;flex:none}
.attach-doc{width:40px;height:40px;display:grid;place-items:center;background:var(--glass-2);border-radius:7px;flex:none}
.attach-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}

/* modal */
.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.modal{background:var(--glass-deep);-webkit-backdrop-filter:blur(34px) saturate(160%);backdrop-filter:blur(34px) saturate(160%);border:1px solid var(--glass-line);border-radius:var(--r-lg);box-shadow:var(--hi),var(--shadow);width:min(560px,100%);display:flex;flex-direction:column;max-height:100%;min-height:0}
.modal.wide{width:min(720px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--glass-line)}
.modal-body{padding:16px 18px;display:grid;gap:16px;overflow-y:auto;min-height:0}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--glass-line);flex-wrap:wrap;align-items:center}
.modal-foot .reach{margin-right:auto;font-size:13px;color:var(--ink-2)}

/* composer */
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.typepick button,.lvlpick button{border:1px solid var(--glass-line);background:var(--glass);border-radius:var(--r);padding:10px;text-align:left;display:grid;gap:4px}
.typepick button b,.lvlpick button b{display:flex;align-items:center;gap:6px;font-size:14px}
.typepick button small,.lvlpick button small{color:var(--ink-3);font-size:12px;line-height:1.3}
.typepick button.on{background:#fff;border-color:#fff;color:var(--accent-ink)}
.typepick button.on small{color:rgba(34,24,15,.7)}
@media (max-width:620px){.typepick{grid-template-columns:1fr 1fr}}
.lvlpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvlpick button.on.red{border-color:var(--red-dot);background:var(--red-soft)}
.lvlpick button.on.amber{border-color:var(--amber-dot);background:var(--amber-soft)}
.lvlpick button.on.green{border-color:var(--green-dot);background:var(--green-soft)}
@media (max-width:480px){.lvlpick{grid-template-columns:1fr}}
.tofield{position:relative}
.tobox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--glass-line);border-radius:var(--r-sm);padding:6px 8px;background:rgba(255,255,255,.08);min-height:44px}
.tobox:focus-within{outline:2px solid var(--sky);outline-offset:-1px;border-color:transparent}
.tobox input{border:0;outline:none;background:transparent;flex:1;min-width:140px;padding:3px 2px}
.tag{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--accent-ink);border-radius:99px;padding:2px 4px 2px 10px;font-weight:700;font-size:13px}
.tag.team{background:var(--c);color:#fff}
.tag button{border:0;background:none;color:inherit;display:grid;place-items:center;padding:2px;border-radius:50%}
.tag button:hover{background:rgba(0,0,0,.12)}
.sugs{position:absolute;left:0;right:0;top:calc(100% + 4px);background:rgba(44,32,24,.94);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--shadow);z-index:5;padding:5px;max-height:300px;overflow-y:auto}
.sug{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:9px}
.sug.hi{background:var(--glass-3)}
.sug .sq{width:28px;height:28px;border-radius:8px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none}
.sug-sub{font-size:12px;color:var(--ink-3)}
.reach-line{font-size:13px;color:var(--ink-2)}
.poll-edit{display:grid;gap:6px}
.poll-row{display:flex;gap:6px}

/* team */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--hi)}
.stat b{display:block;font-family:var(--f-display);font-stretch:120%;font-size:32px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.stat.bad b{color:var(--red)} .stat.warn b{color:var(--amber)} .stat.ok b{color:var(--green)}
.mrow{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r)}
.mrow-h{display:grid;grid-template-columns:minmax(180px,1.6fr) repeat(4,minmax(70px,.7fr)) 28px;gap:12px;align-items:center;padding:10px 14px;width:100%;border:0;background:none;text-align:left}
.mrow-h .who{display:flex;gap:10px;align-items:center;min-width:0}
.mrow-h .num{font-family:var(--f-mono);font-size:14px}
.mrow-h .lab{display:none}
.mhead{display:grid;grid-template-columns:minmax(180px,1.6fr) repeat(4,minmax(70px,.7fr)) 28px;gap:12px;padding:0 14px;font-size:12px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mtasks{border-top:1px solid var(--glass-line);padding:6px 14px 10px;display:grid}
.mtask{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--glass-line);flex-wrap:wrap}
.mtask:last-child{border-bottom:0}
.mtask .t{flex:1;min-width:180px;font-weight:700;font-size:14px;border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.mtask .t:hover{color:var(--sky)}
@media (max-width:760px){
  .mhead{display:none}
  .mrow-h{grid-template-columns:1fr 1fr;row-gap:6px}
  .mrow-h .who{grid-column:1/-1}
  .mrow-h .lab{display:inline;color:var(--ink-3);font-size:12px;font-family:var(--f-body)}
  .mrow-h .chev{display:none}
}

/* departments */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dcard{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:10px;box-shadow:var(--hi)}
.dcard:hover{background:var(--glass-2)}
.dcard-h{display:flex;align-items:center;gap:10px}
.dsw{width:30px;height:30px;border-radius:9px;background:var(--c);flex:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}
.stack{display:flex}
.stack .av{margin-left:-6px}
.stack .av:first-child{margin-left:0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:3px;background:rgba(255,255,255,.08);border:1px solid var(--glass-line);border-radius:999px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:6px 14px;font-weight:700;color:var(--ink-2);border-radius:999px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:#fff;color:var(--accent-ink)}
.tabs button b{font-family:var(--f-mono);font-weight:500;font-size:12px;opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:8px;align-content:start;min-height:136px;box-shadow:var(--hi);transition:background .15s,transform .15s}
.tile:hover{background:var(--glass-2);transform:translateY(-2px)}
.tile-ic{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c) 70%,transparent);display:grid;place-items:center;font-size:24px;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tile-t{font-weight:700;font-size:15px;line-height:1.25}
.tile-k{font-size:12.5px;color:var(--ink-3)}
.tile.add{border-style:dashed;place-items:center;align-content:center;color:var(--ink-2);text-align:center}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.iconpick button{border:1px solid transparent;background:var(--glass);border-radius:10px;font-size:20px;height:40px;line-height:1}
.iconpick button.on{border-color:#fff;background:var(--glass-3)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:var(--c)}
.swatches button.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.manual{white-space:pre-wrap;line-height:1.6;font-size:15px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--glass-line);cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;flex:none}
.chk .txt{flex:1}
.chk.on .txt{color:var(--ink-3);text-decoration:line-through}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-size:12px;border:1px solid var(--glass-line);border-radius:8px;padding:3px 8px;font-family:var(--f-mono)}

/* drive */
.drive{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}
.drives{display:grid;gap:2px}
.drv{display:flex;align-items:center;gap:9px;border:0;background:none;padding:8px 12px;border-radius:999px;text-align:left;width:100%;font-weight:700;color:var(--ink)}
.drv:hover{background:var(--glass-2)}
.drv.on{background:#fff;color:var(--accent-ink)}
.drv.locked{color:var(--ink-3);font-weight:400}
.drv span{flex:1}
.drv i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
@media (max-width:900px){.drive{grid-template-columns:1fr}.drives{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}.drv{width:auto;white-space:nowrap;border:1px solid var(--glass-line)}}
.dtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dtool .tsearch{width:auto;flex:1;min-width:220px;margin:0}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:14px}
.crumbs button{border:0;background:none;padding:3px 8px;border-radius:999px;font-weight:700;color:var(--sky)}
.crumbs button:hover{background:var(--glass-2)}
.crumbs .cur{font-weight:700;padding:3px 6px}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.folder{display:flex;align-items:center;gap:10px;border:1px solid var(--glass-line);background:var(--glass);border-radius:var(--r-sm);padding:10px 12px;text-align:left;font-weight:700}
.folder:hover{background:var(--glass-2)}

/* files: folders like real ones, on a light dotted desk. A folder-shaped back (tab on the right), pages inside that rise and
   tip back on hover, and a frosted front with the name. Three looks: photo (the newest photo fills the back), white and dark. */
.fc-defs{position:absolute;width:0;height:0}
.fdesk{border-radius:var(--r-lg);background:rgba(250,249,247,.93) radial-gradient(circle,rgba(40,30,20,.13) 1px,transparent 1.3px) 0 0/18px 18px;
  box-shadow:inset 0 1px 0 #fff,0 18px 50px rgba(12,7,3,.3);padding:8px 26px 30px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:46px 34px;padding-top:44px}
.fdesk-empty{color:rgba(28,22,18,.55);font-size:13px;margin:22px 0 0}
.fcard{position:relative;aspect-ratio:1.36;--ink-f:#17130f;--sub-f:rgba(23,19,15,.5);--paper:#fbfaf7;--line:#e7e2da;--ext:#a0968a;--btn:#141110;--btn-ink:#fff}
.fc-back{position:absolute;inset:0;clip-path:url(#fc-shape);-webkit-clip-path:url(#fc-shape);background:linear-gradient(150deg,#d9cbbb,#8f7b68) center/cover no-repeat}
.fc-back::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.12))}
.fcard::before{content:"";position:absolute;left:10%;right:10%;bottom:-4px;height:26%;border-radius:50%;background:rgba(30,20,10,.32);filter:blur(16px);z-index:0}
.fc-papers{position:absolute;inset:0;pointer-events:none;perspective:700px}
.fc-paper{position:absolute;left:10%;right:10%;top:21%;height:58%;border-radius:8px;overflow:hidden;background:var(--paper);z-index:calc(3 - var(--i));
  box-shadow:0 6px 16px rgba(0,0,0,.2);transform:translateY(calc(var(--i) * 4.5%)) scale(calc(1 - var(--i) * .04));transform-origin:50% 100%;
  transition:transform .6s cubic-bezier(.2,1.05,.35,1) calc((2 - var(--i)) * 50ms)}
.fc-paper img{width:100%;height:100%;object-fit:cover;display:block}
.fc-sheet{display:grid;gap:6px;align-content:start;padding:11px 13px;height:100%}
.fc-sheet b{font:600 9px/1 var(--f-mono);color:var(--ext);letter-spacing:.09em;margin-bottom:2px}
.fc-sheet i{display:block;height:3px;border-radius:2px;background:var(--line)}
.fc-sheet i:nth-child(3){width:78%}.fc-sheet i:nth-child(4){width:56%}
.fcard:hover .fc-paper,.fcard:focus-within .fc-paper{transform:translate(calc(var(--i) * -3%),calc(-36% + var(--i) * 13%)) rotateX(calc(16deg - var(--i) * 5deg)) rotate(calc(-3deg + var(--i) * 2.5deg)) scale(calc(1 - var(--i) * .035))}
.fc-front{position:absolute;left:0;right:0;bottom:0;height:58%;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:1px;text-align:left;
  padding:0 58px 14px 16px;border-radius:14px 14px 17px 17px;border:0;color:var(--ink-f);
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.9));backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 -4px 14px rgba(0,0,0,.06);transform-origin:50% 100%;transition:transform .55s cubic-bezier(.2,1,.35,1)}
.fcard:hover .fc-front,.fcard:focus-within .fc-front{transform:perspective(800px) rotateX(-12deg)}
.fc-front b{font:650 14.5px/1.2 var(--f-display);letter-spacing:-.005em}
.fc-front small{display:flex;align-items:center;gap:6px;color:var(--sub-f);font-size:11px}
.fc-front small i{width:6px;height:6px;border-radius:50%;flex:none}
.fc-add{position:absolute;right:12px;bottom:12px;z-index:6;width:32px;height:32px;border-radius:10px;border:0;display:grid;place-items:center;background:var(--btn);color:var(--btn-ink);
  box-shadow:0 3px 10px rgba(0,0,0,.22);transition:transform .2s}
.fc-add:hover{transform:scale(1.07)}
.fcard.white{--paper:#26221f;--line:rgba(255,255,255,.14);--ext:rgba(255,255,255,.45);--btn:#fff;--btn-ink:#17130f}
.fcard.white .fc-back{background-image:linear-gradient(160deg,#fbfbfa,#e3e1dd)}
.fcard.white .fc-front{background:linear-gradient(180deg,rgba(255,255,255,.86),#fff)}
.fcard.white .fc-add{box-shadow:0 0 0 1px rgba(0,0,0,.08),0 3px 10px rgba(0,0,0,.12)}
.fc-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed rgba(40,30,20,.22);border-radius:18px;background:rgba(255,255,255,.35);color:#17130f;transition:background .2s,border-color .2s}
.fc-new:hover{background:rgba(255,255,255,.7);border-color:rgba(40,30,20,.4)}
.fc-new::before{display:none}
.fc-new b{font:650 14px var(--f-display)}.fc-new small{font-size:11px;color:rgba(23,19,15,.5)}
.fc-new-i{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#151110;color:#fff;margin-bottom:6px}
.fdesk.mini .fc-new b{font-size:12px}.fdesk.mini .fc-new small{display:none}.fdesk.mini .fc-new-i{width:26px;height:26px;border-radius:8px}
.fv-move{margin:0 0 6px;max-width:280px}
.fcard.dark{--ink-f:#fff;--sub-f:rgba(255,255,255,.58);--paper:#f4f1ec;--btn:#fff;--btn-ink:#17130f}
.fcard.dark .fc-back{background-image:linear-gradient(160deg,#3d3936,#141210)}
.fcard.dark .fc-back::after{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.3))}
.fcard.dark .fc-front{background:linear-gradient(180deg,rgba(38,34,31,.72),rgba(16,14,12,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 -4px 14px rgba(0,0,0,.14)}
/* the bar at the top of the screen (Windows app): a dark pill hanging from the top edge that opens into a chat panel */
html.bar-mode,html.bar-mode body,html.bar-mode #root{background:transparent!important;overflow:hidden}
.fbar{position:fixed;left:50%;top:0;transform:translateX(-50%);display:flex;justify-content:center;font:13px/1.35 var(--f-body)}
/* Floorboard's island (Windows app): in the same spot as Coucou's, black, hanging from the top of the screen */
.isl{position:fixed;left:50%;top:0;transform:translateX(-50%);font:13px/1.35 var(--f-body);color:#e9ebee;display:flex;justify-content:center}
.isl-pill{display:flex;align-items:center;gap:10px;height:32px;min-width:288px;max-width:310px;padding:0 10px 0 8px;border:0;border-radius:0 0 18px 18px;background:var(--isl-bg,#000);color:#e9ebee;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.isl-peek{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:rgba(233,235,238,.68);text-align:center}
.isl-peek b{color:#fff;font-weight:700}
.isl-arrive{display:block;flex:none;animation:isl-arrive .75s cubic-bezier(.3,1.35,.5,1)}
.isl-pill .isl-peek{animation:isl-fadein .45s ease-out}
@keyframes isl-arrive{0%{transform:perspective(160px) rotateY(-300deg) scale(.4);opacity:0}60%{opacity:1}100%{transform:perspective(160px) rotateY(0) scale(1)}}
@keyframes isl-fadein{from{opacity:0;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.isl-arrive,.isl-pill .isl-peek{animation:none}}
.isl-mini{display:grid;grid-template-columns:repeat(2,12px);gap:2px 3px;flex:none}
.isl-panel{width:640px;box-sizing:border-box;background:var(--isl-bg,#000);border-radius:0 0 30px 30px;padding:8px 10px 10px;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.isl.tall .isl-panel{height:384px}
.isl-head{display:flex;align-items:center;gap:4px;height:28px;flex:none}
.isl-tab,.isl-btn{display:grid;place-items:center;width:32px;height:28px;border:0;border-radius:14px;background:none;color:rgba(233,235,238,.72);cursor:pointer}
.isl-tab.on{background:rgba(255,255,255,.13);color:#fff}
.isl-tab:hover,.isl-btn:hover{background:rgba(255,255,255,.09);color:#fff}
.isl-btn.sm{width:24px;height:22px}
.isl-sp{flex:1}
.isl-home{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:124px;flex:none}
.isl-home.big{grid-template-columns:1fr;flex:1;height:auto;min-height:0}
.isl-left{display:flex;gap:14px;align-items:center;background:var(--isl-card,#16181c);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:10px 14px 10px 12px;min-width:0;overflow:hidden}
.isl-home.big .isl-left{align-items:flex-start}
.isl-me{flex:none;display:grid;place-items:center;align-self:center}
.isl-home.big .isl-me{align-self:flex-start;margin-top:2px}
.isl-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;background:var(--isl-card,#16181c);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:10px}
.isl-pick{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);border-radius:14px;color:rgba(233,235,238,.8);font:12px var(--f-body);padding:0 10px 0 6px;cursor:pointer;min-width:0}
.isl-pick span:last-child{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isl-pick:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
/* the characters */
.isl-ch{--ex:0;--ey:0;position:relative;display:block;flex:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.isl-svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1.5px 2px rgba(0,0,0,.35))}
.isl-bod{transform-box:fill-box;transform-origin:50% 95%;transform:rotate(calc(var(--ex) * 4deg));transition:transform .25s ease-out}
.isl-look{transform:translate(calc(var(--ex) * 3.2px), calc(var(--ey) * 3px));transition:transform .12s linear}
.isl-ch.slime .isl-look{transform:translate(calc(var(--ex) * 3.8px), calc(var(--ey) * 2.6px))}
.isl-lid{transform-box:fill-box;transform-origin:50% 55%;animation:isl-blink 5.6s infinite;animation-delay:var(--bd,0s);transition:transform .2s}
/* faces: a smile most of the time */
.isl-ch .x-shut,.isl-ch .x-o,.isl-ch .x-grin,.isl-ch .x-heart{display:none}
/* tapped: heart eyes, a grin, a happy squish and hearts floating up */
.isl-ch.love .x-open,.isl-ch.love .x-shut,.isl-ch.love .x-smile,.isl-ch.love .x-o{display:none!important}
.isl-ch.love .x-heart,.isl-ch.love .x-grin{display:inline!important}
.isl-ch.love{animation:isl-squish .55s cubic-bezier(.3,1.6,.5,1)}
.isl-hearts{position:absolute;left:50%;top:0;width:0;height:0;pointer-events:none;z-index:2}
.isl-hearts i{position:absolute;left:var(--dx);top:0;font-style:normal;color:#ff5d7a;font-size:calc(var(--s) * .3);line-height:1;opacity:0;animation:isl-heart 1.3s ease-out forwards;animation-delay:var(--dl);text-shadow:0 1px 2px rgba(0,0,0,.3)}
@keyframes isl-squish{30%{transform:scale(1.12,.86)}60%{transform:scale(.94,1.08) translateY(-3px)}}
@keyframes isl-heart{0%{opacity:0;transform:translateY(4px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(calc(var(--s) * -.9)) scale(1.1)}}
.isl-ch{cursor:pointer}
/* surprised: something came in, or a call rings */
.isl-ch.wig .x-smile,.isl-ch.ring .x-smile{display:none}
.isl-ch.wig .x-o,.isl-ch.ring .x-o{display:inline}
.isl-ch.wig .isl-lid,.isl-ch.ring .isl-lid{animation:none;transform:scale(1.14)}
/* a grin when pointed at */
.isl-pick:hover .isl-ch:not(.wig):not(.ring) .x-smile,.isl-me:hover .isl-ch:not(.wig):not(.ring) .x-smile,.isl-pill:hover .isl-ch:not(.wig):not(.ring) .x-smile{display:none}
.isl-pick:hover .isl-ch:not(.wig):not(.ring) .x-grin,.isl-me:hover .isl-ch:not(.wig):not(.ring) .x-grin,.isl-pill:hover .isl-ch:not(.wig):not(.ring) .x-grin{display:inline}
/* eyes shut when everything has been still a while */
html.isl-sleepy .isl-ch:not(.wig):not(.ring) .x-open{display:none}
html.isl-sleepy .isl-ch:not(.wig):not(.ring) .x-shut{display:inline}
html.isl-sleepy .isl-ch:not(.wig):not(.ring) .isl-svg{animation:isl-snooze 3.4s ease-in-out infinite}
/* moving: ghosts float, busy ones bob, news shakes, a call keeps shaking */
.isl-ch.ghost .isl-svg{animation:isl-float 3.8s ease-in-out infinite;animation-delay:var(--bd,0s)}
.isl-ch.busy .isl-svg{animation:isl-bob 2.2s ease-in-out infinite}
.isl-ch.wig{animation:isl-twirl .8s cubic-bezier(.45,.05,.35,1)}
.isl-ch.ring{animation:isl-ring 1.1s ease-in-out infinite}
.isl-pick:hover .isl-ch,.isl-pill:hover .isl-ch:first-child{transform:translateY(-2px) rotate(-4deg)}
.isl.open .isl-me .isl-ch{animation:isl-hop .55s ease-out}
@keyframes isl-blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
@keyframes isl-float{50%{transform:translateY(-1.6px)}}
@keyframes isl-bob{50%{transform:translateY(-1.5px) scale(1.04,.97)}}
@keyframes isl-snooze{50%{transform:scale(1.03,.97)}}
@keyframes isl-twirl{0%{transform:perspective(200px) rotateY(0)}45%{transform:perspective(200px) translateY(-4px) rotateY(200deg)}100%{transform:perspective(200px) rotateY(360deg)}}
@keyframes isl-shake{12%{transform:translateY(-5px) rotate(-12deg)}30%{transform:translateY(-2px) rotate(11deg)}48%{transform:rotate(-8deg)}66%{transform:rotate(6deg)}84%{transform:rotate(-3deg)}}
@keyframes isl-ring{0%,100%{transform:rotate(0)}10%{transform:translateY(-3px) rotate(-14deg)}20%{transform:rotate(14deg)}30%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}50%{transform:rotate(-6deg)}60%{transform:rotate(0)}}
@keyframes isl-hop{40%{transform:translateY(-6px) scale(1.05,.95)}70%{transform:translateY(0) scale(.96,1.04)}}
@media (prefers-reduced-motion:reduce){.isl-ch,.isl-ch .isl-svg,.isl-ch.wig,.isl-ch.ring,.isl.open .isl-me .isl-ch,.isl-lid{animation:none!important;transition:none}.isl-look,.isl-bod{transform:none}}
.isl-n{position:absolute;top:-5px;right:-7px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:#ff3b30;color:#fff;font:700 10px/16px var(--f-body);text-align:center;box-shadow:0 0 0 2px var(--isl-bg,#000)}
.isl-ch.tiny .isl-n{top:-3px;right:-3px;min-width:6px;width:6px;height:6px;padding:0;font-size:0;border-radius:3px;box-shadow:0 0 0 1px #000}
/* the big card */
.isl-big{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:0;align-self:stretch;justify-content:center}
.isl-big.tall{height:100%;justify-content:flex-start}
.isl-ch-row{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0;flex:none}
.isl-ch-row b{white-space:nowrap}
.isl-ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isl-dot{width:7px;height:7px;border-radius:50%;flex:none}
.isl-sub{color:rgba(233,235,238,.5);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.isl-count{color:rgba(233,235,238,.5);font-size:12px;white-space:nowrap}
.isl-jump{display:grid;place-items:center;width:22px;height:22px;border:0;border-radius:11px;background:rgba(255,255,255,.08);color:rgba(233,235,238,.7);cursor:pointer;flex:none}
.isl-jump:hover{background:rgba(255,255,255,.16);color:#fff}
.isl-search{display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 10px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:rgba(233,235,238,.6);flex:none}
.isl-search:focus-within{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.1)}
.isl-search input{flex:1;min-width:0;border:0;background:none;outline:none;color:#fff;font:inherit;font-size:12.5px;height:100%}
.isl-search input::placeholder{color:rgba(233,235,238,.45)}
.isl-x{border:0;background:none;color:inherit;cursor:pointer;display:grid;place-items:center;width:20px;height:20px}
.isl-line{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:#e9ebee;min-width:0}
.isl-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isl-prev{font-size:12px;color:rgba(233,235,238,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.isl-lines{display:grid;gap:4px;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer;min-width:0;font:inherit}
.isl-list{display:grid;gap:2px;overflow-y:auto;min-height:0;align-content:start}
.isl-list.short{overflow:hidden}
.isl-row{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:4px 6px;border-radius:10px;cursor:pointer;min-width:0;font:inherit}
.isl-row:hover{background:rgba(255,255,255,.07)}
.isl-row.static{cursor:default}.isl-row.static:hover{background:none}
.isl-row>span{flex:1;min-width:0;display:grid}
.isl-row b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.isl-row small{font-size:11.5px;color:rgba(233,235,238,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.isl-row.warn>svg{color:#ffcf85;flex:none}
.isl-unread{width:6px;height:6px;border-radius:50%;flex:none}
.isl-row.new .isl-unread{background:#60A5FA}
.isl-row.new b{color:#fff}
.isl-row>.isl-wa-av,.isl-wa-av{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(74,222,128,.18);color:#4ADE80;font-weight:700;font-size:11px;flex:none}
.ask-work,.isl-askwork{display:block;margin:6px 4px 0;font-size:11px;line-height:1.35;color:var(--ink-3)}

.ask-flags{display:grid;gap:12px}.ask-flags td{vertical-align:top}

.isl-who-row b{font-size:13px}

.isl-empty{margin:6px 2px;color:rgba(233,235,238,.55);font-size:12px}

.isl-group{display:grid;gap:1px}
.isl-from{margin:0 2px;font-size:12px;color:rgba(233,235,238,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.isl-more{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#e9ebee;border-radius:999px;padding:5px 12px;font:600 12px var(--f-body);cursor:pointer;justify-self:start}

.isl-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.isl-closed{display:grid;gap:8px;align-content:start}.isl-closed p{margin:0;color:rgba(233,235,238,.6);font-size:12.5px}
.isl-read{flex:1;min-height:0;overflow-y:auto;display:grid;gap:6px;align-content:start;padding-right:4px}

.isl .fbar-thread{height:100%;flex:1;min-height:0}

.isl-drop{display:flex;align-items:center;gap:26px;height:124px;box-sizing:border-box;border:1.5px dashed rgba(74,222,128,.45);border-radius:20px;padding:0 34px;background:radial-gradient(ellipse at 50% 130%,rgba(74,222,128,.16),transparent 70%),#0b0d0e;cursor:pointer;flex:none}

/* ---------------- small utils ---------------- */
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const dkey = (t = Date.now()) => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const keyPlus = (n) => dkey(Date.now() + n * DAY);
const keyToDate = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const hm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDay = (t, o) => new Date(t).toLocaleDateString('en-ZA', o || { day: 'numeric', month: 'short' });
const fmtKey = (k, o) => fmtDay(keyToDate(k), o || { weekday: 'short', day: 'numeric', month: 'short' });
function ago(t) {
  if (!t) return '';
  const diff = Date.now() - t;
  if (diff < MIN) return 'just now';
  if (diff < HOUR) return Math.floor(diff / MIN) + ' min ago';
  if (dkey(t) === dkey()) return 'today ' + hm(t);
  if (dkey(t) === keyPlus(-1)) return 'yesterday ' + hm(t);
  if (diff < 6 * DAY) return fmtDay(t, { weekday: 'short' }) + ' ' + hm(t);
  return fmtDay(t);
}
function since(t) { const d = Date.now() - t; if (d < HOUR) return Math.max(1, Math.floor(d / MIN)) + ' min'; if (d < DAY) return Math.floor(d / HOUR) + ' h'; return Math.floor(d / DAY) + (Math.floor(d / DAY) === 1 ? ' day' : ' days'); }
function dueText(k) {
  const t = dkey();
  if (k < t) return 'Overdue · ' + fmtKey(k, { day: 'numeric', month: 'short' });
  if (k === t) return 'Due today';
  if (k === keyPlus(1)) return 'Due tomorrow';
  return 'Due ' + fmtKey(k);
}
const rand = (n) => (n == null || n === '' || isNaN(n)) ? '' : 'R ' + Number(n).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmtSize(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return Math.round(b / 1024) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }
const extOf = (n) => (n.match(/\.([a-z0-9]+)$/i) || [, 'file'])[1];
const kindOf = (mime) => mime.startsWith('image/') ? 'image' : mime.startsWith('video/') ? 'video' : mime.startsWith('audio/') ? 'audio' : 'doc';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return true; } catch (e) { return false; } }

/* ---------------- file blobs: IndexedDB, with in-memory fallback ---------------- */
const Blobs = (() => {
  const mem = new Map(); let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try { const r = indexedDB.open('floorboard-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('b'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); }
      catch (e) { res(null); }
    });
    return dbp;
  }
  async function put(id, blob) {
    mem.set(id, blob);
    const d = await open();
    if (d) { try { await new Promise((res, rej) => { const tx = d.transaction('b', 'readwrite'); tx.objectStore('b').put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { /* kept in memory for this visit */ } }
    try { window.dispatchEvent(new CustomEvent('floorboard-blob', { detail: id })); } catch (e) { }
  }
  // path: where the server keeps it, for files that aren't under att/ (personal files live under me/<person>/)
  async function get(id, path) {
    if (mem.has(id)) return mem.get(id);
    const d = await open();
    if (d) {
      try { const b = await new Promise((res) => { const rq = d.transaction('b', 'readonly').objectStore('b').get(id); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); }); if (b) return b; } catch (e) { }
    }
    // not on this device yet: fetch it from the store's server and keep a copy
    if (CLOUD) { try { const { data, error } = await CLOUD.storage.from('files').download(path || 'att/' + id); if (!error && data) { await put(id, data); return data; } } catch (e) { } }
    return null;
  }
  // is it already on this device? (without loading it)
  async function has(id) {
    if (mem.has(id)) return true;
    const d = await open(); if (!d) return false;
    try { return await new Promise((res) => { const rq = d.transaction('b', 'readonly').objectStore('b').getKey(id); rq.onsuccess = () => res(rq.result !== undefined); rq.onerror = () => res(false); }); } catch (e) { return false; }
  }
  // fetch from the server into this device's copy, without keeping it in memory
  async function keep(id, path) {
    if (!CLOUD || await has(id)) return;
    try { const { data, error } = await CLOUD.storage.from('files').download(path || 'att/' + id); if (!error && data) { await put(id, data); mem.delete(id); } } catch (e) { }
  }
  async function clear() { mem.clear(); const d = await open(); if (!d) return; try { d.transaction('b', 'readwrite').objectStore('b').clear(); } catch (e) { } }
  return { put, get, has, keep, clear };
})();
// Files added with no signal: saved on the device straight away, sent to the store's server once there's a connection.
const UPLOADS_KEY = 'floorboard.uploads.v1';
const Uploads = {
  busy: false, listeners: new Set(),
  list() { try { return JSON.parse(localStorage.getItem(UPLOADS_KEY)) || []; } catch (e) { return []; } },
  save(l) { try { localStorage.setItem(UPLOADS_KEY, JSON.stringify(l)); } catch (e) { } this.listeners.forEach((f) => f(l.length)); },
  add(item) { this.save([...this.list().filter((x) => x.id !== item.id), item]); },
  async send(id, path, blob, mime) {
    if (!navigator.onLine) return false;
    try { const { error } = await CLOUD.storage.from('files').upload(path, blob, { contentType: mime, upsert: true }); if (error) { console.warn('Upload failed: ' + error.message); return false; } return true; }
    catch (e) { console.warn('Upload failed', e); return false; }
  },
  async retry() {
    if (!CLOUD || this.busy || !navigator.onLine) return;
    this.busy = true;
    try {
      for (const u of this.list()) {
        const blob = await Blobs.get(u.id);
        if (!blob) { this.save(this.list().filter((x) => x.id !== u.id)); continue; } // gone from this device: nothing left to send
        if (await this.send(u.id, u.path, blob, u.mime)) this.save(this.list().filter((x) => x.id !== u.id)); else break;
      }
    } finally { this.busy = false; }
  },
};
// An admin seeing the app as someone else (People & access › See what they see): look only, so nothing is uploaded or saved.
const SEEAS_KEY = 'floorboard.seeas.v1';
const LookOnly = { on: false };
// What the admin sees of that person's app: their own pins (sticky notes, list, signature) and the chats the admin isn't in
// stay private. Tasks sent in those chats still show, because they're on that person's board.
function seeAsDb(db, me, them) {
  const hidden = new Set(db.chats.filter((c) => !chatMembers(db, c).includes(me)).map((c) => c.id));
  const pins = { ...db.pins }; delete pins[them];
  return { ...db, pins,
    chats: db.chats.map((c) => (hidden.has(c.id) ? { ...c, private: true } : c)),
    messages: db.messages.filter((m) => !hidden.has(m.chat) || m.postId) };
}
// folder: where on the server, 'att/' for everything everyone in the store can open, or 'me/<person>/' for personal files
async function storeFiles(files, folder) {
  const out = [];
  for (const f of files) {
    const id = uid('a'), path = (folder || 'att/') + id;
    await Blobs.put(id, f.file);
    if (CLOUD && !LookOnly.on && !(await Uploads.send(id, path, f.file, f.mime))) Uploads.add({ id, path, mime: f.mime });
    out.push({ id, name: f.name, mime: f.mime, size: f.size, kind: f.kind, ...(folder ? { path } : {}) });
  }
  return out;
}

/* ---------------- downloads capability (lights up inside the Claude viewer) ---------------- */
let dlApi = null; const dlListeners = new Set();
function initDownloads() {
  if (!(window.claude && window.claude.use)) return false;
  window.claude.use('downloads').then((api) => { dlApi = api; dlListeners.forEach((f) => f()); }).catch(() => { });
  return true;
}
if (!initDownloads()) window.addEventListener('load', initDownloads, { once: true });
function useDl() {
  const [, force] = useState(0);
  useEffect(() => { const f = () => force((x) => x + 1); dlListeners.add(f); return () => dlListeners.delete(f); }, []);
  return dlApi;
}
async function saveFile(name, getData, toast) {
  if (!dlApi) return;
  const data = await getData();
  if (!data) { toast('This file isn’t stored on this device.', 'warn'); return; }
  try { await dlApi.save({ filename: name, data }); toast('Saved ' + name); }
  catch (e) {
    const c = e && e.code;
    if (c === 'declined') return;
    if (c === 'rejected_extension' || c === 'extension_not_enabled') toast('This file type can’t be saved from here.', 'warn');
    else if (c === 'rate_limited') toast('A save is already waiting for your answer.', 'warn');
    else toast('The file couldn’t be saved here.', 'warn');
  }
}
function saveAttachment(a, toast) {
  if (a.demo && a.kind === 'image') return saveFile(a.name.replace(/\.[^.]+$/, '') + '.svg', async () => decodeURIComponent(demoArt(a.demo).split(',')[1]), toast);
  return saveFile(a.name, () => Blobs.get(a.id, a.path), toast);
}

/* ---------------- data helpers ---------------- */
const userById = (db, id) => db.users.find((u) => u.id === id);
// A tag target is a department, Everyone/All managers, or a project/issue group (ids start with g-).
const isGroupId = (id) => typeof id === 'string' && id.startsWith('g-');
const deptById = (db, id) => PSEUDO[id] || db.depts.find((d) => d.id === id) || (db.groups || []).find((g) => g.id === id) || { id, name: 'Removed team', color: '#777' };
const firstName = (u) => (u ? u.name.split(' ')[0] : 'Someone');
function deptMembers(db, id) {
  const act = db.users.filter((u) => u.active !== false);
  if (id === 'all') return act.map((u) => u.id);
  if (id === 'managers') return act.filter((u) => u.role !== 'staff').map((u) => u.id);
  if (isGroupId(id)) { const g = (db.groups || []).find((x) => x.id === id); return g ? act.filter((u) => g.members.includes(u.id)).map((u) => u.id) : []; }
  return act.filter((u) => u.depts.includes(id) || u.manages.includes(id)).map((u) => u.id);
}
function expand(db, toUsers, toDepts, author) {
  const s = new Set(toUsers); toDepts.forEach((d) => deptMembers(db, d).forEach((id) => s.add(id))); s.delete(author); return [...s];
}
const isManagerOf = (u, deptId) => u.role === 'admin' || u.manages.includes(deptId);
function canSee(db, p, u) {
  if (u.role === 'admin' || p.author === u.id || p.recips[u.id]) return true;
  if (p.type === 'approval' && canPay(db, u)) return true;
  if (!u.manages.length) return false;
  if (u.manages.includes(p.about) || p.toDepts.some((d) => u.manages.includes(d))) return true;
  return Object.keys(p.recips).some((id) => { const m = userById(db, id); return m && m.depts.some((d) => u.manages.includes(d)); });
}
const pollClosed = (p) => !!(p.poll && p.poll.closes && p.poll.closes < dkey());
function needsMe(p, id) {
  const r = p.recips[id]; if (!r || p.closed) return false; if (p.type === 'vote' && pollClosed(p)) return false;
  if (p.type === 'approval' && !r.answer && !r.paid && !r.rejected && !apOpen(p)) return false; // someone else already decided
  return r.status !== 'done';
}
function isOverdue(p, id) {
  if (!p.due || p.closed || p.due >= dkey()) return false;
  if (p.type === 'approval' && !apOpen(p)) return false;
  if (id) { const r = p.recips[id]; return !!r && r.status !== 'done'; }
  return Object.values(p.recips).some((r) => r.status !== 'done');
}
function isStale(p, id) {
  const r = p.recips[id];
  if (p.type !== 'task' || !r || r.status === 'done' || p.closed) return false;
  return Date.now() - (r.updatedAt || p.createdAt) > 2 * DAY;
}
function progressOf(p) {
  const rs = Object.values(p.recips); if (!rs.length) return { done: 0, total: 0, pct: 0 };
  const done = rs.filter((r) => r.status === 'done').length;
  const pct = p.type === 'task' ? Math.round(rs.reduce((a, r) => a + (r.status === 'done' ? 100 : r.pct || 0), 0) / rs.length) : Math.round(done / rs.length * 100);
  return { done, total: rs.length, pct };
}
function sortNeeds(uidv) {
  return (a, b) => LEVELS[a.level].rank - LEVELS[b.level].rank || (isOverdue(b, uidv) - isOverdue(a, uidv)) || (a.due || '9999').localeCompare(b.due || '9999') || b.createdAt - a.createdAt;
}
function toLabel(db, p) {
  return [...p.toDepts.map((d) => '@' + deptById(db, d).name), ...p.toUsers.map((u) => '@' + firstName(userById(db, u)))].join(', ');
}
function applyFilters(list, f) {
  return list.filter((p) => (f.type === 'any' || p.type === f.type) && (f.level === 'any' || p.level === f.level) && (f.dept === 'any' || p.about === f.dept || p.toDepts.includes(f.dept)));
}
function canDrive(u, d) { return u.role === 'admin' || d.access.includes('all') || d.access.some((x) => u.depts.includes(x) || u.manages.includes(x)); }
const featureOn = (dept, key) => !!(dept && dept.features && dept.features[key]);
// A department's drive appears once Drive is switched on for it; the shared drive appears with the first one.
function driveOn(db, d) {
  if (d.id === 'd-shared') return db.depts.some((x) => featureOn(x, 'drive'));
  return featureOn(db.depts.find((x) => 'd-' + x.id === d.id), 'drive');
}
function folderPath(db, fid) { const parts = []; let f = db.folders.find((x) => x.id === fid); while (f) { parts.unshift(f.name); f = db.folders.find((x) => x.id === f.parent); } return parts.join(' › '); }
function fileMatches(db, f, q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean); if (!words.length) return true;
  const drv = db.drives.find((d) => d.id === f.drive);
  const hay = [f.name, f.docType, f.ref, f.party, f.hardCopy, (f.tags || []).join(' '), folderPath(db, f.folder), drv && drv.name, f.docDate, f.amount != null ? String(f.amount) : ''].join(' ').toLowerCase();
  return words.every((w) => hay.includes(w));
}

/* ---------------- on shift / off shift, and escalating ASAP items ---------------- */
// Per person: { mode: 'on' | 'off' | 'auto', start, end, days (0 is Sunday), tz }. No status means on shift.
// The server's alert function uses the same rule, so phone alerts and the app agree on who is on.
const SHIFT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const toMins = (t) => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
function onShiftAt(st, now = Date.now()) {
  if (!st || !st.mode || st.mode === 'on') return true;
  if (st.mode === 'off') return false;
  const days = st.days || [1, 2, 3, 4, 5];
  const local = new Date(now - (st.tz || 0) * MIN);
  const day = local.getUTCDay(), mins = local.getUTCHours() * 60 + local.getUTCMinutes();
  const s = toMins(st.start || '08:00'), e = toMins(st.end || '17:00');
  if (s <= e) return days.includes(day) && mins >= s && mins < e;
  return (days.includes(day) && mins >= s) || (days.includes((day + 6) % 7) && mins < e); // overnight shift
}
const shiftOf = (db, id) => (db.status || {})[id] || null;
const isOnShift = (db, id) => onShiftAt(shiftOf(db, id));
function shiftNote(db, id) {
  const st = shiftOf(db, id);
  if (onShiftAt(st)) return '';
  return st && st.mode === 'auto' ? 'Off shift · back ' + (st.start || '08:00') : 'Off shift';
}
// An ASAP item that nobody has opened after 30 minutes goes to the managers of the people it was sent to.
const ESCALATE_AFTER = 30 * MIN;
function escalationDue(p, now) {
  if (p.level !== 'red' || p.closed || p.escalatedAt) return false;
  const age = now - p.createdAt;
  if (age < ESCALATE_AFTER || age > 12 * HOUR) return false;
  const rs = Object.entries(p.recips).filter(([id]) => id !== p.author);
  return rs.length > 0 && rs.every(([, r]) => !r.seen && r.status !== 'done');
}
function escalateTo(db, p) {
  const skip = new Set([p.author, ...Object.keys(p.recips)]);
  const depts = new Set(p.toDepts.filter((d) => !PSEUDO[d] && !isGroupId(d)));
  Object.keys(p.recips).forEach((id) => { const u = userById(db, id); if (u) u.depts.forEach((d) => depts.add(d)); });
  const act = db.users.filter((u) => u.active !== false && !skip.has(u.id));
  const mgrs = act.filter((u) => u.role !== 'staff' && u.manages.some((d) => depts.has(d)));
  return (mgrs.length ? mgrs : act.filter((u) => u.role === 'admin')).map((u) => u.id);
}
function escalate(d, id, now) {
  const p = d.posts.find((x) => x.id === id);
  if (!p || !escalationDue(p, now)) return;
  const to = escalateTo(d, p), names = to.map((m) => firstName(userById(d, m))).join(', ');
  p.escalatedAt = now; p.escalatedTo = to;
  to.forEach((m) => { p.recips[m] = { status: 'todo', pct: 0, seen: null, updatedAt: null, escalated: now }; });
  // fixed ids, so two devices doing this at the same moment still leave one entry
  p.activity.push({ id: 'e-esc-' + p.id, kind: 'system', esc: true, user: p.author, at: now, text: 'nobody opened it within 30 minutes, ' + (to.length ? 'so it went to ' + names : 'and there’s no manager to send it to') });
  if (p.chat && d.chats.some((c) => c.id === p.chat) && to.length) d.messages.push({ id: 'm-esc-' + p.id, chat: p.chat, user: p.author, at: now, kind: 'system', text: '⚠ #' + p.no + ' (ASAP) wasn’t opened within 30 minutes, so it went to ' + names, attachments: [], mentions: [] });
}

// voice: also offer a voice note, recorded right there and attached like any other file
function AttachPicker({ files, setFiles, label, voice }) {
  const ref = useRef(null); const { toast } = useApp();
  const [rec, setRec] = useState(null), [secs, setSecs] = useState(0), recRef = useRef(null);
  recRef.current = rec;
  useEffect(() => { if (!rec) return; const t = setInterval(() => setSecs(Math.round((Date.now() - rec.started) / 1000)), 500); return () => clearInterval(t); }, [rec]);
  useEffect(() => () => { const r = recRef.current; if (r) { r.mr.onstop = null; try { r.mr.stop(); } catch (e) { /* already stopped */ } r.stream.getTracks().forEach((t) => t.stop()); } }, []);
  const record = async () => {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) { toast('Voice notes aren’t available here. They work in the installed app.', 'warn'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream), chunks = [];
      mr.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      mr.start(); setSecs(0); setRec({ started: Date.now(), mr, chunks, stream });
    } catch (e) { toast('The microphone is blocked here, so voice notes can’t record.', 'warn'); }
  };
  const stopRec = (keep) => {
    const r = rec; if (!r) return;
    setRec(null);
    r.mr.onstop = () => {
      r.stream.getTracks().forEach((t) => t.stop());
      if (!keep || !r.chunks.length) return;
      const type = r.mr.mimeType || 'audio/webm', blob = new Blob(r.chunks, { type }), s = Math.max(1, Math.round((Date.now() - r.started) / 1000));
      setFiles((prev) => [...prev, { tmp: uid('t'), file: blob, name: 'Voice note ' + Math.floor(s / 60) + ':' + pad(s % 60) + (type.includes('mp4') ? '.m4a' : '.webm'), mime: type, size: blob.size, kind: 'audio', url: URL.createObjectURL(blob) }]);
    };
    r.mr.stop();
  };
  const onPick = (e) => {
    const ok = [];
    for (const f of [...e.target.files]) {
      if (f.size > 100 * 1048576) { toast(f.name + ' is over 100 MB', 'warn'); continue; }
      const mime = f.type || 'application/octet-stream'; const kind = kindOf(mime);
      ok.push({ tmp: uid('t'), file: f, name: f.name, mime, size: f.size, kind, url: kind !== 'doc' ? URL.createObjectURL(f) : null });
    }
    setFiles((prev) => [...prev, ...ok]); e.target.value = '';
  };
  return html`<div className="attach">
    <input type="file" ref=${ref} multiple hidden onChange=${onPick} accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.ppt,.pptx"/>
    <div className="attach-btns"><button type="button" className="btn sm" onClick=${() => ref.current && ref.current.click()}><${Icon} n="clip" s=${15}/>${label || 'Attach photo, video or file'}</button>
      ${voice && (rec ? html`<span className="rec-inline"><span className="rec-dot"></span>Recording ${Math.floor(secs / 60)}:${pad(secs % 60)}<button type="button" className="btn sm primary" onClick=${() => stopRec(true)}><${Icon} n="check" s=${14}/>Keep it</button><button type="button" className="btn sm ghost" onClick=${() => stopRec(false)}>Cancel</button></span>`
        : html`<button type="button" className="btn sm" onClick=${record}><${Icon} n="mic" s=${15}/>Voice note</button>`)}</div>
    ${files.length > 0 && html`<div className="attach-list">${files.map((f) => html`<div className="attach-item" key=${f.tmp}>
      ${f.kind === 'image' ? html`<img src=${f.url} alt=""/>` : f.kind === 'video' ? html`<video src=${f.url} muted></video>` : html`<span className="attach-doc"><${Icon} n=${f.kind === 'audio' ? 'mic' : 'doc'}/></span>`}
      <span className="attach-name">${f.name} <span className="muted">· ${fmtSize(f.size)}</span>${f.kind === 'audio' && f.url && html`<audio src=${f.url} controls preload="metadata"></audio>`}</span>
      <button type="button" className="icon-btn sm" aria-label=${'Remove ' + f.name} onClick=${() => setFiles((prev) => prev.filter((x) => x.tmp !== f.tmp))}><${Icon} n="close" s=${14}/></button>
    </div>`)}</div>`}
  </div>`;
}

/* ---------------- Floorboard's island: at the top of the screen, laid out and working like Coucou's ---------------- */
// The bar grown into an island (Windows app), in the same spot and working the same way as Coucou's island: closed, a
// small black island in the top middle with the cards' characters, each with a count of what came in since that card
// was last opened (it wiggles when it grows); open, the Home tab has the chosen card big on the left and the others in a
// grid on the right (click one to bring it big), 💬 is Ask Floorboard (or JARVIS), and ➕ takes files dropped on it. A
// chat, an email, a search or a list makes the island taller. Layout and behaviour follow Coucou's island
// (github.com/Louis-CFM/coucou, MIT licence); its name, characters, icon and sounds are Coucou's own, so these are

// Where the pointer is, in the island window's own coordinates: the Windows app sends it from anywhere on the screen,
// and every character's eyes turn to it (or to somewhere of their own when it rests). Still with reduced motion.
const ISL_PTR = { x: -1, y: -1, at: Date.now() };
function useIslandEyes() {
  useEffect(() => {
    const d = window.floorboardDesktop, still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const set = (x, y) => { if (x !== ISL_PTR.x || y !== ISL_PTR.y) { ISL_PTR.x = x; ISL_PTR.y = y; ISL_PTR.at = Date.now(); } };
    const mm = (e) => set(e.clientX, e.clientY);
    window.addEventListener('mousemove', mm);
    const off = d && d.island && d.island.onCursor ? d.island.onCursor((p) => set(p.x, p.y)) : null;
    let raf = 0, last = 0, wander = { x: 0, y: 0, next: 0 };
    const tick = (t) => {
      raf = requestAnimationFrame(tick);
      if (t - last < 33) return; last = t; // 30 looks a second is plenty
      const now = Date.now(), idle = now - ISL_PTR.at;
      document.documentElement.classList.toggle('isl-sleepy', idle > 2 * 60 * 1000);
      let tx = ISL_PTR.x, ty = ISL_PTR.y;
      if (idle > 8000) { if (now > wander.next) wander = { x: Math.random() * innerWidth, y: 20 + Math.random() * 260, next: now + 2000 + Math.random() * 4000 }; tx = wander.x; ty = wander.y; }
      document.querySelectorAll('.isl-ch').forEach((el) => {
        const r = el.getBoundingClientRect(), dx = tx - (r.left + r.width / 2), dy = ty - (r.top + r.height * 0.38), dist = Math.hypot(dx, dy) || 1, k = still ? 0 : Math.min(1, dist / 90);
        el.style.setProperty('--ex', (dx / dist * k).toFixed(2)); el.style.setProperty('--ey', (dy / dist * k).toFixed(2));
      });
    };
    raf = requestAnimationFrame(tick);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('mousemove', mm); if (off) off(); };
  }, []);
}
